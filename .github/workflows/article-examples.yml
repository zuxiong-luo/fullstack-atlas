name: Verify article examples
on:
  push:
    branches: [main]
    paths:
      - 'examples/node-execution-model/**'
      - 'examples/node-modules-tooling/**'
      - 'examples/node-http-lifecycle/**'
      - 'examples/node-parallel-computing/**'
      - 'examples/node-performance-memory/**'
      - 'examples/python-course/**'
      - 'examples/python-async-services/**'
      - '.github/workflows/article-examples.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: article-examples-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        example: [node-execution-model, node-modules-tooling, node-http-lifecycle, node-parallel-computing, node-performance-memory]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: examples/${{ matrix.example }}
      - run: npm test
        working-directory: examples/${{ matrix.example }}
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.14'
      - run: python --version
      - run: python -m pip install -r examples/python-course/chapter07/requirements.lock
      - run: python -m unittest discover -s examples/python-course -v
      - name: Beginner Python examples
        working-directory: examples/python-course/beginner
        run: python -m unittest discover -s tests -v
      - name: Original asyncio regression
        working-directory: examples/python-async-services
        run: python -m unittest discover -v
