name: Recheck delivery runtime against retained APKs
on:
  push:
    branches: ['content-validation/native-labs']
    paths: ['.github/workflows/native-runtime-recheck.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  delivery-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      ATLAS_LAB_ARTIFACT_DIR: ${{ runner.temp }}/atlas-runtime-recheck
      ATLAS_LAB_EMULATOR_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify runtime source still equals the original APK build snapshot
        run: git diff --exit-code 9280ec30b31ecc08568e515ff10631dc06262db8 -- examples/cross-platform-delivery examples/react-native-engineering
      - uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: atlas-delivery-artifacts-9280ec30b31ecc08568e515ff10631dc06262db8
          run-id: 40142096668
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/atlas-runtime-recheck
      - name: Install exact local symbolication dependencies
        working-directory: examples/cross-platform-delivery
        run: python3 ../../scripts/platform-lab-ci.py --timeout 240 -- npm ci --ignore-scripts --no-fund --audit=false
      - name: Grant this disposable runner access to KVM
        run: |
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Real emulator against the same hash-checked APK pair
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/platform-lab-ci.py --timeout 240 -- python3 examples/cross-platform-delivery/verify_emulator.py
      - name: Persist compact runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-delivery-runtime-${{ github.sha }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/atlas-runtime-recheck/*.json
            ${{ runner.temp }}/atlas-runtime-recheck/*.txt
            ${{ runner.temp }}/atlas-runtime-recheck/*.png
