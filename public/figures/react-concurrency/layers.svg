<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title"><title id="title">分层：谁记录更新，谁提供执行机会</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#4b8065"/></marker></defs><rect width="1100" height="520" rx="20" fill="#f4f8f5"/><g font-family="system-ui,sans-serif" fill="#263e33"><text x="32" y="48" font-size="29">分层：谁记录更新，谁提供执行机会</text><rect x="45" y="110" width="260" height="62" rx="12" fill="#dfede5" stroke="#4b8065"/><text x="57" y="149" font-size="21">更新：action + Lane</text><rect x="420" y="110" width="260" height="62" rx="12" fill="#dfede5" stroke="#4b8065"/><text x="432" y="149" font-size="21">根：选择 nextLanes</text><rect x="805" y="110" width="240" height="62" rx="12" fill="#dfede5" stroke="#4b8065"/><text x="817" y="149" font-size="21">安排回调</text><path d="M310 142 L415 142" fill="none" stroke="#4b8065" stroke-width="2.5" marker-end="url(#a)"/><path d="M685 142 L800 142" fill="none" stroke="#4b8065" stroke-width="2.5" marker-end="url(#a)"/><text x="325" y="126" font-size="17">传播</text><text x="710" y="126" font-size="17">预约</text><path d="M925 176 L925 270" fill="none" stroke="#4b8065" stroke-width="2.5" marker-end="url(#a)"/><text x="950" y="230" font-size="18">执行机会</text><rect x="805" y="285" width="240" height="62" rx="12" fill="#dfede5" stroke="#4b8065"/><text x="817" y="324" font-size="21">渲染入口重新检查</text><rect x="420" y="285" width="260" height="62" rx="12" fill="#dfede5" stroke="#4b8065"/><text x="432" y="324" font-size="21">Fiber 工作循环</text><rect x="45" y="285" width="260" height="62" rx="12" fill="#dfede5" stroke="#4b8065"/><text x="57" y="324" font-size="21">完成后进入提交</text><path d="M800 317 L685 317" fill="none" stroke="#4b8065" stroke-width="2.5" marker-end="url(#a)"/><path d="M415 317 L310 317" fill="none" stroke="#4b8065" stroke-width="2.5" marker-end="url(#a)"/><text x="45" y="427" font-size="24">更新队列保存状态操作；Scheduler 队列保存回调任务。</text><text x="45" y="474" font-size="22">取消旧回调不等于删除业务更新；根仍会根据 pending 工作重新安排。</text></g></svg>