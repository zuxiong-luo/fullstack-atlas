<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title"><title id="title">交错推进：紧急输入与可等待的列表</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#4b8065"/></marker></defs><rect width="1100" height="520" rx="20" fill="#f4f8f5"/><g font-family="system-ui,sans-serif" fill="#263e33"><text x="32" y="48" font-size="29">交错推进：紧急输入与可等待的列表</text><text x="35" y="112" font-size="22">时间向右 →（示意，无耗时比例）</text><text x="35" y="185" font-size="21">列表工作</text><text x="35" y="285" font-size="21">紧急输入</text><text x="35" y="385" font-size="21">可见页面</text><rect x="180" y="145" width="210" height="62" rx="12" fill="#dfede5" stroke="#4b8065"/><text x="192" y="184" font-size="21">计算部分节点</text><path d="M395 176 L465 176" fill="none" stroke="#4b8065" stroke-width="2.5" marker-end="url(#a)"/><rect x="475" y="145" width="235" height="62" rx="12" fill="#dfede5" stroke="#4b8065"/><text x="487" y="184" font-size="21">让出 / 重新选择</text><path d="M715 176 L790 176" fill="none" stroke="#4b8065" stroke-width="2.5" marker-end="url(#a)"/><rect x="800" y="145" width="250" height="62" rx="12" fill="#dfede5" stroke="#4b8065"/><text x="812" y="184" font-size="21">继续或重新准备</text><path d="M580 212 L580 245" fill="none" stroke="#4b8065" stroke-width="2.5" marker-end="url(#a)"/><rect x="475" y="255" width="235" height="62" rx="12" fill="#dfede5" stroke="#4b8065"/><text x="487" y="294" font-size="21">输入 text 更新</text><path d="M595 321 L595 350" fill="none" stroke="#4b8065" stroke-width="2.5" marker-end="url(#a)"/><rect x="475" y="360" width="235" height="62" rx="12" fill="#dfede5" stroke="#4b8065"/><text x="487" y="399" font-size="21">先提交输入反馈</text><path d="M920 212 L920 350" fill="none" stroke="#4b8065" stroke-width="2.5" marker-end="url(#a)"/><rect x="800" y="360" width="250" height="62" rx="12" fill="#dfede5" stroke="#4b8065"/><text x="812" y="399" font-size="21">列表完成后提交</text><text x="35" y="480" font-size="23">被放弃的 render 不承诺提交；长函数内部不会被 React 任意抢占。</text></g></svg>