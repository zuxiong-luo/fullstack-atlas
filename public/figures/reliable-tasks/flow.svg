<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="560" viewBox="0 0 1060 560" role="img" aria-labelledby="t d"><title id="t">恢复不等于旧进程消失：token2拒绝token1</title><desc id="d">queued/gen0 → Worker A running/token1；短事务已提交；A写出1-1.txt → 在数据库完成之前退出23；PG重启仍running/token1 → 租约到期 → B认领token2；B写1-2.txt → 按token2完成 → completed / effects仅1条；A若恢复提交token1 → stale；1-1.txt仍需对账清理</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#365c49"/></marker></defs><rect width="1060" height="560" rx="20" fill="#f2f7f3"/><g fill="#243e31" font-family="system-ui,sans-serif"><text x="30" y="45" font-size="27" font-weight="700">恢复不等于旧进程消失：token2拒绝token1</text><rect x="30" y="82" width="1000" height="62" rx="10" fill="white" stroke="#83a18c"/><text x="48" y="120" font-size="21" font-weight="700">认领</text><text x="125" y="120" font-size="20">queued/gen0 → Worker A running/token1；短事务已提交</text><path d="M72 145V162" stroke="#365c49" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="165" width="1000" height="62" rx="10" fill="white" stroke="#83a18c"/><text x="48" y="203" font-size="21" font-weight="700">外部</text><text x="125" y="203" font-size="20">A写出1-1.txt → 在数据库完成之前退出23</text><path d="M72 228V245" stroke="#365c49" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="248" width="1000" height="62" rx="10" fill="white" stroke="#83a18c"/><text x="48" y="286" font-size="21" font-weight="700">恢复</text><text x="125" y="286" font-size="20">PG重启仍running/token1 → 租约到期 → B认领token2</text><path d="M72 311V328" stroke="#365c49" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="331" width="1000" height="62" rx="10" fill="white" stroke="#83a18c"/><text x="48" y="369" font-size="21" font-weight="700">发布</text><text x="125" y="369" font-size="20">B写1-2.txt → 按token2完成 → completed / effects仅1条</text><path d="M72 394V411" stroke="#365c49" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="414" width="1000" height="62" rx="10" fill="white" stroke="#83a18c"/><text x="48" y="452" font-size="21" font-weight="700">旧写</text><text x="125" y="452" font-size="20">A若恢复提交token1 → stale；1-1.txt仍需对账清理</text><text x="30" y="535" font-size="16">示意步骤，不表示耗时比例；正常与故障路径由实际PostgreSQL测试验证。</text></g></svg>