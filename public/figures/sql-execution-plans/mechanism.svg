<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img"><title>执行计划：解释实际做了多少工作</title><desc>PostgreSQL17.4教学数据；关键行数可复现，节点与估算随环境可能变化。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285443"/></marker></defs><rect width="1200" height="860" rx="24" fill="#f3f7f4"/><text x="32" y="45" font-family="system-ui,sans-serif" font-size="28" fill="#173c2e" font-weight="700">执行计划：解释实际做了多少工作</text><text x="32" y="85" font-family="system-ui,sans-serif" font-size="18" fill="#173c2e">PostgreSQL17.4教学数据；关键行数可复现，节点与估算随环境可能变化。</text><text x="35" y="135" font-family="system-ui,sans-serif" font-size="23" fill="#173c2e" font-weight="700">客户500取最新20条：结果一样，访问工作不同</text><rect x="40" y="165" width="465" height="130" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="54" y="194" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">无匹配索引：Seq Scan</text><text x="54" y="223" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">输出30，过滤59970</text><text x="54" y="252" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">Sort → Limit20</text><path d="M510 225H680" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#a)"/><rect x="695" y="165" width="470" height="130" rx="12" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="709" y="194" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">复合索引后：Index Only Scan</text><text x="709" y="223" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">沿customer + 时间 + id读取</text><text x="709" y="252" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">Limit20，节点实际输出20</text><text x="35" y="355" font-family="system-ui,sans-serif" font-size="23" fill="#173c2e" font-weight="700">客户1的同一页：OFFSET与keyset</text><rect x="40" y="390" width="465" height="115" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="54" y="419" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">OFFSET10000 LIMIT20</text><text x="54" y="448" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">索引节点实际输出10020</text><text x="54" y="477" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">Limit最终输出20</text><rect x="695" y="390" width="470" height="115" rx="12" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="709" y="419" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">游标(created_at,id)边界</text><text x="709" y="448" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">索引节点实际输出20</text><text x="709" y="477" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">与左侧返回同一页</text><rect x="40" y="580" width="535" height="130" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="54" y="609" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">统计偏差：查queued实际30000</text><text x="54" y="638" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">旧统计估1 → ANALYZE后约30000</text><text x="54" y="667" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">抽样估算可变化，不要求固定30009</text><rect x="630" y="580" width="535" height="130" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="644" y="609" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">排序落盘：work_mem=64kB</text><text x="644" y="638" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">真实external merge / Disk</text><text x="644" y="667" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">并行节点行数需结合loops阅读</text><text x="35" y="800" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">cost不是毫秒；BUFFERS不是直接的冷磁盘测量；不把本机耗时包装成通用速度结论。</text></svg>
