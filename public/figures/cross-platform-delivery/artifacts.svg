<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 820" role="img" aria-labelledby="t d"><title id="t">双版本工件、升级与错误map对应关系</title><desc id="d">固定profile构建v1v2的APK和map，同证书升级保留未变schema的假笔记，v2错误选择v2 map并拒绝v1。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#325b86"/></marker></defs><rect width="820" height="820" fill="white"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif" fill="#17324d"><text x="30" y="45" font-size="27" font-weight="700">交付身份串起来，才知道这一版发生了什么</text><text x="30" y="84" font-size="19">Android单代表链；公开Debug证书，不是生产签名。</text><rect x="30" y="120" width="760" height="85" rx="13" fill="#eff5ff" stroke="#59769b"/><text x="48" y="154" font-size="18">固定源码 + package-lock + 有限profile + 固定原生模板</text><text x="48" y="184" font-size="18">releaseId / nativeCode / versionName / schema分别校验</text><path d="M220 205V255" fill="none" stroke="#325b86" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M600 205V255" fill="none" stroke="#325b86" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="255" width="330" height="115" rx="13" fill="#eff5ff" stroke="#59769b"/><text x="48" y="289" font-size="18">lab-v1 / code1 / schema1</text><text x="48" y="319" font-size="18">APK + 对应Hermes组合map</text><text x="48" y="349" font-size="18">分别记录SHA256</text><rect x="460" y="255" width="330" height="115" rx="13" fill="#eff5ff" stroke="#59769b"/><text x="478" y="289" font-size="18">lab-v2 / code2 / schema1</text><text x="478" y="319" font-size="18">APK + 对应Hermes组合map</text><text x="478" y="349" font-size="18">与v1相同Debug证书</text><path d="M195 370V425" fill="none" stroke="#325b86" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M625 370V425" fill="none" stroke="#325b86" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="425" width="330" height="115" rx="13" fill="#edf8ef" stroke="#59769b"/><text x="48" y="459" font-size="18">先安装v1</text><text x="48" y="489" font-size="18">创建document假笔记</text><text x="48" y="519" font-size="18">created = true</text><rect x="460" y="425" width="330" height="115" rx="13" fill="#edf8ef" stroke="#59769b"/><text x="478" y="459" font-size="18">再install -r升级v2</text><text x="478" y="489" font-size="18">nativeCode2 + 旧v1笔记</text><text x="478" y="519" font-size="18">created = false</text><path d="M360 485H460" fill="none" stroke="#325b86" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M625 540V590" fill="none" stroke="#325b86" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="590" width="760" height="115" rx="13" fill="#fff6e8" stroke="#59769b"/><text x="48" y="624" font-size="18">v2受控JS错误栈 + releaseId → 只选v2 map → 原始函数</text><text x="48" y="654" font-size="18">先选v1：MAP_RELEASE_MISMATCH拒绝；hash防意外混放</text><text x="48" y="684" font-size="18">错误被捕获，应用仍运行；没有冒称native崩溃定位</text><text x="30" y="755" font-size="19" font-weight="700">降级v1应被系统拒绝；重新启动仍v2 / 旧假数据。</text><text x="30" y="791" font-size="17">未变schema ≠ 任意迁移安全；map / APK / 报告同被改写不提供真实性。</text></g></svg>