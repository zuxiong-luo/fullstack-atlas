<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 790" role="img" aria-labelledby="title desc">
<title id="title">沿DNS、TCP、TLS和HTTP保留证据</title><desc id="desc">本地UDP模拟DNS得到地址；真实TCP连接端口；TLS1.3验证atlas.test身份；HTTP读取200或404/503。失败停止于当前层，并保留之前已获得的checks。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315d85"/></marker></defs>
<rect width="760" height="790" fill="white"/>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif" fill="#17324d" font-size="20">
<text x="30" y="42" font-size="28" font-weight="700">这条HTTPS请求，在哪一步停止？</text>
<text x="30" y="81" font-size="18">证据逐层累积；此图限定TCP+TLS1.3+HTTP/1.1。</text>
<rect x="30" y="122" width="400" height="95" rx="12" fill="#fff8e8" stroke="#9c751a"/><text x="50" y="156">DNS：atlas.test → 127.0.0.1</text><text x="50" y="190" font-size="18">本地UDP A/IN模拟，非系统递归解析器</text>
<text x="470" y="158">名字不存在</text><text x="470" y="190">或没有可用响应</text>
<path d="M230 217V267" stroke="#315d85" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="267" width="400" height="95" rx="12" fill="#f0f6ff" stroke="#456f9a"/><text x="50" y="301">TCP：连接地址+动态端口</text><text x="50" y="335" font-size="18">操作系统真实连接，不保证应用健康</text>
<text x="470" y="303">明确拒绝</text><text x="470" y="335">不同于连接超时</text>
<path d="M230 362V412" stroke="#315d85" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="412" width="400" height="95" rx="12" fill="#f0f6ff" stroke="#456f9a"/><text x="50" y="446">TLS：信任证书+atlas.test身份</text><text x="50" y="480" font-size="18">真实TLS1.3，不跳过主机名校验</text>
<text x="470" y="448">未知CA</text><text x="470" y="480">或主机名不匹配</text>
<path d="M230 507V557" stroke="#315d85" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="557" width="400" height="95" rx="12" fill="#f0f6ff" stroke="#456f9a"/><text x="50" y="591">HTTP：路径、Host与响应状态</text><text x="50" y="625" font-size="18">200成功；404/503已有应用响应</text>
<text x="470" y="593">响应状态不成功</text><text x="470" y="625">不同于读取超时</text>
<text x="30" y="704">failed_layer指出停止位置，checks保留此前证据。</text>
<text x="30" y="745" font-size="18">结构示意；不表示公网路由、代理、延迟或OSI四层模型。</text>
</g></svg>
