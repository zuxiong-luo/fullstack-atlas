<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 820" role="img" aria-labelledby="title desc"><title id="title">Nginx切换、排空与显式回滚</title><desc id="desc">held事件确定旧请求已进入v1，reload后新请求命中v2，再释放旧请求；v2业务故障后显式恢复v1并核验。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315d85"/></marker></defs><rect width="820" height="820" fill="white"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif" fill="#17324d"><text x="30" y="43" font-size="27" font-weight="700">reload切换新请求，旧请求继续排空</text><text x="30" y="82" font-size="19">v1、v2都只监听loopback；图为受控协议时序。</text><rect x="30" y="130" width="230" height="95" rx="12" fill="#f0f6ff" stroke="#456f9a"/><text x="48" y="164" font-size="19">旧请求进入v1</text><text x="48" y="194" font-size="19">stdout报告held</text><rect x="295" y="130" width="230" height="95" rx="12" fill="#f0f6ff" stroke="#456f9a"/><text x="313" y="164" font-size="19">校验候选配置</text><text x="313" y="194" font-size="19">replace → reload</text><rect x="560" y="130" width="230" height="95" rx="12" fill="#f0f6ff" stroke="#456f9a"/><text x="578" y="164" font-size="19">新请求观察v2</text><text x="578" y="194" font-size="19">真实HTTP版本确认</text><path d="M260 177H295" fill="none" stroke="#315d85" stroke-width="2.5" marker-end="url(#a)"/><path d="M525 177H560" fill="none" stroke="#315d85" stroke-width="2.5" marker-end="url(#a)"/><path d="M145 225V310" fill="none" stroke="#315d85" stroke-width="2.5" marker-end="url(#a)"/><path d="M675 225V310" fill="none" stroke="#315d85" stroke-width="2.5" marker-end="url(#a)"/><rect x="30" y="310" width="300" height="95" rx="12" fill="#eef8ee" stroke="#456f9a"/><text x="48" y="344" font-size="19">旧worker继续等v1</text><text x="48" y="374" font-size="19">显式/release → 返回v1</text><rect x="490" y="310" width="300" height="95" rx="12" fill="#eef8ee" stroke="#456f9a"/><text x="508" y="344" font-size="19">新worker使用v2</text><text x="508" y="374" font-size="19">旧请求结束后旧worker退出</text><text x="30" y="458" font-size="22" font-weight="700">切换后仍检查业务，不以存活200代替正确性</text><rect x="30" y="495" width="230" height="100" rx="12" fill="#fff8e8" stroke="#456f9a"/><text x="48" y="529" font-size="19">v2业务变500</text><text x="48" y="559" font-size="19">/health仍200</text><rect x="295" y="495" width="230" height="100" rx="12" fill="#f0f6ff" stroke="#456f9a"/><text x="313" y="529" font-size="19">显式恢复旧配置</text><text x="313" y="559" font-size="19">校验后reload</text><rect x="560" y="495" width="230" height="100" rx="12" fill="#eef8ee" stroke="#456f9a"/><text x="578" y="529" font-size="19">同一入口验证</text><text x="578" y="559" font-size="19">200 + version v1</text><path d="M260 545H295" fill="none" stroke="#315d85" stroke-width="2.5" marker-end="url(#a)"/><path d="M525 545H560" fill="none" stroke="#315d85" stroke-width="2.5" marker-end="url(#a)"/><rect x="30" y="655" width="760" height="100" rx="12" fill="#f0f6ff" stroke="#456f9a"/><text x="48" y="689" font-size="19">候选启动42 / ready503 / 非法配置：保留旧入口</text><text x="48" y="719" font-size="19">文件替换原子 ≠ 整个发布事务；路由回滚 ≠ 数据库回滚</text></g></svg>