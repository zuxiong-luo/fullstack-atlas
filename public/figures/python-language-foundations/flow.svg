<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" role="img" aria-labelledby="title desc"><title id="title">名字、对象与笔记导入的数据流</title><desc id="desc">名字、对象与笔记导入的数据流；教学结构示意，箭头标注引用、推进或产出关系，不代表实际内存地址或多个线程。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17324d;font-size:20px}.title{font-size:27px;font-weight:700}.small{font-size:17px}.box{fill:#f0f6ff;stroke:#456f9a;stroke-width:2}.note{fill:#fff7e6;stroke:#9c751a;stroke-width:2}.arrow{fill:none;stroke:#315d85;stroke-width:2.5;marker-end:url(#arrow)}.return{fill:none;stroke:#9c751a;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#315d85"/></marker></defs><rect width="720" height="680" fill="#fff"/><text x="30" y="45" class="title">名字指向对象，修改与重新绑定不同</text><text x="30" y="86" class="small">① append 修改共享列表，两个名字都能观察到</text><rect x="35" y="112" width="155" height="55" rx="12" class="box"/><text x="53" y="143" class="">tags</text><rect x="35" y="195" width="155" height="55" rx="12" class="box"/><text x="53" y="226" class="">alias</text><rect x="385" y="142" width="300" height="80" rx="12" class="box"/><text x="403" y="173" class="">列表 L1</text><text x="403" y="201" class="">[&quot;python&quot;, &quot;web&quot;]</text><path d="M190 140 H270 V165 H385" class="arrow"/><path d="M190 222 H270 V200 H385" class="arrow"/><text x="283" y="131" class="small">引用</text><text x="30" y="293" class="small">② tags = [&quot;other&quot;] 只移动 tags 的绑定</text><rect x="35" y="320" width="155" height="55" rx="12" class="box"/><text x="53" y="351" class="">tags</text><rect x="35" y="415" width="155" height="55" rx="12" class="box"/><text x="53" y="446" class="">alias</text><rect x="385" y="320" width="300" height="55" rx="12" class="box"/><text x="403" y="351" class="">新列表 L2 [&quot;other&quot;]</text><rect x="385" y="415" width="300" height="55" rx="12" class="box"/><text x="403" y="446" class="">原列表 L1 保留</text><path d="M190 347 H385" class="arrow"/><path d="M190 442 H385" class="arrow"/><text x="30" y="515" class="small">③ 导入函数创建新的结果容器，不原地清理输入</text><rect x="35" y="540" width="170" height="75" rx="12" class="box"/><text x="53" y="571" class="">JSON 数组</text><text x="53" y="599" class="">原始记录</text><rect x="275" y="540" width="170" height="75" rx="12" class="box"/><text x="293" y="571" class="">逐条校验 / 清理</text><text x="293" y="599" class="">import_notes</text><rect x="515" y="540" width="170" height="75" rx="12" class="box"/><text x="533" y="571" class="">新结果列表</text><text x="533" y="599" class="">notes</text><path d="M205 578 H275" class="arrow"/><path d="M445 578 H515" class="arrow"/><text x="30" y="653" class="small">引用与数据流示意；不绘制 CPython 的真实内存布局。</text></svg>