<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">列表放多条笔记，字典说明一条笔记</title><desc id="desc">先看外层容器，再取其中一项，最后读取字段。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#356d53"/></marker></defs><rect width="1000" height="600" rx="22" fill="#f5f8f6"/><g font-family="Arial, 'PingFang SC', sans-serif"><text x="40" y="52" font-size="30" fill="#20392f" font-weight="700">列表放多条笔记，字典说明一条笔记</text><text x="40" y="88" font-size="21" fill="#4e675b" font-weight="400">先看外层容器，再取其中一项，最后读取字段。</text><rect x="45" y="130" width="380" height="120" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="67" y="168" font-size="25" fill="#20392f" font-weight="650">notes：列表</text><text x="67" y="207" font-size="22" fill="#20392f" font-weight="400">两项，顺序保留</text><text x="67" y="238" font-size="22" fill="#20392f" font-weight="400">notes[0] 取出第一条字典</text><rect x="510" y="130" width="440" height="165" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="532" y="168" font-size="25" fill="#20392f" font-weight="650">第 0 项：字典</text><text x="532" y="207" font-size="22" fill="#20392f" font-weight="400">title → &quot;学习 Python&quot;  （str）</text><text x="532" y="238" font-size="22" fill="#20392f" font-weight="400">done → False              （bool）</text><text x="532" y="269" font-size="22" fill="#20392f" font-weight="400">notes[0][&quot;title&quot;] 取标题</text><rect x="510" y="350" width="440" height="130" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="532" y="388" font-size="25" fill="#20392f" font-weight="650">第 1 项：字典</text><text x="532" y="427" font-size="22" fill="#20392f" font-weight="400">title → &quot;复习变量&quot;  （str）</text><text x="532" y="458" font-size="22" fill="#20392f" font-weight="400">done → True            （bool）</text><path d="M425 190 L500 190" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><path d="M425 220 L500 410" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="565" font-size="21" fill="#4e675b" font-weight="400">方括号里的数字是位置；引号里的 title 是字段名。</text></g></svg>