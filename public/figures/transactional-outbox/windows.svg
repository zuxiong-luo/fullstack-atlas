<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc"><title id="title">Outbox发布与消费的两个崩溃窗口</title><desc id="desc">订单和Outbox在PostgreSQL同事务提交，发布者XADD后标记发布。发布后标记前死亡会重复发送。消费者Inbox回执和余额同事务提交，提交后ACK前死亡会重复接收。相同业务事件ID抵消重复效果。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#355f50"/></marker></defs><rect width="1120" height="650" rx="20" fill="#f3f7f4"/><g font-family="system-ui,sans-serif" fill="#1b332b"><text x="34" y="44" font-size="24" font-weight="700">跨系统没有一个共同提交点；把每个本地边界先做正确</text><text x="34" y="76" font-size="17">同一个 event_id 贯穿发布与消费；Stream ID 可以因重复发布而不同</text><rect x="35" y="128" width="300" height="113" rx="12" fill="#dcebdc" stroke="#557e66"/><text x="55" y="160" font-size="20">PG 事务 1：订单 + Outbox</text><text x="55" y="192" font-size="17">共同 COMMIT / ROLLBACK</text><text x="55" y="220" font-size="17">发布者只领取已提交待发记录</text><rect x="410" y="128" width="300" height="113" rx="12" fill="white" stroke="#557e66"/><text x="430" y="160" font-size="20">中继：Redis XADD</text><text x="430" y="192" font-size="17">收到成功，再更新 published_at</text><text x="430" y="220" font-size="17">不是订单和 Redis 的分布式事务</text><rect x="785" y="128" width="300" height="113" rx="12" fill="#fff0d8" stroke="#9b763f"/><text x="805" y="160" font-size="20">窗口 1：发布后进程死亡</text><text x="805" y="192" font-size="17">PG 标记未提交，仍是待发</text><text x="805" y="220" font-size="17">恢复后同事件再次 XADD</text><g stroke="#355f50" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M335 184 H406"/><path d="M710 184 H781"/><path d="M935 241 V316 H185 V353"/><path d="M335 415 H406"/><path d="M710 415 H781"/></g><rect x="35" y="360" width="300" height="113" rx="12" fill="white" stroke="#557e66"/><text x="55" y="393" font-size="20">消费者读取 / 重领</text><text x="55" y="425" font-size="17">可能相同传输重投</text><text x="55" y="453" font-size="17">也可能不同 Stream ID 同业务 ID</text><rect x="410" y="360" width="300" height="113" rx="12" fill="#dcebdc" stroke="#557e66"/><text x="430" y="393" font-size="20">PG 事务 2：Inbox + 余额</text><text x="430" y="425" font-size="17">唯一 event_id，内容冲突拒绝</text><text x="430" y="453" font-size="17">同内容重复 → 跳过效果，再 ACK</text><rect x="785" y="360" width="300" height="113" rx="12" fill="#fff0d8" stroke="#9b763f"/><text x="805" y="393" font-size="20">窗口 2：提交后未 ACK</text><text x="805" y="425" font-size="17">PEL 保留，恢复会再次处理</text><text x="805" y="453" font-size="17">Inbox 回执阻止余额再加</text><text x="34" y="542" font-size="18">实验真实 SIGKILL 子进程并观察数据库连接回收，不靠“等一会儿”猜崩溃位置。</text><text x="34" y="577" font-size="18">最终：两条传输记录，业务余额只加 10，Inbox 只有 1 条，PEL 归零。</text><text x="34" y="616" font-size="15">教学逻辑图，不证明跨机副本、断电持久、所有事件全局有序，也不覆盖外部邮件/支付副作用。</text></g></svg>
