<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">bailout与子树工作</title><desc id="desc">memo面板无自身工作，但childLanes含子任务本轮更新，因此跳过面板求值后继续进入Leaf；无子树交集时才返回null。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#416354" stroke-width="1.5"/></marker></defs><rect width="1000" height="600" rx="18" fill="#f7f9f3"/><g font-family="system-ui,sans-serif" fill="#183c31"><text x="32" y="48" font-size="26" font-weight="700">面板跳过求值，子任务仍有本轮工作</text><text x="32" y="84" font-size="18" font-weight="400">renderLanes = {l}；l 代表本次选择的更新位，不指定某类事件。</text><rect x="42" y="120" width="395" height="150" rx="12" fill="#e3eee6" stroke="#6d8f7e"/><text x="64" y="156" font-size="23" font-weight="700">Panel / memo 父</text><text x="64" y="196" font-size="19" font-weight="400">lanes ∩ renderLanes = ∅</text><text x="64" y="232" font-size="19" font-weight="400">childLanes ∩ renderLanes = {l}</text><rect x="540" y="120" width="410" height="150" rx="12" fill="#fff0d9" stroke="#6d8f7e"/><text x="562" y="156" font-size="23" font-weight="700">本节点可以 bailout</text><text x="562" y="196" font-size="19" font-weight="400">但子树不能返回 null</text><text x="562" y="232" font-size="19" font-weight="400">cloneChildFibers → child</text><path d="M437 194H528" fill="none" stroke="#416354" stroke-width="2" marker-end="url(#arrow)"/><path d="M240 270V337" fill="none" stroke="#416354" stroke-width="2" marker-end="url(#arrow)"/><text x="258" y="308" font-size="19" font-weight="400">继续向下</text><rect x="42" y="350" width="395" height="130" rx="12" fill="#e3eee6" stroke="#6d8f7e"/><text x="64" y="389" font-size="23" font-weight="700">Leaf / 子任务</text><text x="64" y="426" font-size="19" font-weight="400">lanes ∩ renderLanes = {l}</text><text x="64" y="459" font-size="19" font-weight="400">处理自己的 state 更新</text><rect x="540" y="350" width="410" height="130" rx="12" fill="#e9eef9" stroke="#6d8f7e"/><text x="562" y="389" font-size="21" font-weight="700">如果 childLanes 也无交集？</text><text x="562" y="426" font-size="19" font-weight="400">默认路径返回 null</text><text x="562" y="459" font-size="19" font-weight="400">本轮才可跳过这段子树</text><text x="32" y="532" font-size="17" font-weight="400">图示是源码推演；实验用公开 state / Context 行为验证，不读取私有 Fiber。</text><text x="32" y="566" font-size="19" font-weight="700">“没有调用父函数” ≠ “没有进入子树” ≠ “没有 DOM 变化”。</text></g></svg>