<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 820" role="img" aria-labelledby="title desc"><title id="title">Kubernetes控制器、Service和探针职责</title><desc id="desc">Deployment经ReplicaSet维护副本，Service与EndpointSlice路由就绪Pod，kubelet探针重启容器，坏更新需显式undo。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315d85"/></marker></defs><rect width="820" height="820" fill="white"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif" fill="#17324d"><text x="30" y="43" font-size="27" font-weight="700">Kubernetes：控制路径与请求路径分开</text><text x="30" y="82" font-size="19">单节点教学模型；Service不承担数据库一致性或自动回滚。</text><rect x="30" y="125" width="320" height="85" rx="12" fill="#f0f6ff" stroke="#456f9a"/><text x="48" y="159" font-size="19">Deployment：期望2副本</text><text x="48" y="189" font-size="19">模板与滚动策略</text><rect x="450" y="125" width="340" height="85" rx="12" fill="#f0f6ff" stroke="#456f9a"/><text x="468" y="159" font-size="19">Service：稳定DNS / ClusterIP</text><text x="468" y="189" font-size="19">选择器关联就绪后端</text><path d="M190 210V280" fill="none" stroke="#315d85" stroke-width="2.5" marker-end="url(#a)"/><text x="207" y="254" font-size="17">维护版本与数量</text><path d="M620 210V280" fill="none" stroke="#315d85" stroke-width="2.5" marker-end="url(#a)"/><text x="637" y="254" font-size="17">发现就绪集合</text><rect x="30" y="280" width="320" height="85" rx="12" fill="#f0f6ff" stroke="#456f9a"/><text x="48" y="314" font-size="19">ReplicaSet</text><text x="48" y="344" font-size="19">创建 / 替换Pod</text><rect x="450" y="280" width="340" height="85" rx="12" fill="#f0f6ff" stroke="#456f9a"/><text x="468" y="314" font-size="19">EndpointSlice：ready端点</text><text x="468" y="344" font-size="19">记录地址 / ready状态</text><path d="M190 365V440" fill="none" stroke="#315d85" stroke-width="2.5" marker-end="url(#a)"/><text x="207" y="408" font-size="17">Pod删除 → 新UID</text><path d="M620 365V405H370V480H350" fill="none" stroke="#315d85" stroke-width="2.5" marker-end="url(#a)"/><rect x="30" y="440" width="320" height="115" rx="12" fill="#f0f6ff" stroke="#456f9a"/><text x="48" y="474" font-size="19">Pod × 2：容器运行单位</text><text x="48" y="504" font-size="19">UID区分对象身份</text><text x="48" y="534" font-size="19">容器ID / restartCount观测</text><rect x="450" y="440" width="340" height="115" rx="12" fill="#f0f6ff" stroke="#456f9a"/><text x="468" y="474" font-size="19">kubelet：执行探针</text><text x="468" y="504" font-size="19">readiness → 流量资格</text><text x="468" y="534" font-size="19">liveness → 原Pod容器重启</text><path d="M450 525H350" fill="none" stroke="#315d85" stroke-width="2.5" marker-end="url(#a)"/><rect x="30" y="610" width="760" height="120" rx="12" fill="#fff8e8" stroke="#456f9a"/><text x="48" y="644" font-size="19">坏更新：候选Running但NotReady → 旧2端点继续v1</text><text x="48" y="674" font-size="19">ProgressDeadlineExceeded只报告停滞，不自动回滚</text><text x="48" y="704" font-size="19">显式undo → 验证v1 → 修正候选后再更新v2</text><text x="30" y="777" font-size="18">节点数据平面转发字节；EndpointSlice仅记录地址和就绪条件。</text></g></svg>