<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title"><title id="title">Node 22.12.0：从 JS 到 I/O，再回到 JS</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315b4a"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f3f7f4"/><style>text{font-family:system-ui,'PingFang SC',sans-serif;fill:#173c2d}.title{font-size:26px;font-weight:650}.label{font-size:20px;font-weight:600}.note{font-size:17px}.edge{font-size:16px;fill:#476454}</style><text x="36" y="48" class="title">Node 22.12.0：从 JS 到 I/O，再回到 JS</text><rect x="40" y="90" width="460" height="100" rx="12" fill="white" stroke="#7ca58f" stroke-width="2"/><text x="58" y="122" class="label">V8 / JavaScript 执行环境</text><text x="58" y="150" class="note">业务函数、回调、Promise 微任务</text><rect x="600" y="90" width="460" height="100" rx="12" fill="white" stroke="#7ca58f" stroke-width="2"/><text x="618" y="122" class="label">Node 宿主接口 / 原生绑定</text><text x="618" y="150" class="note">fs、http/net → C++ 请求包装</text><rect x="40" y="290" width="460" height="110" rx="12" fill="white" stroke="#7ca58f" stroke-width="2"/><text x="58" y="322" class="label">libuv 文件通用路径（本机 macOS）</text><text x="58" y="350" class="note">原生工作池 → 文件系统调用</text><text x="58" y="378" class="note">完成后通知所属事件循环</text><rect x="600" y="290" width="460" height="110" rx="12" fill="white" stroke="#7ca58f" stroke-width="2"/><text x="618" y="322" class="label">libuv 数值地址 TCP 路径</text><text x="618" y="350" class="note">非阻塞 socket → OS 就绪通知</text><text x="618" y="378" class="note">不为每个连接占一个池线程</text><rect x="270" y="510" width="560" height="90" rx="12" fill="white" stroke="#7ca58f" stroke-width="2"/><text x="288" y="542" class="label">所属事件循环 → JavaScript 回调</text><text x="288" y="570" class="note">已就绪仍须等待当前 JS 返回；不抢占同步函数</text><polyline points="500,140 598,140" fill="none" stroke="#315b4a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="510" y="120" class="edge">同步提交</text><polyline points="760,190 760,240 270,240 270,288" fill="none" stroke="#315b4a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="300" y="226" class="edge">readFile 打开 / 分块读取</text><polyline points="830,190 830,288" fill="none" stroke="#315b4a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="850" y="250" class="edge">TCP 连接 / 读写</text><polyline points="270,400 270,460 430,460 430,508" fill="none" stroke="#315b4a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="290" y="448" class="edge">完成通知</text><polyline points="830,400 830,460 670,460 670,508" fill="none" stroke="#315b4a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="850" y="448" class="edge">就绪后推进 HTTP</text></svg>