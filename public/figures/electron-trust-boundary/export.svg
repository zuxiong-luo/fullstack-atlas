<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">报表导出的校验和写入顺序</title><desc id="desc">summary调用依次通过来源、格式、角色、单任务槽位和主进程路径选择，以不覆盖和不跟随符号链接的方式打开文件后写入；未授权窗口在第一步拒绝，finance在角色步拒绝，重复目标在打开步拒绝。</desc><rect width="1000" height="620" rx="22" fill="#f4f7f3"/><g font-family="system-ui,sans-serif" fill="#203d31"><text x="35" y="48" font-size="25" font-weight="700">一次 exportReport('summary') 怎样落到磁盘</text><g font-size="21"><text x="55" y="115">① 来源</text><text x="285" y="115">同一webContents + 主frame + 固定atlas URL</text><text x="55" y="185">② 参数与权限</text><text x="285" y="185">严格reportId → 主进程表 → reader允许summary</text><text x="55" y="255">③ 资源与路径</text><text x="285" y="255">单个in-flight槽位 → 主进程选择exports目录</text><text x="55" y="325">④ 打开与写入</text><text x="285" y="325">临时文件 O_EXCL / O_NOFOLLOW → 写完link发布</text><text x="55" y="395">⑤ 返回与释放</text><text x="285" y="395">filename / bytes → finally释放槽位</text></g><g stroke="#6a8e79" stroke-width="1.5"><path d="M50 139H950M50 209H950M50 279H950M50 349H950M50 419H950"/></g><rect x="40" y="460" width="920" height="120" rx="12" fill="#fff" stroke="#6a8e79"/><text x="60" y="498" font-size="20">反例：未知窗口→UNAUTHORIZED；finance→FORBIDDEN；../x→INVALID_INPUT</text><text x="60" y="541" font-size="20">重复文件/符号链接→ALREADY_EXISTS；磁盘错误→IO_ERROR（内部路径留在日志）</text></g></svg>
