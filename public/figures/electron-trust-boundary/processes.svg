<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="620" viewBox="0 0 1050 620" role="img" aria-labelledby="title desc"><title id="title">Electron三个职责与两道边界</title><desc id="desc">界面运行在沙箱渲染进程主世界，通过contextBridge的两个固定方法进入隔离的preload，再用固定IPC通道请求主进程。主进程校验webContents、mainFrame与URL、参数和角色，再把固定summary报表导出到应用目录。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#315d4a" stroke-width="1.5"/></marker></defs><rect width="1050" height="620" rx="22" fill="#f4f7f3"/><g font-family="system-ui,sans-serif" fill="#203d31"><text x="35" y="48" font-size="25" font-weight="700">界面可以请求能力，主进程仍决定能做什么</text><g fill="#fff" stroke="#6a8e79" stroke-width="2"><rect x="30" y="100" width="300" height="370" rx="16"/><rect x="375" y="100" width="300" height="370" rx="16"/><rect x="720" y="100" width="300" height="370" rx="16"/></g><g font-size="20"><text x="50" y="137" font-weight="700">renderer · 主世界</text><text x="50" y="181">HTML、输入、错误提示</text><text x="50" y="222">Node integration关闭</text><text x="50" y="263">Chromium沙箱启用</text><text x="50" y="306">没有 require / 文件路径API</text><text x="395" y="137" font-weight="700">preload · 隔离世界</text><text x="395" y="181">contextIsolation开启</text><text x="395" y="222">reports.exportReport(id)</text><text x="395" y="263">reports.openHelp()</text><text x="395" y="306">固定通道，不转发event</text><text x="740" y="137" font-weight="700">main · 系统权限</text><text x="740" y="181">检查sender与主frame</text><text x="740" y="222">检查URL、参数与角色</text><text x="740" y="263">选择数据与固定导出目录</text><text x="740" y="306">异步写文件，不覆盖</text></g><g stroke="#315d4a" stroke-width="2.5" marker-end="url(#a)" fill="none"><path d="M330 365H374"/><path d="M675 365H719"/><path d="M720 421H331"/></g><text x="254" y="350" font-size="17">窄contextBridge</text><text x="630" y="350" font-size="17">固定IPC</text><text x="405" y="450" font-size="17">返回：ok / filename / bytes 或稳定错误码</text><text x="40" y="524" font-size="20">preload属于渲染进程中的另一执行上下文，不是第三个独立OS进程。</text><text x="40" y="566" font-size="20">atlas://只映射3个打包资源；新窗口、页面导航、webview和权限请求被拒绝。</text></g></svg>
