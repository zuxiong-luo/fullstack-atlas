<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc"><title id="title">文档导入的四条安全边界</title><desc id="desc">外部输入首先验证会话与CSRF，然后按当前用户和存储owner检查资源权限，再把固定documentId映射为允许目标，通过受控transport限制跳转、时间、大小，最后输出为HTML文本编码。XSS CSRF越权SSRF各在不同边界防守。</desc><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#315a47"/></marker></defs><rect width="1100" height="540" rx="18" fill="#f4f8f5"/><g font-family="system-ui,sans-serif" fill="#213b30"><text x="30" y="42" font-size="25" font-weight="bold">同一个导入操作，四种不同的信任判断</text><g fill="#fff" stroke="#315a47" stroke-width="2"><rect x="30" y="90" width="290" height="130" rx="10"/><rect x="400" y="90" width="300" height="130" rx="10"/><rect x="780" y="90" width="290" height="130" rx="10"/><rect x="400" y="315" width="670" height="140" rx="10"/></g><g font-size="22"><text x="47" y="125">请求身份与CSRF</text><text x="47" y="164">会话 + Origin + token</text><text x="47" y="199">请求自报角色不作证据</text><text x="417" y="125">对象授权</text><text x="417" y="164">stored owner = user</text><text x="417" y="199">本人令牌也不能写别人</text><text x="797" y="125">出站目标</text><text x="797" y="164">documentId → 固定URL</text><text x="797" y="199">拒绝任意URL与重定向</text><text x="420" y="350">输出边界：导入内容仍是不可信数据</text><text x="420" y="389">HTML文本编码；需要富文本时采用成熟清洗器</text><text x="420" y="428">CSP补充约束，HttpOnly不替代XSS修复</text></g><g stroke="#315a47" stroke-width="2" marker-end="url(#a)"><path d="M320 155H395"/><path d="M700 155H775"/><path d="M925 220V310"/></g><text x="30" y="495" font-size="18">本实验：只监听loopback，出站transport为本地桩，不做外部抓取或扫描。</text></g></svg>