<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" role="img" aria-labelledby="title desc"><title id="title">useMemo槽位随依赖变化</title><desc id="desc">首次计算query1为R1，无关更新沿用R1，query6产生R6，再次query1产生新R1，不从历史表取回最初结果。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#416354" stroke-width="1.5"/></marker></defs><rect width="1000" height="730" rx="18" fill="#f7f9f3"/><g font-family="system-ui,sans-serif" fill="#183c31"><text x="32" y="48" font-size="26" font-weight="700">同一实例、同一 Hook 位置：保留一份值与依赖</text><text x="32" y="84" font-size="18" font-weight="400">R 表示引用身份，不是内存地址；下方是四次连续执行的示意。</text><rect x="32" y="120" width="936" height="108" rx="12" fill="#e3eee6" stroke="#6d8f7e"/><text x="54" y="154" font-size="22" font-weight="700">首次 query="1"</text><text x="54" y="196" font-size="18" font-weight="400">调用 calculate</text><text x="580" y="182" font-size="21" font-weight="700">保存 [R1, ["1"]]</text><path d="M500 228V246" fill="none" stroke="#416354" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="258" width="936" height="108" rx="12" fill="#e9eef9" stroke="#6d8f7e"/><text x="54" y="292" font-size="22" font-weight="700">无关 tick 更新</text><text x="54" y="334" font-size="18" font-weight="400">依赖相同，不调用 calculate</text><text x="580" y="320" font-size="21" font-weight="700">沿用 R1</text><path d="M500 366V384" fill="none" stroke="#416354" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="396" width="936" height="108" rx="12" fill="#fff0d9" stroke="#6d8f7e"/><text x="54" y="430" font-size="22" font-weight="700">query 改为 "6"</text><text x="54" y="472" font-size="18" font-weight="400">依赖不同，调用 calculate</text><text x="580" y="458" font-size="21" font-weight="700">保存 [R6, ["6"]]</text><path d="M500 504V522" fill="none" stroke="#416354" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="534" width="936" height="108" rx="12" fill="#e3eee6" stroke="#6d8f7e"/><text x="54" y="568" font-size="22" font-weight="700">query 再改回 "1"</text><text x="54" y="610" font-size="18" font-weight="400">与刚才的 "6" 比较，重新计算</text><text x="580" y="596" font-size="21" font-weight="700">保存 [R1′, ["1"]]</text><text x="32" y="692" font-size="18" font-weight="400">不是按所有历史 query 建立的 Map；另一个组件实例也不会共享这份 Hook。</text></g></svg>