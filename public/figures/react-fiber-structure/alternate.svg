<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" role="img"><title>Fiber alternate 教学示意</title><rect width="1000" height="630" fill="#fff"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#315c47"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#24372e;font-size:20px}.box{fill:#eff5ee;stroke:#557f6e}.line{fill:none;stroke:#315c47;stroke-width:2;marker-end:url(#a)}</style><text x="30" y="40" font-size="26">alternate 连接对应节点，不是递归深拷贝</text><rect class="box" x="40" y="100" width="370" height="55" rx="8"/><text x="54" y="135">current：已提交的节点</text><rect class="box" x="590" y="100" width="370" height="55" rx="8"/><text x="604" y="135">work-in-progress：下一版工作</text><path class="line" d="M410 117H590"/><path class="line" d="M590 143H410"/><text x="440" y="90">alternate</text><rect class="box" x="70" y="220" width="860" height="55" rx="8"/><text x="84" y="255">起始沿用：child / memoizedState / updateQueue 等引用</text><path class="line" d="M500 275V290"/><rect class="box" x="70" y="290" width="860" height="55" rx="8"/><text x="84" y="325">按生命周期处理：清理本轮标记，保留 StaticMask 部分</text><path class="line" d="M500 345V360"/><rect class="box" x="70" y="360" width="860" height="55" rx="8"/><text x="84" y="395">后续协调：处理孩子、状态和待提交变更</text><path class="line" d="M500 415V430"/><rect class="box" x="70" y="430" width="860" height="55" rx="8"/><text x="84" y="465">提交：应用变更，并将 root.current 指向完成树</text><text x="30" y="550">dependencies 对象单独克隆；真实字段处理见 createWorkInProgress。</text><text x="30" y="590">图中是单个对应节点关系，不表示所有节点从挂载起就有 alternate。</text></svg>