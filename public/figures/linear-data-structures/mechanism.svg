<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img"><title>线性结构：顺序相同，维护方式不同</title><desc>数组保持下标顺序；链表维护引用；队列用head与size解释回绕。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285443"/></marker></defs><rect width="1200" height="830" rx="24" fill="#f3f7f4"/><text x="32" y="45" font-family="system-ui,sans-serif" font-size="28" fill="#173c2e" font-weight="700">线性结构：顺序相同，维护方式不同</text><text x="32" y="82" font-family="system-ui,sans-serif" font-size="17" fill="#173c2e">数组保持下标顺序；链表维护引用；队列用head与size解释回绕。</text><text x="35" y="135" font-family="system-ui,sans-serif" font-size="22" fill="#173c2e" font-weight="700">① 动态数组：头插5，需要搬移原来的3项</text><rect x="50" y="155" width="120" height="60" rx="10" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="64" y="185" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">10</text><rect x="205" y="155" width="120" height="60" rx="10" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="219" y="185" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">20</text><rect x="360" y="155" width="120" height="60" rx="10" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="374" y="185" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">30</text><path d="M530 185H680" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#arrow)"/><text x="545" y="165" font-family="system-ui,sans-serif" font-size="16" fill="#173c2e">搬移3次</text><rect x="710" y="155" width="90" height="60" rx="10" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="724" y="185" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">5</text><rect x="822" y="155" width="90" height="60" rx="10" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="836" y="185" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">10</text><rect x="934" y="155" width="90" height="60" rx="10" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="948" y="185" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">20</text><rect x="1046" y="155" width="90" height="60" rx="10" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="1060" y="185" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">30</text><text x="35" y="282" font-family="system-ui,sans-serif" font-size="22" fill="#173c2e" font-weight="700">② 单链表：已知头部引用，接上新节点；按下标找中间前驱还需遍历</text><rect x="65" y="310" width="180" height="70" rx="10" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="79" y="340" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">5 | next</text><path d="M245 345H332" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="335" y="310" width="180" height="70" rx="10" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="349" y="340" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">10 | next</text><path d="M515 345H602" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="605" y="310" width="180" height="70" rx="10" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="619" y="340" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">20 | next</text><path d="M785 345H872" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="875" y="310" width="180" height="70" rx="10" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="889" y="340" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">30 | next</text><text x="65" y="410" font-family="system-ui,sans-serif" font-size="18" fill="#173c2e">head</text><text x="875" y="410" font-family="system-ui,sans-serif" font-size="18" fill="#173c2e">tail</text><text x="35" y="477" font-family="system-ui,sans-serif" font-size="22" fill="#173c2e" font-weight="700">③ 循环队列：物理槽位回绕，逻辑顺序仍从head开始</text><text x="90" y="515" font-family="system-ui,sans-serif" font-size="17" fill="#173c2e">槽位0</text><rect x="65" y="530" width="180" height="70" rx="10" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="79" y="560" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">40</text><text x="360" y="515" font-family="system-ui,sans-serif" font-size="17" fill="#173c2e">槽位1</text><rect x="335" y="530" width="180" height="70" rx="10" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="349" y="560" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">50</text><text x="630" y="515" font-family="system-ui,sans-serif" font-size="17" fill="#173c2e">槽位2</text><rect x="605" y="530" width="180" height="70" rx="10" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="619" y="560" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">20</text><text x="900" y="515" font-family="system-ui,sans-serif" font-size="17" fill="#173c2e">槽位3</text><rect x="875" y="530" width="180" height="70" rx="10" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="889" y="560" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">30</text><text x="610" y="640" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e" font-weight="700">head=2</text><path d="M695 620V603" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1070 605V680H120V603" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#arrow)"/><text x="340" y="673" font-family="system-ui,sans-serif" font-size="18" fill="#173c2e">next逻辑位置：(head+i) % capacity</text><text x="35" y="735" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">size=4，capacity=4；逻辑内容20 → 30 → 40 → 50。再入队须按逻辑顺序复制扩容。</text><text x="35" y="785" font-family="system-ui,sans-serif" font-size="17" fill="#173c2e">槽位是教学模型；复制/搬移/跳转计数不包含界面渲染与引擎分配。</text></svg>
