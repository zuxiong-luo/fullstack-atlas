<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">从输入到返回值，走完一次函数调用</title><desc id="desc">add_minutes 的形参接收输入，return 结束这次调用并交回结果。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#356d53"/></marker></defs><rect width="1000" height="600" rx="22" fill="#f5f8f6"/><g font-family="Arial, 'PingFang SC', sans-serif"><text x="40" y="52" font-size="30" fill="#20392f" font-weight="700">从输入到返回值，走完一次函数调用</text><text x="40" y="88" font-size="21" fill="#4e675b" font-weight="400">add_minutes 的形参接收输入，return 结束这次调用并交回结果。</text><rect x="40" y="150" width="270" height="160" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="62" y="188" font-size="25" fill="#20392f" font-weight="650">调用处</text><text x="62" y="227" font-size="22" fill="#20392f" font-weight="400">add_minutes(20, 10)</text><text x="62" y="258" font-size="22" fill="#20392f" font-weight="400">等函数把结果交回来</text><rect x="365" y="150" width="285" height="210" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="387" y="188" font-size="25" fill="#20392f" font-weight="650">函数内部</text><text x="387" y="227" font-size="22" fill="#20392f" font-weight="400">current = 20</text><text x="387" y="258" font-size="22" fill="#20392f" font-weight="400">extra = 10</text><text x="387" y="289" font-size="22" fill="#20392f" font-weight="400">total = 30</text><text x="387" y="320" font-size="22" fill="#20392f" font-weight="400">return total</text><rect x="710" y="150" width="250" height="160" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="732" y="188" font-size="25" fill="#20392f" font-weight="650">调用结果</text><text x="732" y="227" font-size="22" fill="#20392f" font-weight="400">得到整数 30</text><text x="732" y="258" font-size="22" fill="#20392f" font-weight="400">可以保存或继续计算</text><path d="M310 225 L350 225" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><path d="M650 225 L700 225" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><text x="55" y="440" font-size="25" fill="#20392f" font-weight="400">def 定义规则；带括号并给出实参，才发生这次调用。</text><text x="55" y="485" font-size="25" fill="#20392f" font-weight="400">print 显示内容，return 将结果交给调用方。</text><text x="40" y="565" font-size="21" fill="#4e675b" font-weight="400">参数名、传入的值、返回结果，分别看清楚。</text></g></svg>