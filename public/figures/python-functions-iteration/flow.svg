<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 750" role="img" aria-labelledby="title desc"><title id="title">消费者推进同步生成器管道</title><desc id="desc">消费者推进同步生成器管道；教学结构示意，箭头标注引用、推进或产出关系，不代表实际内存地址或多个线程。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17324d;font-size:20px}.title{font-size:27px;font-weight:700}.small{font-size:17px}.box{fill:#f0f6ff;stroke:#456f9a;stroke-width:2}.note{fill:#fff7e6;stroke:#9c751a;stroke-width:2}.arrow{fill:none;stroke:#315d85;stroke-width:2.5;marker-end:url(#arrow)}.return{fill:none;stroke:#9c751a;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#315d85"/></marker></defs><rect width="720" height="750" fill="#fff"/><text x="30" y="45" class="title">生成器管道：由消费者发起推进</text><text x="30" y="83" class="small">同一线程顺序执行；实线请求下一项，虚线返回记录</text><g transform="translate(-120 0)"><rect x="220" y="110" width="280" height="65" rx="12" class="box"/><text x="238" y="141" class="">CLI 消费者 for / print</text><rect x="220" y="250" width="280" height="90" rx="12" class="box"/><text x="238" y="281" class="">select_unique</text><text x="238" y="309" class="">seen 检查 → predicate</text><rect x="220" y="415" width="280" height="90" rx="12" class="box"/><text x="238" y="446" class="">iter_notes</text><text x="238" y="474" class="">读取 → 解析 → 标准化</text><rect x="220" y="580" width="280" height="65" rx="12" class="box"/><text x="238" y="611" class="">打开的 JSONL 文件</text><path d="M280 175 V250" class="arrow"/><text x="155" y="218" class="small">next</text><path d="M280 340 V415" class="arrow"/><text x="155" y="383" class="small">next</text><path d="M280 505 V580" class="arrow"/><text x="140" y="548" class="small">读下一行</text><path d="M440 580 V505" class="return"/><text x="510" y="548" class="small">完整行</text><path d="M440 415 