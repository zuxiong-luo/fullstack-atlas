<svg xmlns="http://www.w3.org/2000/svg" width="940" height="550" viewBox="0 0 940 550" role="img" aria-labelledby="title desc"><title id="title">先观察等待字节，再释放数据：验证因果而非猜测sleep</title><desc id="desc">服务器先交付壳与占位，测试明确收到后才放行数据，原响应后续继续。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#356b58"/></marker></defs><rect width="940" height="550" fill="#f7faf7"/><g font-family="system-ui,sans-serif"><text x="28" y="42" fill="#23473b" font-size="26">先观察等待字节，再释放数据：验证因果而非猜测sleep</text><text x="45" y="100" fill="#23473b" font-size="20">HTTP客户端</text><path d="M110 120V480" stroke="#8ba397" stroke-dasharray="5 5"/><text x="405" y="100" fill="#23473b" font-size="20">Next服务器</text><path d="M470 120V480" stroke="#8ba397" stroke-dasharray="5 5"/><text x="750" y="100" fill="#23473b" font-size="20">受控数据门</text><path d="M815 120V480" stroke="#8ba397" stroke-dasharray="5 5"/><path d="M115 150H465" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="210" y="140" fill="#23473b" font-size="16">1. 请求报告</text><path d="M465 215H115" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="140" y="201" fill="#23473b" font-size="16">2. 壳 + REGION_PENDING 已到，响应未结束</text><path d="M475 185H810" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="565" y="174" fill="#23473b" font-size="16">先读取，仍在 await</text><path d="M115 310H465" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="185" y="299" fill="#23473b" font-size="16">3. 独立控制请求 release</text><path d="M475 310H810" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="605" y="299" fill="#23473b" font-size="16">明确放行</text><path d="M810 365H475" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="510" y="352" fill="#23473b" font-size="16">4. 返回数据 / 或抛出受控错误</text><path d="M465 420H115" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="145" y="407" fill="#23473b" font-size="16">5. 后续内容字节 / 框架错误信息</text><text x="30" y="505" fill="#23473b" font-size="18">逻辑时序示意：data事件、TCP包、React片段不要求一一对应。</text></g></svg>