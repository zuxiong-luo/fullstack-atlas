<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" role="img" aria-labelledby="title desc"><title id="title">边界由组件层次决定，不由文件名相似决定</title><desc id="desc">布局位于同段错误边界上方；loading与局部Suspense的层次不同。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#356b58"/></marker></defs><rect width="940" height="520" fill="#f7faf7"/><g font-family="system-ui,sans-serif"><text x="28" y="42" fill="#23473b" font-size="26">边界由组件层次决定，不由文件名相似决定</text><rect x="30" y="80" width="880" height="325" rx="10" fill="#e1eee4" stroke="#668c78"/><text x="45" y="109" fill="#23473b" font-size="18">共享 layout：工作台壳与控制面板</text><rect x="50" y="130" width="840" height="55" rx="10" fill="#fff" stroke="#668c78"/><text x="65" y="159" fill="#23473b" font-size="18">Controls：初始化 / 导航 / 释放等待（Client Component）</text><rect x="50" y="205" width="840" height="175" rx="10" fill="#fff3df" stroke="#668c78"/><text x="65" y="234" fill="#23473b" font-size="18">同段 error：捕获下面的意外错误；不覆盖上面的同段 layout</text><rect x="75" y="260" width="790" height="95" rx="10" fill="#fff" stroke="#668c78"/><text x="90" y="289" fill="#23473b" font-size="18">loading 的 Suspense → page → 内部 Suspense → Report</text><text x="90" y="317" fill="#23473b" font-size="18">路由准备占位               局部 REGION_PENDING    await gate</text><text x="30" y="453" fill="#23473b" font-size="19">等待用fallback；失败用error；不存在用not-found，三种结果不能互相冒充。</text><text x="30" y="488" fill="#23473b" font-size="19">Next16.4.2：retry = 路由 refresh + 清除错误状态；reset 仅清状态。</text></g></svg>