<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title"><title id="title">Agent调用时序及超时边界</title><rect width="1000" height="680" fill="#fff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#315c47"/></marker></defs><style>text{font-family:system-ui,'PingFang SC',sans-serif;fill:#24372e;font-size:17px}.small{font-size:14px}.box{fill:#eff5ee;stroke:#789980;stroke-width:1.5}.line{fill:none;stroke:#315c47;stroke-width:2;marker-end:url(#arrow)}</style><text x="30" y="35" font-weight="700">单次调用时序（教学示意，不代表实测耗时）</text><text x="65" y="80">客户端</text><path d="M110 95 V610" stroke="#bccabd" stroke-dasharray="6 5"/><text x="325" y="80">业务服务</text><path d="M370 95 V610" stroke="#bccabd" stroke-dasharray="6 5"/><text x="655" y="80">模型适配器</text><path d="M700 95 V610" stroke="#bccabd" stroke-dasharray="6 5"/><text x="855" y="80">HTTP上游</text><path d="M900 95 V610" stroke="#bccabd" stroke-dasharray="6 5"/><path class="line" d="M110 120 H370"/><text class="small" x="120" y="108">① 请求</text><path class="line" d="M370 215 H700"/><text class="small" x="380" y="203">③ 已验证的输入 + 截止时间</text><path class="line" d="M700 275 H900"/><text class="small" x="710" y="263">④ HTTP请求</text><path class="line" d="M900 350 H700"/><text class="small" x="710" y="338">⑤ 外层响应</text><path class="line" d="M700 410 H370"/><text class="small" x="380" y="398">⑥ 解包后的原始文本</text><path class="line" d="M370 560 H110"/><text class="small" x="120" y="548">⑧ 200结果 / 分类502错误</text><rect x="350" y="145" width="300" height="42" rx="5" fill="#eff5ee"/><text x="365" y="172">② 输入无效：立即返回400</text><rect x="350" y="445" width="590" height="42" rx="5" fill="#eff5ee"/><text x="365" y="472">⑦ JSON → 结构 → 引用；任一失败就结束</text><text class="small" x="390" y="320">③至⑥阶段超出预算：取消等待，返回504</text><text x="30" y="650">取消本地请求 ≠ 远端停止计算；输入上传阶段不在模型调用预算内。</text></svg>