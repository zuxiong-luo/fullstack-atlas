<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title"><title id="title">Agent请求与输出边界</title><rect width="1000" height="520" fill="#fff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#315c47"/></marker></defs><style>text{font-family:system-ui,'PingFang SC',sans-serif;fill:#24372e;font-size:17px}.small{font-size:14px}.box{fill:#eff5ee;stroke:#789980;stroke-width:1.5}.line{fill:none;stroke:#315c47;stroke-width:2;marker-end:url(#arrow)}</style><text x="30" y="35" font-weight="700">两次 JSON 解析，三层结果检查</text><rect class="box" x="30" y="75" width="250" height="82" rx="10"/><text x="45" y="107">客户端输入</text><text class="small" x="45" y="134">question + documents</text><rect class="box" x="375" y="75" width="250" height="82" rx="10"/><text x="390" y="107">请求校验</text><text class="small" x="390" y="134">类型 / 长度 / 字节 / 唯一ID</text><rect class="box" x="720" y="75" width="250" height="82" rx="10"/><text x="735" y="107">模型 HTTP 适配器</text><text class="small" x="735" y="134">限时调用 / 解包外层响应</text><path class="line" d="M280 116 H375"/><path class="line" d="M625 116 H720"/><path class="line" d="M845 157 V235 H155 V290"/><text x="330" y="218">原始模型文本：仍是不可信字符串</text><rect class="box" x="30" y="290" width="250" height="82" rx="10"/><text x="45" y="322">① JSON 解析</text><text class="small" x="45" y="349">不是JSON → FORMAT_ERROR</text><rect class="box" x="375" y="290" width="250" height="82" rx="10"/><text x="390" y="322">② 结果结构</text><text class="small" x="390" y="349">字段错误 → SCHEMA_ERROR</text><rect class="box" x="720" y="290" width="250" height="82" rx="10"/><text x="735" y="322">③ 引用集合</text><text class="small" x="735" y="349">未知 ID → 引用错误</text><path class="line" d="M280 331 H375"/><path class="line" d="M625 331 H720"/><path class="line" d="M845 372 V420"/><text x="650" y="450">200：answer + citations</text><text x="30" y="492">保证：引用 ID 来自输入集合。未保证：引用文字真正支持回答，或用户有权阅读资料。</text></svg>