<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-labelledby="title desc"><title id="title">复用几何不等于所有draw成本都会消失</title><desc id="desc">实例化减少CPU提交次数，本例不发布未测量的性能收益。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#356b58"/></marker></defs><rect width="940" height="500" fill="#f7faf7"/><g font-family="system-ui,sans-serif"><text x="28" y="42" font-size="27" fill="#23473b">复用几何不等于所有draw成本都会消失</text><rect x="30" y="90" width="260" height="125" rx="12" fill="#edf5ee" stroke="#668c78"/><text x="45" y="121" font-size="18" fill="#23473b">顶点0、1、2、3</text><text x="45" y="149" font-size="18" fill="#23473b">同一组属性记录</text><text x="45" y="177" font-size="18" fill="#23473b">共享角点才可共享索引</text><rect x="340" y="90" width="260" height="125" rx="12" fill="#edf5ee" stroke="#668c78"/><text x="355" y="121" font-size="18" fill="#23473b">索引0,1,2 / 0,2,3</text><text x="355" y="149" font-size="18" fill="#23473b">两个三角形拼一个四边形</text><text x="355" y="177" font-size="18" fill="#23473b">UV或法线不同要拆顶点</text><rect x="650" y="90" width="260" height="125" rx="12" fill="#edf5ee" stroke="#668c78"/><text x="665" y="121" font-size="18" fill="#23473b">实例0、1、2</text><text x="665" y="149" font-size="18" fill="#23473b">平移 -.65 / 0 / +.65</text><text x="665" y="177" font-size="18" fill="#23473b">一次drawElementsInstanced</text><path d="M295 150H333" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="240" y="257" font-size="16" fill="#23473b">索引选记录</text><path d="M605 150H643" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="545" y="257" font-size="16" fill="#23473b">各实例复用几何</text><rect x="110" y="315" width="720" height="105" rx="12" fill="#edf5ee" stroke="#668c78"/><text x="125" y="346" font-size="18" fill="#23473b">调用参数：TRIANGLES, count6, UNSIGNED_SHORT, byteOffset0, instances3</text><text x="125" y="374" font-size="18" fill="#23473b">索引缓冲偏移是字节，Uint16必须按2字节对齐。</text><text x="125" y="402" font-size="18" fill="#23473b">索引越界由本例CPU校验拒绝；这不是一次成功的GPU绘制。</text></g></svg>