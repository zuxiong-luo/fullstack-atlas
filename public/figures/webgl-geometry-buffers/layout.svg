<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-labelledby="title desc"><title id="title">顶点数据、索引数据、实例数据是三种不同的步进</title><desc id="desc">每个属性按自己的布局与divisor从缓冲读取，索引选择顶点记录。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#356b58"/></marker></defs><rect width="940" height="500" fill="#f7faf7"/><g font-family="system-ui,sans-serif"><text x="28" y="42" font-size="27" fill="#23473b">顶点数据、索引数据、实例数据是三种不同的步进</text><rect x="30" y="95" width="430" height="145" rx="12" fill="#edf5ee" stroke="#668c78"/><text x="45" y="126" font-size="18" fill="#23473b">ARRAY_BUFFER：每条记录20字节</text><text x="45" y="154" font-size="18" fill="#23473b">字节0..7：position = 2 × float</text><text x="45" y="182" font-size="18" fill="#23473b">字节8..19：color = 3 × float</text><text x="45" y="210" font-size="18" fill="#23473b">第i条属性起点 = i × stride + offset</text><rect x="500" y="95" width="410" height="145" rx="12" fill="#edf5ee" stroke="#668c78"/><text x="515" y="126" font-size="18" fill="#23473b">VAO记录属性描述</text><text x="515" y="154" font-size="18" fill="#23473b">location0：size2 / stride20 / offset0</text><text x="515" y="182" font-size="18" fill="#23473b">location1：size3 / stride20 / offset8</text><text x="515" y="210" font-size="18" fill="#23473b">pointer调用时捕获当前ARRAY_BUFFER</text><path d="M495 164H465" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="400" y="276" font-size="16" fill="#23473b">描述引用缓冲</text><rect x="30" y="310" width="430" height="110" rx="12" fill="#edf5ee" stroke="#668c78"/><text x="45" y="341" font-size="18" fill="#23473b">ELEMENT_ARRAY_BUFFER：0,1,2,0,2,3</text><text x="45" y="369" font-size="18" fill="#23473b">6个Uint16索引，占12字节</text><text x="45" y="397" font-size="18" fill="#23473b">draw参数count = 6，不是顶点数4</text><rect x="500" y="310" width="410" height="110" rx="12" fill="#edf5ee" stroke="#668c78"/><text x="515" y="341" font-size="18" fill="#23473b">实例offset：每条2个float，占8字节</text><text x="515" y="369" font-size="18" fill="#23473b">location2 / divisor1</text><text x="515" y="397" font-size="18" fill="#23473b">实例0、1、2分别读取一条偏移</text></g></svg>