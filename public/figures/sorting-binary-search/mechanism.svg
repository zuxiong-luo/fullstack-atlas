<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img"><title>先建立有序性，再证明二分每一步排除什么</title><desc>比较器一致、有序前提与区间定义，分别支撑排序和边界查询的结论。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285443"/></marker></defs><rect width="1200" height="830" rx="24" fill="#f3f7f4"/><text x="32" y="45" font-family="system-ui,sans-serif" font-size="28" fill="#173c2e" font-weight="700">先建立有序性，再证明二分每一步排除什么</text><text x="32" y="82" font-family="system-ui,sans-serif" font-size="17" fill="#173c2e">比较器一致、有序前提与区间定义，分别支撑排序和边界查询的结论。</text><text x="35" y="135" font-family="system-ui,sans-serif" font-size="23" fill="#173c2e" font-weight="700">归并：两个子区间各自有序，相等时先取左边</text><rect x="40" y="160" width="430" height="90" rx="10" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="54" y="190" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">左：[2#1, 4#0]</text><text x="54" y="219" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">原始编号用来观察稳定性</text><rect x="710" y="160" width="450" height="90" rx="10" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="724" y="190" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">右：[1#4, 2#2, 7#3]</text><text x="724" y="219" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">不是按编号排序，而是按数值排序</text><path d="M255 255V295H535V325" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M935 255V295H665V325" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="275" y="330" width="660" height="75" rx="10" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="289" y="360" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">合并：[1#4, 2#1, 2#2, 4#0, 7#3]</text><text x="35" y="470" font-family="system-ui,sans-serif" font-size="23" fill="#173c2e" font-weight="700">lower_bound(2)：维护左边&lt;2、右边≥2，区间严格缩小</text><rect x="35" y="505" width="255" height="100" rx="10" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="49" y="535" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">[0,6)</text><text x="49" y="564" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">mid=3，值2；hi=3</text><path d="M290 553H323" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="330" y="505" width="255" height="100" rx="10" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="344" y="535" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">[0,3)</text><text x="344" y="564" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">mid=1，值2；hi=1</text><path d="M585 553H618" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="625" y="505" width="255" height="100" rx="10" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="639" y="535" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">[0,1)</text><text x="639" y="564" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">mid=0，值1；lo=1</text><path d="M880 553H913" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="920" y="505" width="255" height="100" rx="10" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="934" y="535" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">[1,1)</text><text x="934" y="564" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">停止，结果1</text><text x="40" y="660" font-family="system-ui,sans-serif" font-size="23" fill="#173c2e">固定数组：[1, 2, 2, 2, 4, 8]；lower=1，upper=4，等值区间[1,4)。</text><text x="40" y="710" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">[lo,hi)是候选元素；答案是边界位置，允许等于n，不能直接读取a[n]。</text><text x="40" y="765" font-family="system-ui,sans-serif" font-size="18" fill="#173c2e">基础归并辅助空间O(n)；保存整段回放快照是额外教学成本，限制在32项以内。</text></svg>
