<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">先分清：谁运行应用，谁处理数据</title><desc id="desc">图中是职责与调用关系，不是四个独立服务器串联。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#356d53"/></marker></defs><rect width="1000" height="720" rx="20" fill="#f5f8f6"/><g font-family="Arial, PingFang SC, sans-serif"><text x="40" y="52" font-size="30" font-weight="700" fill="#20392f">先分清：谁运行应用，谁处理数据</text><text x="40" y="89" font-size="21" font-weight="400" fill="#20392f">图中是职责与调用关系，不是四个独立服务器串联。</text><rect x="40" y="145" width="220" height="140" rx="15" fill="white" stroke="#83aa96" stroke-width="2"/><text x="60" y="180" font-size="24" font-weight="650" fill="#20392f">客户端</text><text x="60" y="217" font-size="21" font-weight="400" fill="#20392f">HTTP请求</text><text x="60" y="248" font-size="21" font-weight="400" fill="#20392f">浏览器 / 其他服务</text><rect x="350" y="145" width="280" height="140" rx="15" fill="white" stroke="#83aa96" stroke-width="2"/><text x="370" y="180" font-size="24" font-weight="650" fill="#20392f">Uvicorn</text><text x="370" y="217" font-size="21" font-weight="400" fill="#20392f">监听端口、处理协议</text><text x="370" y="248" font-size="21" font-weight="400" fill="#20392f">通过ASGI调用应用</text><rect x="720" y="145" width="240" height="140" rx="15" fill="white" stroke="#83aa96" stroke-width="2"/><text x="740" y="180" font-size="24" font-weight="650" fill="#20392f">FastAPI应用</text><text x="740" y="217" font-size="21" font-weight="400" fill="#20392f">路由、依赖、模型声明</text><text x="740" y="248" font-size="21" font-weight="400" fill="#20392f">使用Starlette能力</text><path d="M260 215 L340 215" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><text x="272" y="190" font-size="20" font-weight="400" fill="#20392f">HTTP</text><path d="M630 215 L710 215" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><text x="644" y="190" font-size="20" font-weight="400" fill="#20392f">ASGI</text><rect x="40" y="435" width="400" height="155" rx="15" fill="white" stroke="#83aa96" stroke-width="2"/><text x="60" y="470" font-size="24" font-weight="650" fill="#20392f">业务代码 / 外部资源</text><text x="60" y="507" font-size="21" font-weight="400" fill="#20392f">PricingService计算报价</text><text x="60" y="538" font-size="21" font-weight="400" fill="#20392f">数据库、队列、模型调用另行组合</text><rect x="560" y="435" width="400" height="155" rx="15" fill="white" stroke="#83aa96" stroke-width="2"/><text x="580" y="470" font-size="24" font-weight="650" fill="#20392f">Pydantic</text><text x="580" y="507" font-size="21" font-weight="400" fill="#20392f">按模型校验输入、处理输出</text><text x="580" y="538" font-size="21" font-weight="400" fill="#20392f">是库，不是独立网络服务</text><path d="M790 285 L790 425" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><text x="804" y="360" font-size="21" font-weight="400" fill="#20392f">模型处理</text><path d="M730 285 L480 360 L240 360 L240 425" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><text x="280" y="346" font-size="21" font-weight="400" fill="#20392f">处理函数调用业务</text><text x="40" y="685" font-size="21" font-weight="400" fill="#20392f">Python运行这些组件；FastAPI对象本身不会自动监听一个HTTP端口。</text></g></svg>