<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc"><title id="title">同一条路由的三个结果出口</title><desc id="desc">正常输出模型与异常响应要分开；不能把整个流程画成固定校验顺序。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#356d53"/></marker></defs><rect width="1000" height="800" rx="20" fill="#f5f8f6"/><g font-family="Arial, PingFang SC, sans-serif"><text x="40" y="52" font-size="30" font-weight="700" fill="#20392f">同一条路由的三个结果出口</text><text x="40" y="89" font-size="21" font-weight="400" fill="#20392f">正常输出模型与异常响应要分开；不能把整个流程画成固定校验顺序。</text><rect x="40" y="140" width="210" height="140" rx="15" fill="white" stroke="#83aa96" stroke-width="2"/><text x="60" y="175" font-size="24" font-weight="650" fill="#20392f">HTTP请求</text><text x="60" y="212" font-size="21" font-weight="400" fill="#20392f">POST /api/quotes</text><text x="60" y="243" font-size="21" font-weight="400" fill="#20392f">请求体JSON</text><rect x="320" y="140" width="210" height="140" rx="15" fill="white" stroke="#83aa96" stroke-width="2"/><text x="340" y="175" font-size="24" font-weight="650" fill="#20392f">HTTP中间件</text><text x="340" y="212" font-size="21" font-weight="400" fill="#20392f">call_next进入应用</text><text x="340" y="243" font-size="21" font-weight="400" fill="#20392f">响应后添加Header</text><rect x="600" y="140" width="360" height="140" rx="15" fill="white" stroke="#83aa96" stroke-width="2"/><text x="620" y="175" font-size="24" font-weight="650" fill="#20392f">匹配路由、解依赖与校验</text><text x="620" y="212" font-size="21" font-weight="400" fill="#20392f">根据声明处理各项参数</text><text x="620" y="243" font-size="21" font-weight="400" fill="#20392f">并非所有校验先于依赖</text><path d="M250 210 L310 210" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><path d="M530 210 L590 210" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><rect x="600" y="355" width="360" height="140" rx="15" fill="white" stroke="#83aa96" stroke-width="2"/><text x="620" y="390" font-size="24" font-weight="650" fill="#20392f">有效输入进入处理函数</text><text x="620" y="427" font-size="21" font-weight="400" fill="#20392f">create_quote调用PricingService</text><text x="620" y="458" font-size="21" font-weight="400" fill="#20392f">普通业务方法计算积分</text><path d="M780 280 L780 345" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="355" width="430" height="140" rx="15" fill="white" stroke="#83aa96" stroke-width="2"/><text x="60" y="390" font-size="24" font-weight="650" fill="#20392f">输入不符合模型 → 422</text><text x="60" y="427" font-size="21" font-weight="400" fill="#20392f">不调用正常报价处理函数</text><text x="60" y="458" font-size="21" font-weight="400" fill="#20392f">依赖函数可能已经执行</text><path d="M600 250 L510 250 L510 425 L480 425" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><rect x="600" y="570" width="360" height="140" rx="15" fill="white" stroke="#83aa96" stroke-width="2"/><text x="620" y="605" font-size="24" font-weight="650" fill="#20392f">正常结果 → QuoteOutput</text><text x="620" y="642" font-size="21" font-weight="400" fill="#20392f">校验并过滤正常输出字段</text><text x="620" y="673" font-size="21" font-weight="400" fill="#20392f">JSON响应 → 200</text><path d="M780 495 L780 560" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="570" width="430" height="140" rx="15" fill="white" stroke="#83aa96" stroke-width="2"/><text x="60" y="605" font-size="24" font-weight="650" fill="#20392f">HD业务限制 → HTTPException</text><text x="60" y="642" font-size="21" font-weight="400" fill="#20392f">detail包含HD_LIMIT</text><text x="60" y="673" font-size="21" font-weight="400" fill="#20392f">异常响应 → 409</text><path d="M600 465 L540 465 L540 640 L480 640" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="765" font-size="21" font-weight="400" fill="#20392f">图示当前报价应用；未处理的服务端实现错误另走500路径。</text></g></svg>