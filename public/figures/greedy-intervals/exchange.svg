<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc"><title id="title">最早结束：能把一个最优解换成以贪心开头</title><desc id="desc">把最优解第一项o换成结束不晚的g，后续依旧兼容，数量不减；然后对子问题重复。</desc><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285443"/></marker></defs><rect width="1000" height="780" fill="#f3f7f4"/><g font-family="system-ui,PingFang SC,sans-serif"><text x="30" y="44" font-size="28" fill="#173c2e">最早结束：能把一个最优解换成以贪心开头</text><rect x="40" y="110" width="920" height="100" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="141" font-size="20" fill="#173c2e">先固定目标：单房间，选择数量最多的兼容区间</text><text x="56" y="170" font-size="20" fill="#173c2e">区间为[start,end)，端点接触兼容，每项同等价值</text><rect x="40" y="280" width="920" height="120" rx="12" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="56" y="311" font-size="20" fill="#173c2e">任取一个最优解，其第一项为o；贪心第一项为g</text><text x="56" y="340" font-size="20" fill="#173c2e">end(g) ≤ end(o)，所以原来接在o后的每项也能接在g后</text><text x="56" y="369" font-size="20" fill="#173c2e">把o换为g：可行，数量相同</text><path d="M500 405L500 450" stroke="#285443" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="40" y="455" width="920" height="125" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="486" font-size="20" fill="#173c2e">剩余任务只保留start ≥ end(g)的候选</text><text x="56" y="515" font-size="20" fill="#173c2e">原问题缩成同类子问题，再做相同交换</text><text x="56" y="544" font-size="20" fill="#173c2e">证明能安全固定g；不是靠“通常留下更多空间”猜测</text><rect x="40" y="630" width="920" height="95" rx="12" fill="#fff4dc" stroke="#6d987f" stroke-width="2"/><text x="56" y="661" font-size="20" fill="#173c2e">错误规则：最早开始选[0,10)，却挡住[1,2)、[2,3)、[3,4)</text><text x="56" y="690" font-size="20" fill="#173c2e">结束最早可选后面3项；最短长度也有独立反例</text></g></svg>
