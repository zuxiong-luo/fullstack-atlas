<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc"><title id="title">区间选择、最少房间、合并覆盖：三个目标</title><desc id="desc">相同输入长区间0到10和短区间1到2、2到3、3到4。最多选择3，所有任务需要2房间，覆盖并成0到10。</desc><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285443"/></marker></defs><rect width="1000" height="780" fill="#f3f7f4"/><g font-family="system-ui,PingFang SC,sans-serif"><text x="30" y="44" font-size="28" fill="#173c2e">区间选择、最少房间、合并覆盖：三个目标</text><rect x="40" y="110" width="920" height="105" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="141" font-size="20" fill="#173c2e">输入 A=[0,10)，B=[1,2)，C=[2,3)，D=[3,4)</text><text x="56" y="170" font-size="20" fill="#173c2e">半开：B结束2与C开始2不重叠</text><rect x="40" y="285" width="920" height="110" rx="12" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="56" y="316" font-size="20" fill="#173c2e">最多选择：B、C、D，数量3（允许丢弃A）</text><text x="56" y="345" font-size="20" fill="#173c2e">规则按结束时间；交换论证保证数量最优</text><rect x="40" y="450" width="920" height="115" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="481" font-size="20" fill="#173c2e">全部安排：房间0给A，房间1接B→C→D，共2间</text><text x="56" y="510" font-size="20" fill="#173c2e">按开始时间扫描，复用最早结束房间；最大重叠给出下界</text><rect x="40" y="625" width="920" height="95" rx="12" fill="#fff4dc" stroke="#6d987f" stroke-width="2"/><text x="56" y="656" font-size="20" fill="#173c2e">合并覆盖：[0,10)，保留的是时间集合，不是保留三项任务</text><text x="56" y="685" font-size="20" fill="#173c2e">相邻区间也可合成连续覆盖；这是另一个输出含义</text></g></svg>
