<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="570" viewBox="0 0 1040 570" role="img" aria-labelledby="title desc"><title id="title">SSR 到 hydration 的同一快照</title><desc id="desc">请求数据进入服务端渲染及安全序列化，两条路径在浏览器 hydrateRoot 汇合；点击按钮后更新在浏览器进行。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#357963"/></marker></defs><rect width="1040" height="570" rx="18" fill="#f2f7f4"/><g font-family="system-ui,sans-serif" fill="#243d33"><text x="35" y="44" font-size="26" font-weight="bold">同一份数据快照，两个执行环境</text><text x="35" y="80" font-size="18">示意图：不传输服务端 Fiber、函数闭包或数据库连接</text><g fill="#fff" stroke="#72a28f" stroke-width="2"><rect x="35" y="120" width="250" height="100" rx="10"/><rect x="375" y="110" width="290" height="80" rx="10"/><rect x="375" y="240" width="290" height="80" rx="10"/><rect x="745" y="110" width="260" height="80" rx="10"/><rect x="745" y="240" width="260" height="80" rx="10"/><rect x="745" y="380" width="260" height="75" rx="10"/></g><g font-size="20"><text x="55" y="155">请求内 data</text><text x="55" y="187">title / count / requestId</text><text x="397" y="144">服务器 renderToString</text><text x="397" y="174">HTML 字符串</text><text x="397" y="275">安全序列化 JSON</text><text x="397" y="303">小于号 → Unicode 转义</text><text x="765" y="143">浏览器解析 HTML</text><text x="765" y="174">页面已有 DOM</text><text x="765" y="272">读取 JSON + App</text><text x="765" y="303">hydrateRoot</text><text x="765" y="412">点击 → setCount</text><text x="765" y="442">客户端更新 DOM</text></g><g fill="none" stroke="#357963" stroke-width="3" marker-end="url(#arrow)"><path d="M285 150H375"/><path d="M285 190H325V280H375"/><path d="M665 150H745"/><path d="M665 280H745"/><path d="M875 190V240"/><path d="M875 320V380"/></g><text x="35" y="400" font-size="20">首轮输入一致 → 复用对应 DOM，并接管交互</text><text x="35" y="440" font-size="20">故意 count 0 → 99 → 报告恢复，实验中的根重新渲染</text><text x="35" y="520" font-size="18">服务端：请求 → 数据 → HTML → 响应结束　｜　浏览器：接管 → 交互 → 更新</text></g></svg>
