<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="t d"><title id="t">按请求链逐层缩小故障范围</title><desc id="d">客户端经过入口控制器、Service后端发现和Pod应用。不同跳分别检查HTTP响应、路由、EndpointSlice和进程监听。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#365c49"/></marker></defs><rect width="960" height="320" fill="#f2f7f3" rx="16"/><g font-family="system-ui,sans-serif" fill="#243e31"><text x="30" y="42" font-size="24" font-weight="700">先知道哪一跳失败，再决定改哪一层</text><g fill="white" stroke="#61876f" stroke-width="2"><rect x="25" y="100" width="170" height="70" rx="8"/><rect x="255" y="100" width="180" height="70" rx="8"/><rect x="495" y="100" width="200" height="70" rx="8"/><rect x="755" y="100" width="180" height="70" rx="8"/></g><g font-size="18" text-anchor="middle"><text x="110" y="130">客户端</text><text x="110" y="155">DNS / TLS / HTTP</text><text x="345" y="130">入口控制器</text><text x="345" y="155">Host / Path / upstream</text><text x="595" y="130">Service → 后端发现</text><text x="595" y="155">selector / port / ready</text><text x="845" y="130">Pod 应用</text><text x="845" y="155">监听 / 路径 / 依赖</text></g><g stroke="#365c49" stroke-width="2" marker-end="url(#a)"><path d="M198 135H245"/><path d="M438 135H485"/><path d="M698 135H745"/></g><g font-size="16"><text x="35" y="220">逐跳证据：</text><text x="35" y="252">响应头/请求ID → 控制器日志 → EndpointSlice → Pod IP / 端口 / 日志 / 事件</text><text x="35" y="292">逻辑排查图，Service不必是一个独立代理进程；具体转发由集群数据平面和控制器决定。</text></g></g></svg>
