<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315c4e"/></marker></defs><rect width="1100" height="650" rx="18" fill="#f4f8f6"/><g font-family="Arial,sans-serif" fill="#223d33"><text x="40" y="48" font-size="26">模块公开边界与依赖分支</text><g stroke="#3f7360" fill="#e6efeb"><rect x="40" y="90" width="420" height="110" rx="12"/><rect x="570" y="90" width="450" height="110" rx="12"/><rect x="330" y="275" width="440" height="70" rx="12"/><rect x="40" y="430" width="290" height="110" rx="12"/><rect x="405" y="430" width="290" height="110" rx="12"/><rect x="770" y="430" width="290" height="110" rx="12"/></g><g font-size="20" text-anchor="middle"><text x="250" y="128">InfrastructureModule</text><text x="250" y="165">exports: CONFIG / CLOCK / AUDIT</text><text x="795" y="128">RequestIdentity</text><text x="795" y="165">每个 HTTP 请求上下文独立</text><text x="550" y="318">Controller（依赖 request scope）</text><text x="185" y="468">ConsumerA / ConsumerB</text><text x="185" y="505">各自是应用级单例</text><text x="550" y="468">Scratch A</text><text x="550" y="505">注入 ConsumerA 的实例</text><text x="915" y="468">Scratch B</text><text x="915" y="505">注入 ConsumerB 的实例</text></g><g stroke="#315c4e" fill="none" stroke-width="2" marker-end="url(#a)"><path d="M430 275L250 200"/><path d="M660 275L795 200"/><path d="M400 345L185 430"/><path d="M330 470L405 470"/><path d="M185 540V570H915V540"/></g><g font-size="16"><text x="240" y="245">注入已导出的 token</text><text x="770" y="245">注入请求身份</text><text x="70" y="380">Controller 注入 A 和 B</text><text x="40" y="610">箭头指向所依赖的对象；Scratch 是 transient，按消费对象创建，并非每次方法调用新建。</text></g></g></svg>
