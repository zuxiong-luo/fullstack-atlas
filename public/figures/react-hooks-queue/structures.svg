<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 520" role="img" aria-labelledby="title desc"><title id="title">两条不同的链</title><desc id="desc">Fiber 的 memoizedState 指向 Hook A，经 next 到 Hook B；Hook A 的 queue.pending 指向 Update 环的尾 U2。U2.next 指回 U1，U1.next 指向 U2。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#31594c"/></marker></defs><rect width="1020" height="520" rx="16" fill="#f6f8f3"/><g font-family="system-ui,sans-serif" fill="#183c31" font-size="19"><text x="32" y="42" font-size="26">先找到状态槽位，再找到这个状态的更新</text><g fill="white" stroke="#78978b" stroke-width="2"><rect x="35" y="105" width="150" height="72" rx="8"/><rect x="380" y="105" width="180" height="72" rx="8"/><rect x="740" y="105" width="180" height="72" rx="8"/><rect x="380" y="300" width="185" height="70" rx="8"/><rect x="740" y="300" width="185" height="70" rx="8"/></g><text x="75" y="149">Fiber</text><text x="419" y="149">Hook A</text><text x="780" y="149">Hook B</text><text x="405" y="342">U1：先加十</text><text x="759" y="342">U2：再乘二</text><g fill="none" stroke="#31594c" stroke-width="2" marker-end="url(#a)"><path d="M185 140H380"/><path d="M560 140H740"/><path d="M500 177V245H832V300"/><path d="M565 335H740"/><path d="M832 370V418H472V370"/></g><text x="210" y="126">memoizedState</text><text x="617" y="126">next</text><text x="536" y="230">queue.pending → 尾 U2</text><text x="620" y="320">next</text><text x="581" y="445">尾.next 指向最早的 U1</text><text x="32" y="487">教学简图：普通并发更新先入 interleaved，随后转 pending；两个 next 的对象类型不同。</text></g></svg>
