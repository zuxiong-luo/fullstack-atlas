<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc"><title id="title">跳过后从正确基础重放</title><desc id="desc">初始基础1。紧急轮跳过加10，处理乘2显示2，保留基础1和加10原Lane、乘2的NoLane副本；延后轮从1重放得到22，队列清空。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#31594c"/></marker></defs><rect width="1080" height="620" rx="16" fill="#f6f8f3"/><g font-family="system-ui,sans-serif" fill="#183c31" font-size="20"><text x="32" y="43" font-size="26">显示结果与重放起点，不必相同</text><text x="32" y="80">计算顺序示意；不表示浏览器一定绘制中间状态。</text><g fill="white" stroke="#78978b" stroke-width="2"><rect x="35" y="115" width="1010" height="100" rx="10"/><rect x="35" y="270" width="1010" height="130" rx="10"/><rect x="35" y="455" width="1010" height="110" rx="10"/></g><text x="57" y="151">初始：baseState = 1</text><text x="57" y="188">入队顺序：+10 [延后 lane] → ×2 [紧急 lane]</text><text x="57" y="307">紧急轮：跳过 +10，计算 1 × 2 = 2</text><text x="57" y="344">本轮显示值 = 2；保留 baseState = 1</text><text x="57" y="379">baseQueue：+10 [保留原 lane] → ×2 [副本改为 NoLane]</text><text x="57" y="494">延后轮：从 1 重放，先 +10 得 11，再 ×2 得 22</text><text x="57" y="535">本轮显示值 = 22；新 baseState = 22；baseQueue 清空</text><g fill="none" stroke="#31594c" stroke-width="2" marker-end="url(#a)"><path d="M510 215V270"/><path d="M510 400V455"/></g><text x="535" y="249">暂时跳过，不丢弃</text><text x="535" y="434">按原顺序重算，不在 2 上补加十</text><text x="32" y="601">NoLane 副本不会再被优先级筛掉；更新函数必须纯粹，才能安全参与重放。</text></g></svg>
