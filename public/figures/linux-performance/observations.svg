<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 820" role="img" aria-labelledby="title desc"><title id="title">性能采样的身份、窗口与计数器</title><desc id="desc">前后快照包住有确认的工作阶段，分别解释CPU秒、RSS和逻辑I/O，失效观测被拒绝。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315d85"/></marker></defs><rect width="820" height="820" fill="white"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif" fill="#17324d"><text x="30" y="43" font-size="27" font-weight="700">从阶段确认到前后差值：同一PID的观察</text><text x="30" y="82" font-size="19">受控工作负载示意，不是性能测量曲线。</text><rect x="30" y="130" width="230" height="95" rx="12" fill="#f0f6ff" stroke="#456f9a"/><text x="48" y="164" font-size="19">before快照</text><text x="48" y="194" font-size="19">PID + start_ticks</text><rect x="295" y="130" width="230" height="95" rx="12" fill="#f0f6ff" stroke="#456f9a"/><text x="313" y="164" font-size="19">worker执行一阶段</text><text x="313" y="194" font-size="19">CPU / 内存 / I/O</text><rect x="560" y="130" width="230" height="95" rx="12" fill="#f0f6ff" stroke="#456f9a"/><text x="578" y="164" font-size="19">收到stdout确认</text><text x="578" y="194" font-size="19">after快照</text><path d="M260 177H295" fill="none" stroke="#315d85" stroke-width="2.5" marker-end="url(#a)"/><path d="M525 177H560" fill="none" stroke="#315d85" stroke-width="2.5" marker-end="url(#a)"/><text x="30" y="280" font-size="24" font-weight="700">三种计数分别解释，不能互相替代</text><rect x="30" y="310" width="760" height="95" rx="12" fill="#f0f6ff" stroke="#456f9a"/><text x="48" y="344" font-size="19">CPU秒差 ÷ 单调时钟秒差 × 100 → 单核口径百分比</text><text x="48" y="374" font-size="19">累计CPU时间 ≠ 墙钟时间；load average ≠ CPU百分比</text><rect x="30" y="435" width="760" height="95" rx="12" fill="#eef8ee" stroke="#456f9a"/><text x="48" y="469" font-size="19">持有32MiB并触页 → 观察RSS变化；VmHWM记录历史高点</text><text x="48" y="499" font-size="19">丢弃对象引用 ≠ RSS必然立刻归零</text><rect x="30" y="560" width="760" height="95" rx="12" fill="#fff8e8" stroke="#456f9a"/><text x="48" y="594" font-size="19">逻辑rchar / wchar与设备read_bytes / write_bytes分开</text><text x="48" y="624" font-size="19">刚写的4MiB可从page cache读回；read_bytes允许0</text><text x="30" y="710" font-size="20" font-weight="700">失败边界：进程退出、身份变化、间隔不正 → 拒绝差值</text><text x="30" y="752" font-size="18">/proc多文件读取不是原子事务；所有工作只作用于自己的子进程。</text></g></svg>