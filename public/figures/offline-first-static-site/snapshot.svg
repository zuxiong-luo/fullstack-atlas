<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-labelledby="t d"><title id="t">离线快照发布与回退</title><desc id="d">构建清单列出全部资源，下载到候选缓存；全部成功才写ready。失败删除候选保留旧快照。请求只使用完整缓存。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#365c49"/></marker></defs><rect width="960" height="370" rx="16" fill="#f2f7f3"/><g font-family="system-ui,sans-serif" fill="#243e31"><text x="30" y="40" font-size="24" font-weight="700">资源齐全后，才发布可读取的快照</text><g fill="white" stroke="#61876f" stroke-width="2"><rect x="30" y="95" width="200" height="75" rx="8"/><rect x="300" y="95" width="230" height="75" rx="8"/><rect x="610" y="95" width="300" height="75" rx="8"/><rect x="300" y="245" width="230" height="65" rx="8"/><rect x="610" y="245" width="300" height="65" rx="8"/></g><g font-size="18" text-anchor="middle"><text x="130" y="125">构建 manifest</text><text x="130" y="152">HTML / JS / 图 / 示例</text><text x="415" y="125">候选 Cache</text><text x="415" y="152">逐文件下载并检查状态</text><text x="760" y="125">最后写 ready 标记</text><text x="760" y="152">进入已完成快照列表</text><text x="415" y="273">失败 → 删除候选</text><text x="415" y="295">旧完整快照保留</text><text x="760" y="273">fetch 优先读完整快照</text><text x="760" y="295">未命中才尝试网络</text></g><g stroke="#365c49" stroke-width="2" marker-end="url(#a)" fill="none"><path d="M233 132H292"/><path d="M533 132H600"/><path d="M415 173V235"/><path d="M760 173V235"/></g><text x="30" y="347" font-size="15">应用层完成标记提供发布约定；Cache Storage 本身没有跨文件事务。示意省略旧标签页兼容分支。</text></g></svg>
