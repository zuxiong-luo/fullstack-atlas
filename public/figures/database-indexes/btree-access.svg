<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">联合 B-tree 怎样定位订单，并判断是否访问表页</title><desc id="desc">先以租户42和paid缩小范围，再沿created_at与id倒序取20条。索引条目指向堆元组；可见性映射允许跳过表页，否则仍需访问堆。结构为教学简化。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#355f50"/></marker></defs>
<rect width="1120" height="620" rx="20" fill="#f3f7f4"/>
<g font-family="system-ui, sans-serif" fill="#1b332b">
<text x="36" y="44" font-size="24" font-weight="700">一次访问路径：查范围 → 按序取行 → 检查可见性</text>
<text x="36" y="76" font-size="17">键顺序 (tenant_id, status, created_at DESC, id DESC)；INCLUDE 只携带 amount_cents</text>
<rect x="345" y="106" width="430" height="70" rx="12" fill="#dcebdc" stroke="#557e66"/><text x="370" y="136" font-size="19">内部页：分隔键与子页位置</text><text x="370" y="160" font-size="16">按比较结果选择包含目标区间的子页</text>
<g stroke="#355f50" fill="none" stroke-width="2" marker-end="url(#a)"><path d="M410 176 L190 228"/><path d="M560 176 L560 228"/><path d="M715 176 L930 228"/></g>
<rect x="36" y="232" width="290" height="110" rx="12" fill="white" stroke="#879d92"/><text x="56" y="265" font-size="19">较小的键区间</text><text x="56" y="298" font-size="17">其他租户 / 其他状态</text>
<rect x="378" y="232" width="364" height="110" rx="12" fill="#dcebdc" stroke="#355f50" stroke-width="2"/><text x="398" y="263" font-size="19">tenant=42，status=paid</text><text x="398" y="296" font-size="17">日期与 id 倒序；取满 20 行可停</text><text x="398" y="322" font-size="16">索引条目另含堆位置 TID 与金额</text>
<rect x="794" y="232" width="290" height="110" rx="12" fill="white" stroke="#879d92"/><text x="814" y="265" font-size="19">较大的键区间</text><text x="814" y="298" font-size="17">其他租户 / 其他状态</text>
<path d="M560 342 V394" stroke="#355f50" stroke-width="2" marker-end="url(#a)"/>
<rect x="353" y="400" width="414" height="66" rx="12" fill="white" stroke="#557e66"/><text x="377" y="427" font-size="18">查询列已覆盖，表页 all-visible？</text><text x="377" y="451" font-size="16">可见性映射记录页级状态，索引不存快照可见性</text>
<g stroke="#355f50" fill="none" stroke-width="2" marker-end="url(#a)"><path d="M353 433 H190 V503"/><path d="M767 433 H930 V503"/></g>
<text x="225" y="420" font-size="17">是</text><text x="822" y="420" font-size="17">否</text>
<rect x="36" y="508" width="420" height="64" rx="12" fill="#dcebdc" stroke="#557e66"/><text x="56" y="536" font-size="18">从索引返回值，Heap Fetches 可为 0</text><text x="56" y="559" font-size="15">仍访问可见性映射，不等于完全没有 I/O</text>
<rect x="665" y="508" width="420" height="64" rx="12" fill="white" stroke="#879d92"/><text x="685" y="536" font-size="18">访问堆元组，按快照确认可见性</text><text x="685" y="559" font-size="15">计划名仍可能是 Index Only Scan</text>
<text x="36" y="603" font-size="15">教学简化：不表示真实页数、树高或测量耗时；堆表与索引是分开存储的结构。</text>
</g></svg>
