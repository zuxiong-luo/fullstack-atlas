<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc"><title id="title">图的共享后继：重复遇见，不等于需要重复处理</title><desc id="desc">菱形依赖中3有两个前驱。BFS入队时标记，DFS黑节点代表已完成。</desc><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285443"/></marker></defs><rect width="1000" height="780" fill="#f3f7f4"/><g font-family="system-ui,PingFang SC,sans-serif"><text x="30" y="44" font-size="28" fill="#173c2e">图的共享后继：重复遇见，不等于需要重复处理</text><text x="30" y="90" font-size="18" fill="#173c2e">边表示先到后：0→1、0→2、1→3、2→3、3→4；5不可达。</text><path d="M130 200L317 135" stroke="#285443" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M130 200L317 300" stroke="#285443" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M380 135L567 200" stroke="#285443" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M380 300L567 200" stroke="#285443" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M630 200L817 200" stroke="#285443" stroke-width="2.5" fill="none" marker-end="url(#a)"/><circle cx="100" cy="200" r="30" fill="#fff" stroke="#285443"/><text x="94" y="207" font-size="24" fill="#173c2e">0</text><circle cx="350" cy="135" r="30" fill="#fff" stroke="#285443"/><text x="344" y="142" font-size="24" fill="#173c2e">1</text><circle cx="350" cy="300" r="30" fill="#fff" stroke="#285443"/><text x="344" y="307" font-size="24" fill="#173c2e">2</text><circle cx="600" cy="200" r="30" fill="#fff" stroke="#285443"/><text x="594" y="207" font-size="24" fill="#173c2e">3</text><circle cx="850" cy="200" r="30" fill="#fff" stroke="#285443"/><text x="844" y="207" font-size="24" fill="#173c2e">4</text><circle cx="850" cy="360" r="30" fill="#fff" stroke="#285443"/><text x="844" y="367" font-size="24" fill="#173c2e">5</text><rect x="40" y="455" width="920" height="180" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="486" font-size="20" fill="#173c2e">BFS从0：distance=[0,1,1,2,3,-1]</text><text x="56" y="515" font-size="20" fill="#173c2e">第一次入队立即标记：3不会被1和2重复加入</text><text x="56" y="544" font-size="20" fill="#173c2e">parent只保留第一次发现路径；相同长度路径可能不唯一</text><text x="56" y="573" font-size="20" fill="#173c2e">DFS看到已完成的黑色3，不等于发现了环</text></g></svg>
