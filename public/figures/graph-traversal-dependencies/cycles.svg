<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc"><title id="title">拓扑排序的剩余节点，不全是环上的节点</title><desc id="desc">0到1，1到2，2回1且到3。移除0后1、2成环，3是环下游也阻塞。</desc><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285443"/></marker></defs><rect width="1000" height="780" fill="#f3f7f4"/><g font-family="system-ui,PingFang SC,sans-serif"><text x="30" y="44" font-size="28" fill="#173c2e">拓扑排序的剩余节点，不全是环上的节点</text><rect x="40" y="110" width="920" height="110" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="141" font-size="20" fill="#173c2e">邻接表 [[1],[2],[1,3],[]]</text><text x="56" y="170" font-size="20" fill="#173c2e">初始入度 [0,2,1,1]；唯一就绪节点0</text><path d="M500 225L500 270" stroke="#285443" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="40" y="275" width="920" height="110" rx="12" fill="#fff4dc" stroke="#6d987f" stroke-width="2"/><text x="56" y="306" font-size="20" fill="#173c2e">移除0，处理0→1后，剩余入度 [0,1,1,1]</text><text x="56" y="335" font-size="20" fill="#173c2e">没有入度0的未处理节点，队列空了</text><rect x="40" y="450" width="440" height="150" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="481" font-size="20" fill="#173c2e">DFS环见证：[1,2,1]</text><text x="56" y="510" font-size="20" fill="#173c2e">1→2→1 都是实际边</text><text x="56" y="539" font-size="20" fill="#173c2e">灰节点回边指向祖先</text><rect x="520" y="450" width="440" height="150" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="536" y="481" font-size="20" fill="#173c2e">Kahn blocked：[1,2,3]</text><text x="536" y="510" font-size="20" fill="#173c2e">3没有参与环，但等着2</text><text x="536" y="539" font-size="20" fill="#173c2e">只能说“被环阻塞”</text><text x="40" y="705" font-size="18" fill="#173c2e">DAG才有完整拓扑序；部分order=[0]不能当成全部任务可执行。</text></g></svg>
