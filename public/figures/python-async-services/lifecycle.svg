<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc"><title id="title">有界批次的输入、排队、处理与取消</title><desc id="desc">JSON经验证成为Request，一个生产者向容量2的队列放入数据，两个worker处理，结果按索引收集。TaskGroup包含生产者和worker，总超时或失败取消兄弟任务并等待finally清理，作用域退出后返回成功或错误。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#315a47"/></marker></defs><rect width="1100" height="590" rx="20" fill="#f4f8f5"/><g font-family="system-ui,sans-serif" fill="#213b30"><text x="35" y="45" font-size="25" font-weight="bold">一个批次：有界排队 + 固定消费者 + 作用域清理</text><g stroke="#315a47" stroke-width="2" fill="#fff"><rect x="30" y="90" width="170" height="100" rx="10"/><rect x="255" y="90" width="190" height="100" rx="10"/><rect x="495" y="90" width="215" height="100" rx="10"/><rect x="770" y="75" width="285" height="145" rx="10"/><rect x="255" y="270" width="800" height="160" rx="10"/><rect x="255" y="475" width="800" height="75" rx="10"/></g><g font-size="22"><text x="47" y="127">JSON 输入</text><text x="47" y="160">运行时校验</text><text x="273" y="127">一个 producer</text><text x="273" y="160">满队列时 await</text><text x="512" y="127">Queue 容量 2</text><text x="512" y="160">存 (index,value)</text><text x="790" y="112">worker 0 / worker 1</text><text x="790" y="151">最多 2 个在处理</text><text x="790" y="190">结果按 index 写回</text><text x="277" y="308">TaskGroup：共同成功后才返回整个结果</text><text x="277" y="349">子任务失败 → 取消兄弟任务；总超时 → 取消本批任务</text><text x="277" y="392">每个已启动处理都执行 finally，退出作用域前等待清理</text><text x="277" y="521">成功：[0,1,4,…]　失败：input / upstream / timeout</text></g><g stroke="#315a47" stroke-width="2" marker-end="url(#arrow)"><path d="M200 140H250"/><path d="M445 140H490"/><path d="M710 140H765"/><path d="M910 220V265"/><path d="M660 430V470"/></g><text x="34" y="239" font-size="18">教学实验，无 HTTP、无真实上游；取消不等于远端回滚</text></g></svg>