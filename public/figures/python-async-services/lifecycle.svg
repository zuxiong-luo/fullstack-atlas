<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">一个事件循环，推进两项可等待工作</title><desc id="desc">只说明协作式等待；没有把一段普通重计算自动拆给其他核心。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#356d53"/></marker></defs><rect width="1000" height="600" rx="22" fill="#f5f8f6"/><g font-family="Arial, 'PingFang SC', sans-serif"><text x="40" y="52" font-size="30" fill="#20392f" font-weight="700">一个事件循环，推进两项可等待工作</text><text x="40" y="88" font-size="21" fill="#4e675b" font-weight="400">只说明协作式等待；没有把一段普通重计算自动拆给其他核心。</text><text x="45" y="150" font-size="25" fill="#20392f" font-weight="400">任务 A</text><rect x="185" y="110" width="190" height="100" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="207" y="148" font-size="25" fill="#20392f" font-weight="650">开始</text><text x="207" y="187" font-size="22" fill="#20392f" font-weight="400">执行一小段</text><rect x="425" y="110" width="270" height="100" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="447" y="148" font-size="25" fill="#20392f" font-weight="650">等待</text><text x="447" y="187" font-size="22" fill="#20392f" font-weight="400">await 尚未完成的操作</text><rect x="745" y="110" width="210" height="100" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="767" y="148" font-size="25" fill="#20392f" font-weight="650">继续</text><text x="767" y="187" font-size="22" fill="#20392f" font-weight="400">结果已就绪</text><path d="M375 160 L415 160" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><path d="M695 160 L735 160" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="340" font-size="25" fill="#20392f" font-weight="400">任务 B</text><rect x="280" y="300" width="190" height="100" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="302" y="338" font-size="25" fill="#20392f" font-weight="650">开始</text><text x="302" y="377" font-size="22" fill="#20392f" font-weight="400">A 等待时推进</text><rect x="520" y="300" width="210" height="100" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="542" y="338" font-size="25" fill="#20392f" font-weight="650">等待</text><text x="542" y="377" font-size="22" fill="#20392f" font-weight="400">让出执行机会</text><rect x="780" y="300" width="175" height="100" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="802" y="338" font-size="25" fill="#20392f" font-weight="650">继续</text><text x="802" y="377" font-size="22" fill="#20392f" font-weight="400">完成</text><path d="M470 350 L510 350" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><path d="M730 350 L770 350" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><text x="70" y="475" font-size="24" fill="#20392f" font-weight="400">事件循环轮流推进就绪工作；等待不是持续占着 CPU 计算。</text><text x="40" y="565" font-size="21" fill="#4e675b" font-weight="400">await 不一定每次都让出：等待对象已经完成时，可以直接继续。</text></g></svg>