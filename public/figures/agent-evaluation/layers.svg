<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="690" viewBox="0 0 1180 690" role="img" aria-labelledby="t d"><title id="t">检索、协议与语义质量的证据边界</title><desc id="d">6例检索fixture加6份文档进入两语言KeywordRetriever和evaluate，输出前3项ID、Recall与无命中结果。11组HTTP用例20步进入本地路由和mock，检查权限、错误码、状态。两者都不能推出未运行的真实模型语义质量、供应商延迟或费用。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#365c49"/></marker></defs><rect width="1180" height="690" fill="#f2f7f3" rx="20"/><g font-family="system-ui,sans-serif" fill="#243e31"><text x="35" y="48" font-size="28" font-weight="700">评测之前，先问：这个通过到底证明了哪一层？</text><g fill="white" stroke="#83a18c" stroke-width="2"><rect x="35" y="95" width="300" height="115" rx="12"/><rect x="420" y="95" width="300" height="115" rx="12"/><rect x="800" y="95" width="345" height="115" rx="12"/><rect x="35" y="285" width="300" height="115" rx="12"/><rect x="420" y="285" width="300" height="115" rx="12"/><rect x="800" y="285" width="345" height="115" rx="12"/><rect x="300" y="465" width="590" height="75" rx="12"/></g><g font-size="21"><text x="55" y="130" font-weight="700">6例检索fixture</text><text x="55" y="163" font-size="18">owner / question / expected</text><text x="55" y="194">+ 6份固定文档</text><text x="440" y="130" font-weight="700">TS / Python同一基线</text><text x="440" y="163">授权 → 关键词 → top3</text><text x="440" y="194">evaluate不调用模型</text><text x="820" y="130" font-weight="700">逐例JSON报告</text><text x="820" y="163">selected / expected / Recall@3</text><text x="820" y="194">无命中单独判定；调用数0</text><text x="55" y="320" font-weight="700">11组HTTP用例 / 20步</text><text x="55" y="353">请求、教学身份、步骤</text><text x="55" y="384">期望状态码与响应字段</text><text x="440" y="320" font-weight="700">实际路由与校验</text><text x="440" y="353">本地测试传输 + mock</text><text x="440" y="384">无真实供应商付费调用</text><text x="820" y="320" font-weight="700">协议断言结果</text><text x="820" y="353">权限 / 引用 / 幂等 / 记忆</text><text x="820" y="384">不是自然语言事实评分</text><text x="325" y="510" font-weight="700">回归门槛：检索条件 AND 协议/权限硬条件</text></g><g fill="none" stroke="#365c49" stroke-width="2.5" marker-end="url(#a)"><path d="M335 152H418"/><path d="M720 152H798"/><path d="M335 342H418"/><path d="M720 342H798"/><path d="M975 210V246H1160V445H780V463"/><path d="M975 400V435H650V463"/></g><rect x="35" y="583" width="1110" height="65" rx="12" fill="#fff" stroke="#9a7955" stroke-dasharray="8 5" stroke-width="2"/><text x="55" y="622" font-size="22">未运行：真实模型事实/证据支持、独立语义测试集、真实延迟与费用；不能由上面两层推出。</text></g></svg>
