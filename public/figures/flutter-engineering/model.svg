<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="t d"><title id="t">数据拥有者决定能否写入，框架决定怎样更新界面</title><desc id="d">DemoSource → Reading(deviceId, sequence, battery)；DeviceController：当前generation + 设备 + 新序号；连接状态与命令状态分开；切换/销毁使旧回调失效；notify → ListenableBuilder → Widget配置 / Element身份；RenderObject按需布局绘制 → 引擎/宿主；非全屏必重画；FirmwarePort → MethodChannel → 未实现插件 = unsupported</desc><rect width="1100" height="650" rx="20" fill="#f2f7f3"/><g font-family="system-ui,sans-serif" fill="#243e31"><text x="30" y="45" font-size="26" font-weight="700">数据拥有者决定能否写入，框架决定怎样更新界面</text><rect x="30" y="80" width="1040" height="65" rx="10" fill="white" stroke="#83a18c"/><text x="50" y="120" font-size="22" font-weight="700">来源</text><text x="140" y="120" font-size="20">DemoSource → Reading(deviceId, sequence, battery)</text><rect x="30" y="165" width="1040" height="65" rx="10" fill="white" stroke="#83a18c"/><text x="50" y="205" font-size="22" font-weight="700">校验</text><text x="140" y="205" font-size="20">DeviceController：当前generation + 设备 + 新序号</text><rect x="30" y="250" width="1040" height="65" rx="10" fill="white" stroke="#83a18c"/><text x="50" y="290" font-size="22" font-weight="700">状态</text><text x="140" y="290" font-size="20">连接状态与命令状态分开；切换/销毁使旧回调失效</text><rect x="30" y="335" width="1040" height="65" rx="10" fill="white" stroke="#83a18c"/><text x="50" y="375" font-size="22" font-weight="700">界面</text><text x="140" y="375" font-size="20">notify → ListenableBuilder → Widget配置 / Element身份</text><rect x="30" y="420" width="1040" height="65" rx="10" fill="white" stroke="#83a18c"/><text x="50" y="460" font-size="22" font-weight="700">渲染</text><text x="140" y="460" font-size="20">RenderObject按需布局绘制 → 引擎/宿主；非全屏必重画</text><rect x="30" y="505" width="1040" height="65" rx="10" fill="white" stroke="#83a18c"/><text x="50" y="545" font-size="22" font-weight="700">平台</text><text x="140" y="545" font-size="20">FirmwarePort → MethodChannel → 未实现插件 = unsupported</text><text x="30" y="625" font-size="16">职责示意，不代表线程、耗时比例或经过设备验证的性能结论。</text></g></svg>