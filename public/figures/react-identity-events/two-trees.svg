<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Portal的两种父子关系</title><desc id="d">React树中按钮属于App下面的Portal，DOM中Portal与App的main都是body下后代。React捕获从App到按钮，冒泡从按钮回App。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#365c49"/></marker></defs><rect width="960" height="420" rx="16" fill="#f2f7f3"/><g font-family="system-ui,sans-serif" fill="#243e31"><text x="30" y="40" font-size="24" font-weight="700">DOM 放在哪里，与 React 事件归谁，是两条关系</text><g font-size="20" text-anchor="middle"><text x="245" y="85">React 逻辑树</text><text x="710" y="85">浏览器 DOM 树</text><g fill="white" stroke="#61876f" stroke-width="2"><rect x="150" y="110" width="190" height="50" rx="8"/><rect x="150" y="215" width="190" height="50" rx="8"/><rect x="615" y="110" width="190" height="50" rx="8"/><rect x="505" y="215" width="190" height="50" rx="8"/><rect x="730" y="215" width="190" height="50" rx="8"/></g><text x="245" y="142">App / main</text><text x="245" y="247">Portal button</text><text x="710" y="142">body</text><text x="600" y="247">root → main</text><text x="825" y="247">backdrop → button</text></g><g stroke="#365c49" stroke-width="2" marker-end="url(#a)" fill="none"><path d="M220 163V210"/><path d="M275 210V163"/><path d="M680 163L610 210"/><path d="M750 163L815 210"/></g><g font-size="16"><text x="80" y="190">捕获 ↓</text><text x="300" y="190">冒泡 ↑</text><text x="60" y="320">App 的 onClick 能收到 Portal 按钮事件</text><text x="515" y="320">main.contains(button) 为 false</text><text x="30" y="380">示意仅表达父子关系；省略真实 Fiber 与 DOM 中间节点，非事件委托内部实现图。</text></g></g></svg>
