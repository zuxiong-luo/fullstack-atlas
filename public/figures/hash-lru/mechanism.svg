<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img"><title>哈希冲突解决定位，LRU维护访问顺序</title><desc>两种关系各自有不变量；本LRU用JS Map索引，不直接复用左侧教学表。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285443"/></marker></defs><rect width="1200" height="830" rx="24" fill="#f3f7f4"/><text x="32" y="45" font-family="system-ui,sans-serif" font-size="28" fill="#173c2e" font-weight="700">哈希冲突解决定位，LRU维护访问顺序</text><text x="32" y="82" font-family="system-ui,sans-serif" font-size="17" fill="#173c2e">两种关系各自有不变量；本LRU用JS Map索引，不直接复用左侧教学表。</text><text x="35" y="140" font-family="system-ui,sans-serif" font-size="23" fill="#173c2e" font-weight="700">常数哈希：同桶 ≠ 同键</text><rect x="40" y="170" width="100" height="60" rx="10" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="54" y="200" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">0</text><path d="M140 200H190" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="195" y="170" width="295" height="60" rx="10" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="209" y="200" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">A=1 → B=2 → C=3</text><rect x="40" y="275" width="100" height="60" rx="10" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="54" y="305" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">1</text><path d="M140 305H190" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="195" y="275" width="295" height="60" rx="10" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="209" y="305" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">空</text><rect x="40" y="380" width="100" height="60" rx="10" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="54" y="410" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">2</text><path d="M140 410H190" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="195" y="380" width="295" height="60" rx="10" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="209" y="410" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">空</text><rect x="40" y="485" width="100" height="60" rx="10" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="54" y="515" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">3</text><path d="M140 515H190" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="195" y="485" width="295" height="60" rx="10" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="209" y="515" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">空</text><text x="40" y="645" font-family="system-ui,sans-serif" font-size="19" fill="#173c2e">get(B)：落入桶0，再逐项比较原键</text><text x="40" y="680" font-family="system-ui,sans-serif" font-size="19" fill="#173c2e">size=3，capacity=4，α=0.75</text><text x="40" y="715" font-family="system-ui,sans-serif" font-size="19" fill="#173c2e">哈希一样，也不能覆盖另一个键。</text><text x="590" y="140" font-family="system-ui,sans-serif" font-size="23" fill="#173c2e" font-weight="700">LRU：头部MRU，尾部LRU</text><text x="595" y="175" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">put(A,1)</text><rect x="600" y="190" width="510" height="65" rx="10" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="614" y="220" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">A</text><path d="M855 258V285" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#arrow)"/><text x="595" y="320" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">put(B,2)</text><rect x="600" y="335" width="510" height="65" rx="10" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="614" y="365" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">B ⇄ A</text><path d="M855 403V430" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#arrow)"/><text x="595" y="465" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">get(A) 命中</text><rect x="600" y="480" width="510" height="65" rx="10" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="614" y="510" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">A ⇄ B</text><path d="M855 548V575" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#arrow)"/><text x="595" y="610" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">put(C,3)，淘汰B</text><rect x="600" y="625" width="510" height="65" rx="10" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="614" y="655" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">C ⇄ A</text><text x="590" y="790" font-family="system-ui,sans-serif" font-size="18" fill="#173c2e">Map定位节点；双向链摘链与头插只改常数条引用。</text></svg>
