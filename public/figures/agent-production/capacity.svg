<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" role="img" aria-labelledby="title desc"><title id="title">单槽示意：响应超时与资源结算分开</title><desc id="desc">按从上到下顺序阅读。每个状态框含转换条件及结果。此图为实现流程示意。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#42665b"/></marker></defs><rect width="1000" height="790" rx="20" fill="#f1f6f3"/><g font-family="Arial, sans-serif" fill="#173c31"><text x="48" y="56" font-size="28" font-weight="bold">单槽示意：响应超时与资源结算分开</text><rect x="48" y="90" width="904" height="100" rx="12" fill="white" stroke="#6e9788" stroke-width="2"/><text x="72" y="126" font-size="24" font-weight="bold">A 进入 → active = 1</text><text x="72" y="163" font-size="21">原始 provider 工作中；用户请求等待 deadline</text><path d="M500,192 V215" stroke="#42665b" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="220" width="904" height="100" rx="12" fill="white" stroke="#6e9788" stroke-width="2"/><text x="72" y="256" font-size="24" font-weight="bold">deadline 到 → A 收到 504</text><text x="72" y="293" font-size="21">发出取消请求；若 provider 忽略取消，active 仍为 1</text><path d="M500,322 V345" stroke="#42665b" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="350" width="904" height="100" rx="12" fill="white" stroke="#6e9788" stroke-width="2"/><text x="72" y="386" font-size="24" font-weight="bold">B 到来 → 503 SERVICE_BUSY</text><text x="72" y="423" font-size="21">不创建排队；GET / 工具 / 记忆不占模型执行槽</text><path d="M500,452 V475" stroke="#42665b" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="480" width="904" height="100" rx="12" fill="white" stroke="#6e9788" stroke-width="2"/><text x="72" y="516" font-size="24" font-weight="bold">A 原始任务真正结算 → active = 0</text><text x="72" y="553" font-size="21">done callback / allSettled 才释放；迟到结果不单独落库</text><path d="M500,582 V605" stroke="#42665b" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="610" width="904" height="100" rx="12" fill="white" stroke="#6e9788" stroke-width="2"/><text x="72" y="646" font-size="24" font-weight="bold">C 到来 → 可以执行</text><text x="72" y="683" font-size="21">默认容量为 2；本图用 1 解释边界，不代表实测耗时</text></g></svg>