<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">回滚的是本次批次，已提交的记录保留</title><desc id="desc">正常时整批提交；任何一条在提交前失败，整批回滚。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#356d53"/></marker></defs><rect width="1000" height="600" rx="22" fill="#f5f8f6"/><g font-family="Arial, 'PingFang SC', sans-serif"><text x="40" y="52" font-size="30" fill="#20392f" font-weight="700">回滚的是本次批次，已提交的记录保留</text><text x="40" y="88" font-size="21" fill="#4e675b" font-weight="400">正常时整批提交；任何一条在提交前失败，整批回滚。</text><rect x="40" y="125" width="415" height="135" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="62" y="163" font-size="25" fill="#20392f" font-weight="650">此前已经提交</text><text x="62" y="202" font-size="22" fill="#20392f" font-weight="400">学习 SQL</text><text x="62" y="233" font-size="22" fill="#20392f" font-weight="400">本次事务开始前已经存在</text><rect x="545" y="125" width="415" height="135" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="567" y="163" font-size="25" fill="#20392f" font-weight="650">本次批量写入</text><text x="567" y="202" font-size="22" fill="#20392f" font-weight="400">先写：学习 Python（未提交）</text><text x="567" y="233" font-size="22" fill="#20392f" font-weight="400">再写：学习 SQL（标题重复）</text><path d="M455 190 L535 190" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><rect x="545" y="355" width="415" height="130" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="567" y="393" font-size="25" fill="#20392f" font-weight="650">第二条触发唯一约束</text><text x="567" y="432" font-size="22" fill="#20392f" font-weight="400">抛出 IntegrityError</text><text x="567" y="463" font-size="22" fill="#20392f" font-weight="400">with connection 退出时回滚</text><path d="M750 260 L750 345" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="355" width="415" height="130" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="62" y="393" font-size="25" fill="#20392f" font-weight="650">重新打开：仍只有原记录</text><text x="62" y="432" font-size="22" fill="#20392f" font-weight="400">学习 SQL</text><text x="62" y="463" font-size="22" fill="#20392f" font-weight="400">本批的学习 Python 没有留下</text><path d="M545 420 L465 420" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="565" font-size="21" fill="#4e675b" font-weight="400">以实际 SQLite 文件验证：先提交，再触发失败，关闭后重新打开。</text></g></svg>