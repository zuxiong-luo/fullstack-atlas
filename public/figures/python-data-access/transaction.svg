<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="title desc"><title id="title">笔记批次在真实事务中一起提交或回滚</title><desc id="desc">池独占借出连接A与B，A持有写事务插入新n1后遇已存在n2，回滚使n1不保留。B只能等有期限的写锁，不会因池有两个连接就成为第二个同时写者。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#32644d"/></marker></defs><rect width="960" height="580" fill="#f7faf6"/><g font-family="system-ui,sans-serif" fill="#23473b"><text x="28" y="42" font-size="27">连接可以有两条，写事务仍只能有一个</text><g fill="#edf5ed" stroke="#668c78"><rect x="30" y="80" width="430" height="80" rx="12"/><rect x="500" y="80" width="430" height="80" rx="12"/><rect x="30" y="210" width="430" height="180" rx="12"/><rect x="500" y="210" width="430" height="180" rx="12"/><rect x="30" y="440" width="900" height="100" rx="12"/></g><g font-size="18"><text x="45" y="112">池借用A：只给当前请求使用</text><text x="45" y="141">BEGIN IMMEDIATE → 取得写事务</text><text x="515" y="112">池借用B：另一条真实连接</text><text x="515" y="141">BEGIN IMMEDIATE → 等写锁</text><text x="45" y="245">批次 [n1新笔记, n2已存在]</text><text x="45" y="280">INSERT n1：已经执行</text><text x="45" y="315">INSERT n2：唯一键冲突</text><text x="45" y="350">ROLLBACK：n1与其标签一起撤销</text><text x="515" y="245">连接已取得，不等于写锁已取得</text><text x="515" y="280">超过busy期限：失败并归还连接</text><text x="515" y="315">A结束后，可重新尝试新的事务</text><text x="515" y="350">不是无限重试，也不承诺请求未提交</text><text x="45" y="473">归还lease前：未结束事务先ROLLBACK；坏句柄fail closed</text><text x="45" y="510">重新打开同一文件：只见原有n2；进程重启不会把已提交笔记清空。</text></g><g stroke="#32644d" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M245 165V203"/><path d="M715 165V203"/><path d="M245 395V433"/><path d="M715 395V433"/></g><text x="30" y="568" font-size="16">状态与锁关系示意，不是耗时/吞吐图；本章只验证本机SQLite文件，不涉及跨主机事务。</text></g></svg>
