<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc"><title id="title">订单状态与恢复窗口</title><desc id="desc">同Redis预占事件；数据库提交后ACK；支付与关闭竞争待支付状态，关闭Outbox按事件去重恢复名额。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#416953"/></marker></defs><style>text{font-family:system-ui,-apple-system,'PingFang SC',sans-serif;fill:#203e32} .t{font-size:30px;font-weight:700} .s{font-size:22px} .note{font-size:19px;fill:#496459} .box{fill:white;stroke:#77a88e;stroke-width:2} .line{fill:none;stroke:#416953;stroke-width:2.5;marker-end:url(#arrow)} .dash{fill:none;stroke:#a55640;stroke-width:2.5;stroke-dasharray:6 5;marker-end:url(#arrow)}</style><rect width="1000" height="590" rx="22" fill="#eef4ef"/><text x="36" y="48" class="t">三个恢复位置：预占、数据库提交、消息确认</text><rect x="36" y="88" width="280" height="110" rx="12" class="box"/><text x="54" y="122" class="s">① Redis 内同段 Lua</text><text x="54" y="152" class="s">名额、用户、事件</text><path d="M316 143 L352 143" class="line"/><rect x="358" y="88" width="280" height="110" rx="12" class="box"/><text x="376" y="122" class="s">② 数据库事务提交</text><text x="376" y="152" class="s">订单＋库存＋请求结果</text><path d="M638 143 L674 143" class="line"/><rect x="680" y="88" width="280" height="110" rx="12" class="box"/><text x="698" y="122" class="s">③ XACK 确认</text><text x="698" y="152" class="s">提交后崩溃可重投</text><text x="36" y="240" class="s">② → ③ 之间失败：pending 重领；相同请求编号不再扣库存。</text><rect x="36" y="290" width="280" height="110" rx="12" class="box"/><text x="54" y="324" class="s">PENDING_PAYMENT</text><text x="54" y="354" class="s">订单和库存一起转换</text><path d="M316 325 L390 305" class="line"/><rect x="396" y="270" width="260" height="80" rx="12" class="box"/><text x="414" y="304" class="s">PAID：预占 → 已售</text><path d="M316 370 L390 405" class="line"/><rect x="396" y="365" width="260" height="100" rx="12" class="box"/><text x="414" y="399" class="s">CLOSED：预占 → 可用</text><text x="414" y="429" class="s">同事务写 releases</text><path d="M656 415 L698 415" class="line"/><rect x="704" y="365" width="256" height="100" rx="12" class="box"/><text x="722" y="399" class="s">Redis 恢复名额</text><text x="722" y="429" class="s">按 event.id 去重</text><text x="36" y="515" class="note">Redis 已释放、applied 未标记：重放同事件不重复加名额。</text><text x="36" y="551" class="note">Lua 出错不自动回滚；Redis 数据丢失／复制切换需额外重建与对账。</text></svg>