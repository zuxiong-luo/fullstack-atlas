<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">检查、扣减与行锁</title><desc id="desc">上半部分是Redis独立命令的错误交错；下半部分是数据库行锁与条件重检。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#416953"/></marker></defs><style>text{font-family:system-ui,-apple-system,'PingFang SC',sans-serif;fill:#203e32} .t{font-size:30px;font-weight:700} .s{font-size:22px} .note{font-size:19px;fill:#496459} .box{fill:white;stroke:#77a88e;stroke-width:2} .line{fill:none;stroke:#416953;stroke-width:2.5;marker-end:url(#arrow)} .dash{fill:none;stroke:#a55640;stroke-width:2.5;stroke-dasharray:6 5;marker-end:url(#arrow)}</style><rect width="1000" height="500" rx="22" fill="#eef4ef"/><text x="36" y="48" class="t">检查与修改：两种不同的并发顺序</text><text x="36" y="92" class="s">反例：GET 与 DECR 是独立请求，两个检查都可能通过</text><rect x="36" y="116" width="260" height="105" rx="12" class="box"/><text x="54" y="150" class="s">初始库存 1</text><text x="54" y="180" class="s">A GET → 1；B GET → 1</text><path d="M296 169 L350 169" class="line"/><rect x="354" y="116" width="260" height="105" rx="12" class="box"/><text x="372" y="150" class="s">A DECR → 0</text><text x="372" y="180" class="s">B DECR → -1</text><path d="M614 169 L665 169" class="line"/><rect x="670" y="116" width="290" height="105" rx="12" class="box"/><text x="688" y="150" class="s">两个请求都认为可买</text><text x="688" y="180" class="s">业务检查已失效</text><text x="36" y="280" class="s">数据库：同一行 UPDATE 等待前一个事务，再重检条件</text><rect x="36" y="310" width="260" height="110" rx="12" class="box"/><text x="54" y="344" class="s">A：UPDATE 条件成立</text><text x="54" y="374" class="s">持有行锁，库存 1 → 0</text><path d="M296 365 L350 365" class="line"/><rect x="354" y="310" width="260" height="110" rx="12" class="box"/><text x="372" y="344" class="s">A：COMMIT 释放锁</text><text x="372" y="374" class="s">B：从等锁继续</text><path d="M614 365 L665 365" class="line"/><rect x="670" y="310" width="290" height="110" rx="12" class="box"/><text x="688" y="344" class="s">B：检查 available &gt; 0</text><text x="688" y="374" class="s">条件不成立，更新 0 行</text><text x="36" y="466" class="note">前提：PostgreSQL 17 / Read Committed；图中箭头是顺序，不是耗时。</text></svg>