<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="595" viewBox="0 0 1000 595" role="img" aria-labelledby="title desc"><title id="title">准入、队列与数据库预算</title><desc id="desc">有效请求进入有界Stream，再受控写数据库；失败请求在Redis之前或Redis返回。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#416953"/></marker></defs><style>text{font-family:system-ui,-apple-system,'PingFang SC',sans-serif;fill:#203e32} .t{font-size:30px;font-weight:700} .s{font-size:22px} .note{font-size:19px;fill:#496459} .box{fill:white;stroke:#77a88e;stroke-width:2} .line{fill:none;stroke:#416953;stroke-width:2.5;marker-end:url(#arrow)} .dash{fill:none;stroke:#a55640;stroke-width:2.5;stroke-dasharray:6 5;marker-end:url(#arrow)}</style><rect width="1000" height="595" rx="22" fill="#eef4ef"/><text x="36" y="48" class="t">把请求挡在数据库前面，同时保留最终校验</text><rect x="36" y="86" width="280" height="104" rx="12" class="box"/><text x="54" y="120" class="s">用户请求 → 网关</text><text x="54" y="150" class="s">鉴权、限流、过载拒绝</text><path d="M316 138 L375 138" class="line"/><rect x="380" y="86" width="580" height="104" rx="12" class="box"/><text x="398" y="120" class="s">Redis Lua：去重 → 名额 → 容量 → 预占＋XADD</text><text x="398" y="150" class="s">EXISTING / SOLD_OUT / BUSY 在此返回</text><path d="M670 190 L670 245" class="line"/><text x="690" y="224" class="note">仅新预占进入事件日志</text><rect x="380" y="250" width="580" height="104" rx="12" class="box"/><text x="398" y="284" class="s">Redis Stream：最多保留 128 个历史事件</text><text x="398" y="314" class="s">本例 ACK 不删历史；容量满则保守拒绝</text><path d="M670 354 L670 405" class="line"/><rect x="380" y="410" width="580" height="104" rx="12" class="box"/><text x="398" y="444" class="s">消费者：每批 ≤ 32，每次调用默认并发 2</text><text x="398" y="474" class="s">数据库：订单、用户唯一约束、条件库存、事务</text><rect x="36" y="250" width="280" height="104" rx="12" class="box"/><text x="54" y="284" class="s">重复／售罄／繁忙</text><text x="54" y="314" class="s">不进入数据库建单</text><path d="M380 165 L316 270" class="dash"/><rect x="36" y="410" width="280" height="104" rx="12" class="box"/><text x="54" y="444" class="s">调用者查询结果</text><text x="54" y="474" class="s">排队 ≠ 已有订单</text><path d="M380 462 L316 462" class="line"/><text x="36" y="560" class="note">网关／多副本全局预算需要另行部署；本例不声称无限吞吐。</text></svg>