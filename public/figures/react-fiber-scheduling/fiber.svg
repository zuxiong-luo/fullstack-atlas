<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Fiber 的 current 和 work-in-progress</title><desc id="desc">当前树和计算中的工作树由 alternate 连接。工作树用 child 指向孩子，sibling 指向兄弟，return 指回父级。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#385b50"/></marker></defs>
<rect width="960" height="520" rx="16" fill="#f6f8f3"/>
<g font-family="system-ui,sans-serif" fill="#183c31" font-size="20"><text x="38" y="43" font-size="25" font-weight="bold">Fiber 保存结构与工作状态（教学简图）</text><text x="70" y="96">current：最近一次提交</text><text x="538" y="96">work-in-progress：正在计算</text>
<g fill="#fff" stroke="#76988b" stroke-width="2"><rect x="100" y="130" width="190" height="64" rx="10"/><rect x="45" y="306" width="145" height="64" rx="10"/><rect x="250" y="306" width="145" height="64" rx="10"/><rect x="600" y="130" width="190" height="64" rx="10"/><rect x="515" y="306" width="145" height="64" rx="10"/><rect x="765" y="306" width="145" height="64" rx="10"/></g>
<text x="140" y="170">App Fiber</text><text x="75" y="346">Input</text><text x="275" y="346">Results</text><text x="640" y="170">App Fiber</text><text x="545" y="346">Input</text><text x="790" y="346">Results</text>
<g stroke="#385b50" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M180 194 L120 306"/><path d="M190 338 L250 338"/><path d="M650 194 L580 306"/><path d="M660 338 L765 338"/><path d="M850 306 L770 194"/></g>
<text x="566" y="247">child</text><text x="682" y="323">sibling</text><text x="810" y="246">return</text>
<path d="M290 160 L600 160" stroke="#7b6195" stroke-width="2" stroke-dasharray="7 5"/><text x="390" y="148" fill="#69517f">alternate</text>
<text x="42" y="423">每个节点还保存：props / state / updateQueue / lanes / flags</text><text x="42" y="463">函数组件不一定对应 DOM；工作树未提交时，旧界面仍然可见。</text>
</g></svg>
