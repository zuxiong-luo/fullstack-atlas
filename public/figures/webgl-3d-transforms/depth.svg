<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-labelledby="title desc"><title id="title">深度回答“谁更近”，不是“谁先提交 draw”</title><desc id="desc">两个相交投影三角形用于对照深度测试与画家顺序。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#356b58"/></marker></defs><rect width="940" height="500" fill="#f7faf7"/><g font-family="system-ui,sans-serif"><text x="28" y="42" font-size="27" fill="#23473b">深度回答“谁更近”，不是“谁先提交 draw”</text><rect x="40" y="90" width="385" height="130" rx="12" fill="#edf5ee" stroke="#668c78"/><text x="55" y="121" font-size="18" fill="#23473b">红三角形 z = +0.25</text><text x="55" y="149" font-size="18" fill="#23473b">相机在 z = 3，朝 -Z</text><text x="55" y="177" font-size="18" fill="#23473b">观察空间更近，深度值更小</text><rect x="515" y="90" width="385" height="130" rx="12" fill="#edf5ee" stroke="#668c78"/><text x="530" y="121" font-size="18" fill="#23473b">蓝三角形 z = -0.25</text><text x="530" y="149" font-size="18" fill="#23473b">蓝色后画</text><text x="530" y="177" font-size="18" fill="#23473b">画得晚不代表离相机近</text><rect x="40" y="295" width="385" height="100" rx="12" fill="#edf5ee" stroke="#668c78"/><text x="55" y="326" font-size="18" fill="#23473b">DEPTH_TEST + LESS</text><text x="55" y="354" font-size="18" fill="#23473b">红色先写深度，蓝色重叠处失败</text><rect x="515" y="295" width="385" height="100" rx="12" fill="#edf5ee" stroke="#668c78"/><text x="530" y="326" font-size="18" fill="#23473b">关闭深度测试</text><text x="530" y="354" font-size="18" fill="#23473b">后画的蓝色覆盖重叠像素</text><path d="M233 226V287" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="252" y="260" font-size="16" fill="#23473b">位置 → 投影后比较深度</text><path d="M708 226V287" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="727" y="260" font-size="16" fill="#23473b">只按绘制顺序</text><text x="40" y="455" font-size="20" fill="#23473b">实验起始角度为 0°；旋转后，比较的是每个片元的深度。</text></g></svg>