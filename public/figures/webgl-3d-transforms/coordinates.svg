<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-labelledby="title desc"><title id="title">三维坐标不是一个空间：每个矩阵改变表达位置的参考系</title><desc id="desc">从对象到世界再到观察空间，投影得到裁剪坐标，裁剪后透视除法得到NDC再映到窗口。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#356b58"/></marker></defs><rect width="940" height="500" fill="#f7faf7"/><g font-family="system-ui,sans-serif"><text x="28" y="42" font-size="27" fill="#23473b">三维坐标不是一个空间：每个矩阵改变表达位置的参考系</text><rect x="30" y="85" width="260" height="95" rx="12" fill="#edf5ee" stroke="#668c78"/><text x="45" y="116" font-size="18" fill="#23473b">对象坐标</text><text x="45" y="144" font-size="18" fill="#23473b">三角形自身的点</text><rect x="330" y="85" width="260" height="95" rx="12" fill="#edf5ee" stroke="#668c78"/><text x="345" y="116" font-size="18" fill="#23473b">世界坐标</text><text x="345" y="144" font-size="18" fill="#23473b">M：放置物体</text><rect x="630" y="85" width="260" height="95" rx="12" fill="#edf5ee" stroke="#668c78"/><text x="645" y="116" font-size="18" fill="#23473b">观察坐标</text><text x="645" y="144" font-size="18" fill="#23473b">V：相机的逆变换</text><path d="M293 133H325" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="301" y="121" font-size="16" fill="#23473b">M</text><path d="M593 133H625" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="601" y="121" font-size="16" fill="#23473b">V</text><path d="M760 185V248" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="779" y="221" font-size="16" fill="#23473b">P</text><rect x="630" y="255" width="260" height="110" rx="12" fill="#edf5ee" stroke="#668c78"/><text x="645" y="286" font-size="18" fill="#23473b">裁剪坐标 (x,y,z,w)</text><text x="645" y="314" font-size="18" fill="#23473b">先按 ±w 裁剪</text><text x="645" y="342" font-size="18" fill="#23473b">不能先丢掉 w</text><rect x="330" y="255" width="260" height="110" rx="12" fill="#edf5ee" stroke="#668c78"/><text x="345" y="286" font-size="18" fill="#23473b">NDC：x/w,y/w,z/w</text><text x="345" y="314" font-size="18" fill="#23473b">可见体映到 [-1,1]</text><text x="345" y="342" font-size="18" fill="#23473b">透视除法由管线完成</text><rect x="30" y="255" width="260" height="110" rx="12" fill="#edf5ee" stroke="#668c78"/><text x="45" y="286" font-size="18" fill="#23473b">窗口坐标与深度</text><text x="45" y="314" font-size="18" fill="#23473b">viewport 映到像素</text><text x="45" y="342" font-size="18" fill="#23473b">深度默认映到 [0,1]</text><path d="M625 310H595" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="296" font-size="16" fill="#23473b">÷w</text><path d="M325 310H295" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="252" y="393" font-size="16" fill="#23473b">viewport</text><text x="30" y="445" font-size="20" fill="#23473b">列向量约定：clip = P × V × M × local；右边的变换先作用。</text></g></svg>