<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="t d"><title id="t">工具执行与MCP适配边界</title><desc id="d">HTTP请求带服务端映射身份，stdio启动环境固定身份；两者进入同一工具执行器，依次检查name白名单、参数和owner范围，成功返回文档，否则拒绝。模型和文档不能改变策略。</desc><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#315a47"/></marker></defs><rect width="1100" height="520" rx="18" fill="#f4f8f5"/><g font-family="system-ui,sans-serif" fill="#213b30"><text x="30" y="43" font-size="25" font-weight="bold">两种连接方式，共用一个工具授权边界</text><g fill="#fff" stroke="#315a47" stroke-width="2"><rect x="30" y="100" width="250" height="105" rx="10"/><rect x="30" y="280" width="250" height="105" rx="10"/><rect x="385" y="145" width="350" height="215" rx="10"/><rect x="830" y="145" width="240" height="215" rx="10"/></g><g font-size="22"><text x="48" y="140">HTTP /v2/tools</text><text x="48" y="178">Bearer → owner</text><text x="48" y="321">MCP stdio 子集</text><text x="48" y="359">启动环境 → owner</text><text x="405" y="186">executeTool / execute_tool</text><text x="405" y="228">1. 固定 name 白名单</text><text x="405" y="270">2. 严格 document_id</text><text x="405" y="312">3. public 或当前 owner</text><text x="850" y="190">只读共享文档</text><text x="850" y="237">成功：id/title/text</text><text x="850" y="279">越权/不存在同拒绝</text><text x="850" y="321">无 URL / shell 能力</text></g><g fill="none" stroke="#315a47" stroke-width="2" marker-end="url(#a)"><path d="M280 152H330V225H380"/><path d="M280 332H330V280H380"/><path d="M735 250H825"/></g><text x="30" y="450" font-size="21">模型/文档：可以提供不可信内容；不能修改白名单、身份和资源所有权。</text><text x="30" y="492" font-size="18">教学身份不是真实认证；MCP只实现2025-06-18 tools stdio子集，不宣称完整协议。</text></g></svg>