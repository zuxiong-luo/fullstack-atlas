<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" role="img" aria-labelledby="title desc">
<title id="title">阅读清单的数据归属与更新方向</title><desc id="desc">局部筛选和共享阅读清单共同派生页面；服务端摘要按用户查询键进入缓存，并独立显示。派生数据不作为第二份事实。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="none" stroke="#496657" stroke-width="1.5"/></marker></defs>
<rect width="1080" height="640" rx="18" fill="#f4f8f3"/>
<g font-family="system-ui, sans-serif" fill="#203e32">
<text x="40" y="48" font-size="28" font-weight="700">状态归属：事实、展示条件与服务端副本</text>
<g stroke="#819f8a" stroke-width="2" fill="#fff"><rect x="40" y="100" width="310" height="110" rx="12"/><rect x="40" y="300" width="310" height="120" rx="12"/><rect x="480" y="170" width="540" height="170" rx="12"/><rect x="40" y="500" width="260" height="90" rx="12"/><rect x="430" y="480" width="330" height="130" rx="12"/><rect x="865" y="500" width="175" height="90" rx="12"/></g>
<text x="62" y="138" font-size="22" font-weight="700">组件状态：只看未读</text><text x="62" y="177" font-size="20">改变筛选，不改变清单事实</text>
<text x="62" y="340" font-size="22" font-weight="700">Store：阅读清单</text><text x="62" y="378" font-size="20">books → 不可变的新快照</text>
<text x="505" y="210" font-size="24" font-weight="700">渲染时派生</text><text x="505" y="252" font-size="22">可见列表 = 清单 + 筛选条件</text><text x="505" y="294" font-size="22">已读数量 = 清单中 read 为 true 的数量</text>
<g stroke="#496657" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M350 155 H400 V215 H478"/><path d="M350 360 H420 V285 H478"/><path d="M300 545 H428"/><path d="M760 545 H863"/></g>
<text x="50" y="460" font-size="21" font-weight="700">独立的服务端摘要：权威数据在服务器</text>
<text x="62" y="538" font-size="22">模拟接口</text><text x="62" y="570" font-size="19">返回摘要 / 可能失败</text>
<text x="320" y="526" font-size="18">响应</text>
<text x="451" y="517" font-size="21" font-weight="700">按用户 + 参数构造 key</text><text x="451" y="552" font-size="19">data / status / stale / version</text><text x="451" y="584" font-size="19">缓存稳定快照，旧响应不可覆盖</text>
<text x="782" y="526" font-size="18">读取</text><text x="883" y="538" font-size="21">摘要区域</text><text x="883" y="570" font-size="18">成功 / 刷新 / 错误</text>
<text x="490" y="389" font-size="20">派生结果不反向同步成另一份事实。</text>
</g></svg>
