<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc"><title id="title">两端向右推进，不能替代正数前提</title><desc id="desc">正数最短达标窗口用左闭右闭计算长度，返回end则右开。负数使缩小窗口不再单调。</desc><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285443"/></marker></defs><rect width="1000" height="780" fill="#f3f7f4"/><g font-family="system-ui,PingFang SC,sans-serif"><text x="30" y="44" font-size="28" fill="#173c2e">两端向右推进，不能替代正数前提</text><rect x="40" y="110" width="920" height="120" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="141" font-size="20" fill="#173c2e">数组 [2,3,1,2,4,3]，target=7</text><text x="56" y="170" font-size="20" fill="#173c2e">扩张右端至 r=5 后，可收缩到 [4,5]：4+3=7</text><text x="56" y="199" font-size="20" fill="#173c2e">返回 start=4，end=6（右开），length=2</text><rect x="40" y="285" width="920" height="140" rx="12" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="56" y="316" font-size="20" fill="#173c2e">正数前提：向右扩张只会增大sum，移走左项只会减小sum</text><text x="56" y="345" font-size="20" fill="#173c2e">sum达标时连续收缩；每个左端离开一次，不需回头</text><text x="56" y="374" font-size="20" fill="#173c2e">证明的是候选不会漏掉，不是看到两个指针就可以套窗口</text><rect x="40" y="480" width="920" height="165" rx="12" fill="#fff4dc" stroke="#6d987f" stroke-width="2"/><text x="56" y="511" font-size="20" fill="#173c2e">反例 [1,-1,5]，target=5</text><text x="56" y="540" font-size="20" fill="#173c2e">若盲套正数算法：sum=5 → 去掉1后变4，停止收缩</text><text x="56" y="569" font-size="20" fill="#173c2e">留下长度3，错过单独[5]的长度1；负数-1本应继续移除</text><text x="56" y="598" font-size="20" fill="#173c2e">本例明确拒绝负数；有负数的最短和问题需另选方法</text><text x="40" y="725" font-size="18" fill="#173c2e">目标不同，窗口有效条件也不同；下标边界必须随代码一起核对。</text></g></svg>
