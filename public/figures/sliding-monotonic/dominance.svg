<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc"><title id="title">最大值候选：过期与支配，是两种删除依据</title><desc id="desc">宽度3，输入1,3,-1,-3,5。右端从3到4时先移除过期下标1，再由新5淘汰旧候选2、3，最终只剩4。</desc><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285443"/></marker></defs><rect width="1000" height="780" fill="#f3f7f4"/><g font-family="system-ui,PingFang SC,sans-serif"><text x="30" y="44" font-size="28" fill="#173c2e">最大值候选：过期与支配，是两种删除依据</text><text x="30" y="90" font-size="20" fill="#173c2e">输入 [1, 3, -1, -3, 5]，k=3；格内为 下标:值</text><rect x="40" y="130" width="920" height="100" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="161" font-size="20" fill="#173c2e">处理 r=3 后，窗口 [1,3]</text><text x="56" y="190" font-size="20" fill="#173c2e">候选队首→队尾：1:3 → 2:-1 → 3:-3</text><path d="M500 234L500 280" stroke="#285443" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="530" y="267" font-size="18" fill="#173c2e">r=4，窗口左界变2</text><rect x="40" y="285" width="920" height="100" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="316" font-size="20" fill="#173c2e">先从队首删除 1:3：下标1 &lt; left=2，已经过期</text><text x="56" y="345" font-size="20" fill="#173c2e">剩余 2:-1 → 3:-3；不是因为3的值太小才过期</text><path d="M500 390L500 435" stroke="#285443" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="40" y="440" width="920" height="100" rx="12" fill="#fff4dc" stroke="#6d987f" stroke-width="2"/><text x="56" y="471" font-size="20" fill="#173c2e">从队尾删除 3:-3、2:-1：新4:5更大，且存活更久</text><text x="56" y="500" font-size="20" fill="#173c2e">二者对任何未来合法窗口都不可能胜过4:5</text><path d="M500 545L500 590" stroke="#285443" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="40" y="595" width="920" height="100" rx="12" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="56" y="626" font-size="20" fill="#173c2e">加入 4:5 → 当前最大值5</text><text x="56" y="655" font-size="20" fill="#173c2e">候选下标递增，值严格递减；相等值保留更新的下标</text><text x="40" y="745" font-size="18" fill="#173c2e">这是候选删除推导，不是对全部输入排序，也不是耗时示意。</text></g></svg>
