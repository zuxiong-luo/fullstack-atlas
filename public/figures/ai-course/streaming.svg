<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc"><title id="title">后台任务与浏览器订阅分开</title><desc id="desc">创建只发生一次；事件续接不重新生成；取消必须单独通知任务。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#35664f"/></marker></defs><style>text{font-family:system-ui,-apple-system,'PingFang SC',sans-serif;fill:#203e30;text-anchor:middle}.label{font-size:21px;font-weight:650}.small{font-size:17px}.edge{font-size:16px;paint-order:stroke;stroke:#f5f8f5;stroke-width:6px;stroke-linejoin:round}.heading{font-size:27px;font-weight:700;text-anchor:start}</style><rect width="1120" height="560" rx="20" fill="#f5f8f5"/><text x="34" y="45" class="heading">后台任务与浏览器订阅分开</text><rect x="30" y="95" width="255" height="100" rx="14" fill="#ffffff" stroke="#8ba996" stroke-width="2"/><text x="157.5" y="127" class="label">浏览器创建</text><text x="157.5" y="154" class="small">POST /runs</text><rect x="430" y="95" width="255" height="100" rx="14" fill="#ffffff" stroke="#8ba996" stroke-width="2"/><text x="557.5" y="127" class="label">服务端接受</text><text x="557.5" y="154" class="small">返回任务 ID</text><rect x="830" y="95" width="255" height="100" rx="14" fill="#e4f0e4" stroke="#8ba996" stroke-width="2"/><text x="957.5" y="127" class="label">后台生成任务</text><text x="957.5" y="154" class="small">只创建一次</text><path d="M285,145 L430,145" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="357.5" y="133.0" class="edge">问题</text><path d="M685,145 L830,145" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="757.5" y="133.0" class="edge">启动</text><rect x="30" y="265" width="255" height="100" rx="14" fill="#ffffff" stroke="#8ba996" stroke-width="2"/><text x="157.5" y="297" class="label">EventSource</text><text x="157.5" y="324" class="small">GET events?after=N</text><text x="157.5" y="347" class="small">暂停只关闭这里</text><rect x="430" y="265" width="255" height="100" rx="14" fill="#e4f0e4" stroke="#8ba996" stroke-width="2"/><text x="557.5" y="297" class="label">有序事件日志</text><text x="557.5" y="324" class="small">id: 1,2,3…</text><text x="557.5" y="347" class="small">按游标重放</text><rect x="830" y="265" width="255" height="100" rx="14" fill="#ffffff" stroke="#8ba996" stroke-width="2"/><text x="957.5" y="297" class="label">生成文本片段</text><text x="957.5" y="324" class="small">delta 与终态</text><text x="957.5" y="347" class="small">不是模型 Token</text><path d="M430,315 L285,315" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="357.5" y="303.0" class="edge">事件流</text><path d="M830,315 L685,315" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="757.5" y="303.0" class="edge">追加事件</text><path d="M958,195 L958,265" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="958.0" y="218.0" class="edge">运行</text><rect x="30" y="435" width="255" height="85" rx="14" fill="#ffffff" stroke="#8ba996" stroke-width="2"/><text x="157.5" y="467" class="label">取消按钮</text><text x="157.5" y="494" class="small">POST cancel</text><rect x="430" y="435" width="255" height="85" rx="14" fill="#ffffff" stroke="#8ba996" stroke-width="2"/><text x="557.5" y="467" class="label">找到任务控制器</text><text x="557.5" y="494" class="small">发出 AbortSignal</text><rect x="830" y="435" width="255" height="85" rx="14" fill="#fff0e9" stroke="#8ba996" stroke-width="2"/><text x="957.5" y="467" class="label">协作停止生成</text><text x="957.5" y="494" class="small">追加 cancelled</text><path d="M285,475 L430,475" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="357.5" y="463.0" class="edge">明确取消</text><path d="M685,475 L830,475" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="757.5" y="463.0" class="edge">signal</text></svg>