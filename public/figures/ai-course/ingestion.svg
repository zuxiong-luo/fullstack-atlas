<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">入库版本与在线引用共享身份</title><desc id="desc">写入链原子替换文档和切片；读取先过滤租户，检索后校验活动版本。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#35664f"/></marker></defs><style>text{font-family:system-ui,-apple-system,'PingFang SC',sans-serif;fill:#203e30;text-anchor:middle}.label{font-size:21px;font-weight:650}.small{font-size:17px}.edge{font-size:16px;paint-order:stroke;stroke:#f5f8f5;stroke-width:6px;stroke-linejoin:round}.heading{font-size:27px;font-weight:700;text-anchor:start}</style><rect width="1120" height="510" rx="20" fill="#f5f8f5"/><text x="34" y="45" class="heading">入库版本与在线引用共享身份</text><rect x="60" y="95" width="260" height="100" rx="14" fill="#ffffff" stroke="#8ba996" stroke-width="2"/><text x="190.0" y="127" class="label">纯文本 + 来源</text><text x="190.0" y="154" class="small">规范化换行</text><text x="190.0" y="177" class="small">不假装解析 PDF</text><rect x="430" y="95" width="260" height="100" rx="14" fill="#ffffff" stroke="#8ba996" stroke-width="2"/><text x="560.0" y="127" class="label">确定切分策略</text><text x="560.0" y="154" class="small">字符窗口与重叠</text><text x="560.0" y="177" class="small">保留 start / end</text><rect x="800" y="95" width="260" height="100" rx="14" fill="#e4f0e4" stroke="#8ba996" stroke-width="2"/><text x="930.0" y="127" class="label">同库事务替换</text><text x="930.0" y="154" class="small">tenant + doc + version</text><text x="930.0" y="177" class="small">当前文档与切片一起提交</text><path d="M320,145 L430,145" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="375.0" y="133.0" class="edge">规范文本</text><path d="M690,145 L800,145" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="745.0" y="133.0" class="edge">新版本切片</text><rect x="30" y="340" width="215" height="100" rx="14" fill="#ffffff" stroke="#8ba996" stroke-width="2"/><text x="137.5" y="372" class="label">可信身份</text><text x="137.5" y="399" class="small">tenant 来自调用方</text><rect x="310" y="340" width="215" height="100" rx="14" fill="#e4f0e4" stroke="#8ba996" stroke-width="2"/><text x="417.5" y="372" class="label">权限内候选</text><text x="417.5" y="399" class="small">先 WHERE tenant=?</text><rect x="590" y="340" width="215" height="100" rx="14" fill="#ffffff" stroke="#8ba996" stroke-width="2"/><text x="697.5" y="372" class="label">词法检索</text><text x="697.5" y="399" class="small">自定义可解释评分</text><text x="697.5" y="422" class="small">不是 embedding</text><rect x="870" y="340" width="215" height="100" rx="14" fill="#e4f0e4" stroke="#8ba996" stroke-width="2"/><text x="977.5" y="372" class="label">引用验证</text><text x="977.5" y="399" class="small">匹配当前版本</text><text x="977.5" y="422" class="small">旧引用拒绝</text><path d="M245,390 L310,390" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="277.5" y="378.0" class="edge">租户</text><path d="M525,390 L590,390" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="557.5" y="378.0" class="edge">候选</text><path d="M805,390 L870,390" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="837.5" y="378.0" class="edge">切片 ID</text><path d="M930,195 L978,340" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="954.0" y="255.5" class="edge">版本与来源</text></svg>