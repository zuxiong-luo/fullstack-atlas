<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">模型提议与数据库执行之间的边界</title><desc id="desc">可信身份与不可信计划分别进入校验；固定SQL绑定租户并在只读连接执行。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#35664f"/></marker></defs><style>text{font-family:system-ui,-apple-system,'PingFang SC',sans-serif;fill:#203e30;text-anchor:middle}.label{font-size:21px;font-weight:650}.small{font-size:17px}.edge{font-size:16px;paint-order:stroke;stroke:#f5f8f5;stroke-width:6px;stroke-linejoin:round}.heading{font-size:27px;font-weight:700;text-anchor:start}</style><rect width="1120" height="510" rx="20" fill="#f5f8f5"/><text x="34" y="45" class="heading">模型提议与数据库执行之间的边界</text><rect x="30" y="95" width="270" height="100" rx="14" fill="#e4f0e4" stroke="#8ba996" stroke-width="2"/><text x="165.0" y="127" class="label">可信 Principal</text><text x="165.0" y="154" class="small">tenant + 工具读取权限</text><rect x="30" y="290" width="270" height="100" rx="14" fill="#ffffff" stroke="#8ba996" stroke-width="2"/><text x="165.0" y="322" class="label">不可信查询计划</text><text x="165.0" y="349" class="small">只有 status + limit</text><text x="165.0" y="372" class="small">禁止 sql / tenant 字段</text><rect x="410" y="190" width="245" height="100" rx="14" fill="#e4f0e4" stroke="#8ba996" stroke-width="2"/><text x="532.5" y="222" class="label">校验与编译</text><text x="532.5" y="249" class="small">严格字段 / 枚举 / 范围</text><text x="532.5" y="272" class="small">固定 SQL 结构</text><rect x="790" y="190" width="300" height="100" rx="14" fill="#e4f0e4" stroke="#8ba996" stroke-width="2"/><text x="940.0" y="222" class="label">受限 SQLite 查询</text><text x="940.0" y="249" class="small">tenant 值由身份绑定</text><text x="940.0" y="272" class="small">query_only + VM 预算</text><rect x="410" y="380" width="245" height="100" rx="14" fill="#fff0e9" stroke="#8ba996" stroke-width="2"/><text x="532.5" y="412" class="label">明确拒绝</text><text x="532.5" y="439" class="small">越权、注入、未知字段</text><text x="532.5" y="462" class="small">不执行查询</text><rect x="790" y="380" width="300" height="100" rx="14" fill="#ffffff" stroke="#8ba996" stroke-width="2"/><text x="940.0" y="412" class="label">授权范围内结果</text><text x="940.0" y="439" class="small">仅白名单三列</text><text x="940.0" y="462" class="small">最多二十行</text><path d="M300,145 L410,225" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="355.0" y="173.0" class="edge">身份</text><path d="M300,340 L410,265" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="355.0" y="290.5" class="edge">计划</text><path d="M655,240 L790,240" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="722.5" y="228.0" class="edge">SQL + 参数</text><path d="M532,290 L532,380" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="532.0" y="323.0" class="edge">不合格</text><path d="M940,290 L940,380" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="940.0" y="323.0" class="edge">合格结果</text></svg>