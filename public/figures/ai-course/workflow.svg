<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">检查点与副作用有不同的提交时刻</title><desc id="desc">批准后执行，拒绝则终止；写回执后故障会重放执行，由同库唯一约束保证不重复插入。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#35664f"/></marker></defs><style>text{font-family:system-ui,-apple-system,'PingFang SC',sans-serif;fill:#203e30;text-anchor:middle}.label{font-size:21px;font-weight:650}.small{font-size:17px}.edge{font-size:16px;paint-order:stroke;stroke:#f5f8f5;stroke-width:6px;stroke-linejoin:round}.heading{font-size:27px;font-weight:700;text-anchor:start}</style><rect width="1120" height="510" rx="20" fill="#f5f8f5"/><text x="34" y="45" class="heading">检查点与副作用有不同的提交时刻</text><rect x="30" y="95" width="210" height="100" rx="14" fill="#ffffff" stroke="#8ba996" stroke-width="2"/><text x="135.0" y="127" class="label">prepare</text><text x="135.0" y="154" class="small">确定性提案</text><rect x="325" y="95" width="230" height="100" rx="14" fill="#e4f0e4" stroke="#8ba996" stroke-width="2"/><text x="440.0" y="127" class="label">approval</text><text x="440.0" y="154" class="small">interrupt 暂停</text><text x="440.0" y="177" class="small">确认绑定提案摘要</text><rect x="665" y="95" width="230" height="100" rx="14" fill="#ffffff" stroke="#8ba996" stroke-width="2"/><text x="780.0" y="127" class="label">execute</text><text x="780.0" y="154" class="small">apply_once</text><text x="780.0" y="177" class="small">可能发生故障窗口</text><rect x="950" y="95" width="145" height="100" rx="14" fill="#e4f0e4" stroke="#8ba996" stroke-width="2"/><text x="1022.5" y="127" class="label">完成</text><text x="1022.5" y="154" class="small">completed</text><path d="M240,145 L325,145" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="282.5" y="133.0" class="edge">进入</text><path d="M555,145 L665,145" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="610.0" y="133.0" class="edge">批准</text><path d="M895,145 L950,145" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="922.5" y="133.0" class="edge">节点成功</text><rect x="325" y="340" width="230" height="100" rx="14" fill="#edf2f0" stroke="#8ba996" stroke-width="2"/><text x="440.0" y="372" class="label">SQLite 检查点</text><text x="440.0" y="399" class="small">新图加载同一 thread</text><text x="440.0" y="422" class="small">不是保存 Python 调用栈</text><rect x="30" y="340" width="210" height="100" rx="14" fill="#fff0e9" stroke="#8ba996" stroke-width="2"/><text x="135.0" y="372" class="label">拒绝结束</text><text x="135.0" y="399" class="small">不产生回执</text><rect x="680" y="340" width="380" height="100" rx="14" fill="#e4f0e4" stroke="#8ba996" stroke-width="2"/><text x="870.0" y="372" class="label">同库幂等回执</text><text x="870.0" y="399" class="small">operation 唯一，摘要必须相同</text><text x="870.0" y="422" class="small">已写回执后重放，仍只一条</text><path d="M325,195 L230,340" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="277.5" y="255.5" class="edge">拒绝</text><path d="M555,340 L665,195" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="610.0" y="255.5" class="edge">故障恢复重放</text><path d="M780,195 L865,340" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="822.5" y="255.5" class="edge">本地事务写入</text></svg>