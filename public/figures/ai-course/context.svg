<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">模型调用中的职责与预算</title><desc id="desc">浏览器问题交给后端；后端构造受限上下文，模型返回后经过校验。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#35664f"/></marker></defs><style>text{font-family:system-ui,-apple-system,'PingFang SC',sans-serif;fill:#203e30;text-anchor:middle}.label{font-size:21px;font-weight:650}.small{font-size:17px}.edge{font-size:16px;paint-order:stroke;stroke:#f5f8f5;stroke-width:6px;stroke-linejoin:round}.heading{font-size:27px;font-weight:700;text-anchor:start}</style><rect width="1120" height="510" rx="20" fill="#f5f8f5"/><text x="34" y="45" class="heading">模型调用中的职责与预算</text><rect x="30" y="110" width="200" height="100" rx="14" fill="#ffffff" stroke="#8ba996" stroke-width="2"/><text x="130.0" y="142" class="label">浏览器</text><text x="130.0" y="169" class="small">用户问题</text><text x="130.0" y="192" class="small">没有模型密钥</text><rect x="300" y="110" width="240" height="100" rx="14" fill="#e4f0e4" stroke="#8ba996" stroke-width="2"/><text x="420.0" y="142" class="label">后端请求边界</text><text x="420.0" y="169" class="small">可信身份 + 上下文</text><text x="420.0" y="192" class="small">检查本地输入预算</text><rect x="620" y="110" width="200" height="100" rx="14" fill="#ffffff" stroke="#8ba996" stroke-width="2"/><text x="720.0" y="142" class="label">模型</text><text x="720.0" y="169" class="small">提出结果</text><text x="720.0" y="192" class="small">不直接改业务库</text><rect x="890" y="110" width="200" height="100" rx="14" fill="#e4f0e4" stroke="#8ba996" stroke-width="2"/><text x="990.0" y="142" class="label">应用校验</text><text x="990.0" y="169" class="small">解析 / 业务检查</text><text x="990.0" y="192" class="small">合格后返回页面</text><path d="M230,160 L300,160" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="265.0" y="148.0" class="edge">问题</text><path d="M540,160 L620,160" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="580.0" y="148.0" class="edge">输入</text><path d="M820,160 L890,160" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="855.0" y="148.0" class="edge">输出</text><rect x="90" y="335" width="260" height="100" rx="14" fill="#ffffff" stroke="#8ba996" stroke-width="2"/><text x="220.0" y="367" class="label">必须保留</text><text x="220.0" y="394" class="small">规则 + 当前问题</text><rect x="430" y="335" width="260" height="100" rx="14" fill="#ffffff" stroke="#8ba996" stroke-width="2"/><text x="560.0" y="367" class="label">可裁剪历史</text><text x="560.0" y="394" class="small">保留连续完整轮次</text><rect x="800" y="335" width="260" height="100" rx="14" fill="#fff0e9" stroke="#8ba996" stroke-width="2"/><text x="930.0" y="367" class="label">必要输入超预算</text><text x="930.0" y="394" class="small">拒绝或缩小任务</text><path d="M420,210 L220,335" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="320.0" y="260.5" class="edge">规则与问题</text><path d="M420,210 L560,335" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="490.0" y="260.5" class="edge">历史选择</text><path d="M540,210 L930,335" fill="none" stroke="#35664f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="735.0" y="260.5" class="edge">超过预算不调用</text></svg>