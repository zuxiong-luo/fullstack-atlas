<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">同一条Lane可以属于多个集合</title><desc id="desc">A和Idle均pending，A挂起后收到ping。三个字段不是互斥队列，A仍在pending和suspended中。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#44685c" stroke-width="1.5"/></marker></defs><rect width="960" height="500" rx="20" fill="#f5f8f3"/><g font-family="system-ui,sans-serif" fill="#193d34"><text x="36" y="50" font-size="25" font-weight="700">A 等待依赖后收到 ping：根状态快照</text><text x="36" y="84" font-size="17" font-weight="400">同一个位出现在多个字段里，不表示复制了多个任务。</text><rect x="36" y="114" width="888" height="98" rx="12" fill="#deece3" stroke="#668979"/><text x="58" y="148" font-size="20" font-weight="700">pending = A | Idle</text><text x="58" y="184" font-size="18" font-weight="400">还有未完成工作；这里不表示它们都能立即推进。</text><rect x="36" y="232" width="424" height="124" rx="12" fill="#fff1d8" stroke="#668979"/><text x="58" y="269" font-size="20" font-weight="700">suspended = A</text><text x="58" y="306" font-size="18" font-weight="400">A 此前受阻，没有完成。</text><text x="58" y="335" font-size="18" font-weight="400">它仍在 pending 里。</text><rect x="484" y="232" width="440" height="124" rx="12" fill="#e5eef9" stroke="#668979"/><text x="506" y="269" font-size="20" font-weight="700">pinged = A</text><text x="506" y="306" font-size="18" font-weight="400">收到重试信号，不保证成功。</text><text x="506" y="335" font-size="18" font-weight="400">不会立即从 suspended 删除。</text><text x="36" y="402" font-size="19" font-weight="700">选择过程</text><text x="36" y="434" font-size="18" font-weight="400">非 idle 池是 A → 未挂起集合为空 → 已 ping 集合是 A → 尝试 A</text><text x="36" y="470" font-size="16" font-weight="400">去掉 ping 后返回空；A 仍 pending 时，不直接转去做 Idle。此图无耗时含义。</text></g></svg>