<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc"><title id="title">Lane选择中的提前返回</title><desc id="desc">先挑非idle未挂起或pinged候选，再比较WIP。保留WIP就直接返回，不再执行连续事件合批和纠缠扩展。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#44685c" stroke-width="1.5"/></marker></defs><rect width="960" height="760" rx="20" fill="#f5f8f3"/><g font-family="system-ui,sans-serif" fill="#193d34"><text x="36" y="48" font-size="25" font-weight="700">先看 return 在哪里，再概括合批规则</text><text x="36" y="83" font-size="17" font-weight="400">React 18.3.1.old · 已有非空候选后的主要分支（教学简图）</text><rect x="260" y="110" width="440" height="82" rx="12" fill="#deece3" stroke="#668979"/><text x="285" y="144" font-size="20" font-weight="400">挑出当前最高类别候选</text><text x="285" y="175" font-size="17" font-weight="400">Transition 可能包含多个位</text><path d="M480 192V234" fill="none" stroke="#44685c" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="246" width="440" height="118" rx="12" fill="#fff1d8" stroke="#668979"/><text x="280" y="279" font-size="20" font-weight="400">WIP 非空、不同、未挂起？</text><text x="280" y="310" font-size="17" font-weight="400">候选同级/更低，或 Default 遇到</text><text x="280" y="339" font-size="17" font-weight="400">正在进行的 Transition → 保留 WIP</text><path d="M260 304H192V432" fill="none" stroke="#44685c" stroke-width="2" marker-end="url(#arrow)"/><text x="73" y="392" font-size="18" font-weight="400">满足保留条件</text><rect x="40" y="444" width="270" height="116" rx="12" fill="#e5eef9" stroke="#668979"/><text x="64" y="481" font-size="21" font-weight="700">return wipLanes</text><text x="64" y="516" font-size="17" font-weight="400">本轮不再扩展纠缠。</text><text x="64" y="544" font-size="17" font-weight="400">不是无条件原子合批。</text><path d="M480 364V422" fill="none" stroke="#44685c" stroke-width="2" marker-end="url(#arrow)"/><text x="500" y="398" font-size="17" font-weight="400">其他情况继续</text><rect x="350" y="434" width="480" height="84" rx="12" fill="#deece3" stroke="#668979"/><text x="374" y="469" font-size="20" font-weight="400">包含 Continuous？</text><text x="374" y="500" font-size="17" font-weight="400">稳定版默认分支带上 pending Default</text><path d="M590 518V562" fill="none" stroke="#44685c" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="574" width="480" height="84" rx="12" fill="#deece3" stroke="#668979"/><text x="374" y="609" font-size="20" font-weight="400">扩展已建立的 entanglements</text><text x="374" y="640" font-size="17" font-weight="400">从候选参与者并入关联集合</text><path d="M590 658V693" fill="none" stroke="#44685c" stroke-width="2" marker-end="url(#arrow)"/><text x="464" y="728" font-size="21" font-weight="700">return nextLanes</text></g></svg>