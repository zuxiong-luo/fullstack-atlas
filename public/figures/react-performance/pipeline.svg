<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title"><title id="title">先区分等待发生在哪一层</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#4b8065"/></marker></defs><rect width="1100" height="520" rx="20" fill="#f4f8f5"/><g font-family="system-ui,sans-serif" fill="#263e33"><text x="32" y="48" font-size="29">先区分等待发生在哪一层</text><rect x="35" y="135" width="180" height="62" rx="12" fill="#dfede5" stroke="#4b8065"/><text x="47" y="174" font-size="21">输入排队</text><rect x="255" y="135" width="180" height="62" rx="12" fill="#dfede5" stroke="#4b8065"/><text x="267" y="174" font-size="21">事件处理</text><rect x="475" y="135" width="180" height="62" rx="12" fill="#dfede5" stroke="#4b8065"/><text x="487" y="174" font-size="21">React 计算</text><rect x="695" y="135" width="180" height="62" rx="12" fill="#dfede5" stroke="#4b8065"/><text x="707" y="174" font-size="21">DOM 提交</text><rect x="915" y="135" width="150" height="62" rx="12" fill="#dfede5" stroke="#4b8065"/><text x="927" y="174" font-size="21">布局 / 绘制</text><path d="M220 166 L248 166" fill="none" stroke="#4b8065" stroke-width="2.5" marker-end="url(#a)"/><path d="M440 166 L468 166" fill="none" stroke="#4b8065" stroke-width="2.5" marker-end="url(#a)"/><path d="M660 166 L688 166" fill="none" stroke="#4b8065" stroke-width="2.5" marker-end="url(#a)"/><path d="M880 166 L908 166" fill="none" stroke="#4b8065" stroke-width="2.5" marker-end="url(#a)"/><text x="35" y="280" font-size="24">Profiler：观察 React 子树的渲染成本</text><text x="35" y="332" font-size="24">Performance：观察主线程、长任务、布局与绘制</text><text x="35" y="384" font-size="24">Network：观察请求等待、传输与资源加载顺序</text><text x="35" y="465" font-size="25">一次“组件少渲染”不能直接证明完整交互更快。</text></g></svg>