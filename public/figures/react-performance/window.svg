<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title"><title id="title">固定行高窗口：只挂载附近的一段</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#4b8065"/></marker></defs><rect width="1100" height="520" rx="20" fill="#f4f8f5"/><g font-family="system-ui,sans-serif" fill="#263e33"><text x="32" y="48" font-size="29">固定行高窗口：只挂载附近的一段</text><rect x="40" y="110" width="285" height="62" rx="12" fill="#dfede5" stroke="#4b8065"/><text x="52" y="149" font-size="21">总高度：300 × 44px</text><text x="40" y="220" font-size="24">scrollTop = 440px</text><text x="40" y="270" font-size="24">视口高 264px = 6 行</text><text x="40" y="320" font-size="24">overscan = 两侧各 3 行</text><rect x="530" y="110" width="490" height="325" rx="10" fill="#e0eae4" stroke="#4b8065"/><text x="555" y="150" font-size="21">上方占位：start × 44 = 308px</text><rect x="550" y="174" width="450" height="46" fill="#c1d9cc"/><text x="565" y="204" font-size="21">前侧额外行：索引 7～9</text><rect x="550" y="220" width="450" height="110" fill="#90bea6"/><text x="565" y="262" font-size="23">视口：索引 10～15</text><text x="565" y="300" font-size="21">共 6 行，264px</text><rect x="550" y="330" width="450" height="46" fill="#c1d9cc"/><text x="565" y="360" font-size="21">后侧额外行：索引 16～18</text><text x="555" y="412" font-size="21">下方留出剩余总高度</text><text x="40" y="485" font-size="23">渲染区间 [7,19)，12 行；行卸载后仍需保留的选中状态放在父层。</text></g></svg>