<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 530" role="img" aria-labelledby="t d"><title id="t">任务Fiber三轮对象身份与current切换</title><desc id="d">已挂载任务current为F1且没有alternate。第一次更新创建F2，F1与F2互相连接，提交后current指向F2。第二次更新复用F1，提交后current又指向F1。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#365f50"/></marker></defs><rect width="1040" height="530" rx="16" fill="#f5f7f2"/><g font-family="system-ui,sans-serif" fill="#234c3b" font-size="20"><text x="28" y="42" font-size="25">同一任务的两个对应节点，按需创建并轮换</text><text x="30" y="103">已挂载</text><text x="30" y="249">第一次更新</text><text x="30" y="395">第二次更新</text><g fill="#fff" stroke="#658779"><rect x="215" y="75" width="220" height="65" rx="8"/><rect x="215" y="205" width="220" height="90" rx="8"/><rect x="590" y="205" width="220" height="90" rx="8"/><rect x="215" y="350" width="220" height="90" rx="8"/><rect x="590" y="350" width="220" height="90" rx="8"/></g><text x="235" y="114">F1 · current</text><text x="485" y="114">alternate = null</text><text x="235" y="242">F1 · 提交前current</text><text x="235" y="276">已存在对象</text><text x="610" y="242">F2 · 新建工作节点</text><text x="610" y="276">提交后成为current</text><text x="235" y="387">F1 · 复用工作节点</text><text x="235" y="421">提交后成为current</text><text x="610" y="387">F2 · 提交前current</text><text x="610" y="421">已存在对象</text><g stroke="#365f50" fill="none" stroke-width="2" marker-end="url(#a)"><path d="M435 230H590"/><path d="M590 275H435"/><path d="M435 375H590"/><path d="M590 420H435"/></g><text x="453" y="258" font-size="17">alternate</text><text x="453" y="403" font-size="17">alternate</text><text x="30" y="493">F1/F2是教学对象标识；HostRoot初始化不同，图不表示完整树或DOM副本。</text></g></svg>
