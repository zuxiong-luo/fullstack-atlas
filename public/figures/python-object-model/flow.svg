<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">一个类，创建两份独立的实例</title><desc id="desc">first.finish() 调用时，self 指向 first，不会同时把 second 改掉。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#356d53"/></marker></defs><rect width="1000" height="600" rx="22" fill="#f5f8f6"/><g font-family="Arial, 'PingFang SC', sans-serif"><text x="40" y="52" font-size="30" fill="#20392f" font-weight="700">一个类，创建两份独立的实例</text><text x="40" y="88" font-size="21" fill="#4e675b" font-weight="400">first.finish() 调用时，self 指向 first，不会同时把 second 改掉。</text><rect x="350" y="120" width="300" height="110" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="372" y="158" font-size="25" fill="#20392f" font-weight="650">Note 类</text><text x="372" y="197" font-size="22" fill="#20392f" font-weight="400">定义属性和方法</text><rect x="45" y="305" width="420" height="170" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="67" y="343" font-size="25" fill="#20392f" font-weight="650">first = Note(&quot;学习类&quot;)</text><text x="67" y="382" font-size="22" fill="#20392f" font-weight="400">title = &quot;学习类&quot;</text><text x="67" y="413" font-size="22" fill="#20392f" font-weight="400">done：False → True</text><text x="67" y="444" font-size="22" fill="#20392f" font-weight="400">first.finish() 修改这一份实例</text><rect x="535" y="305" width="420" height="170" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="557" y="343" font-size="25" fill="#20392f" font-weight="650">second = Note(&quot;复习函数&quot;)</text><text x="557" y="382" font-size="22" fill="#20392f" font-weight="400">title = &quot;复习函数&quot;</text><text x="557" y="413" font-size="22" fill="#20392f" font-weight="400">done = False</text><text x="557" y="444" font-size="22" fill="#20392f" font-weight="400">没有调用它的 finish()</text><path d="M410 230 L250 295" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><path d="M590 230 L745 295" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="565" font-size="21" fill="#4e675b" font-weight="400">属性属于各个实例；类中的方法提供操作这些实例的规则。</text></g></svg>