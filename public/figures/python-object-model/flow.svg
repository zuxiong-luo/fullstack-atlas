<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" role="img" aria-labelledby="title desc"><title id="title">Notebook实例拥有字典并组合Note值</title><desc id="desc">Notebook实例拥有字典并组合Note值；教学结构示意，箭头标注引用、推进或产出关系，不代表实际内存地址或多个线程。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17324d;font-size:20px}.title{font-size:27px;font-weight:700}.small{font-size:17px}.box{fill:#f0f6ff;stroke:#456f9a;stroke-width:2}.note{fill:#fff7e6;stroke:#9c751a;stroke-width:2}.arrow{fill:none;stroke:#315d85;stroke-width:2.5;marker-end:url(#arrow)}.return{fill:none;stroke:#9c751a;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#315d85"/></marker></defs><rect width="720" height="680" fill="#fff"/><text x="30" y="45" class="title">组合关系：成员索引可变，Note 值稳定</text><rect x="35" y="90" width="290" height="70" rx="12" class="box"/><text x="53" y="121" class="">Notebook A</text><text x="53" y="149" class="">实例自己的 _notes 字典</text><rect x="395" y="90" width="290" height="70" rx="12" class="box"/><text x="413" y="121" class="">Notebook B</text><text x="413" y="149" class="">另一份 _notes 字典</text><rect x="35" y="225" width="290" height="75" rx="12" class="box"/><text x="53" y="256" class="">n1 → Note 引用</text><text x="53" y="284" class="">n2 → Note 引用</text><rect x="395" y="225" width="290" height="75" rx="12" class="box"/><text x="413" y="256" class="">n1 → Note 引用</text><text x="413" y="284" class="">成员关系互相独立</text><path d="M180 160 V225" class="arrow"/><path d="M540 160 V225" class="arrow"/><text x="195" y="200" class="small">拥有</text><text x="555" y="200" class="small">拥有</text><rect x="35" y="405" width="290" height="90" rx="12" class="box"/><text x="53" y="436" class="">Note n1（可共享）</text><text x="53" y="464" class="">str / str / tuple[str, ...]</text><rect x="395" y="405" width="290" height="90" rx="12" class="box"/><text x="413" y="436" class="">Note n2</text><text x="413" y="464" class="">frozen 常规赋值受限</text><path d="M115 300 V405" class="arrow"/><path d="M235 300 V360 H540 V405" class="arrow"/><path d="M540 300 V335 H245 V405" class="arrow"/><text x="46" y="384" class="small">引用</text><text x="550" y="385" class="small">引用</text><text x="30" y="543" class="small">导入顺序：JSONL → parse_note → Note → book.add</text><text x="30" y="580" class="small">全部成功才返回 book 并打印 JSON；失败不交出部分结果。</text><text x="30" y="617" class="small">这不等于数据库事务，也不回滚外部副作用。</text><text x="30" y="654" class="small">引用结构为教学示意；字典按 ID 唯一，Note 按字段值比较。</text></svg>