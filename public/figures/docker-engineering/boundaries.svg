<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 820" role="img" aria-labelledby="title desc"><title id="title">Docker镜像、容器与命名卷</title><desc id="desc">固定镜像启动先后两个实例，普通UID与PID命名空间独立，数据卷跨实例存续，资源限制来自cgroup。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315d85"/></marker></defs><rect width="820" height="820" fill="white"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif" fill="#17324d"><text x="30" y="43" font-size="27" font-weight="700">镜像、实例与数据：寿命和责任分开</text><text x="30" y="82" font-size="19">先停v1再起v2；不演示多写者共享JSON文件。</text><rect x="230" y="120" width="360" height="85" rx="12" fill="#f0f6ff" stroke="#456f9a"/><text x="248" y="154" font-size="19">固定摘要的只读镜像</text><text x="248" y="184" font-size="19">app.py + exec CMD + UID10001</text><path d="M310 205V250H180V280" fill="none" stroke="#315d85" stroke-width="2.5" marker-end="url(#a)"/><path d="M510 205V250H640V280" fill="none" stroke="#315d85" stroke-width="2.5" marker-end="url(#a)"/><rect x="30" y="280" width="300" height="115" rx="12" fill="#f0f6ff" stroke="#456f9a"/><text x="48" y="314" font-size="19">v1容器 / PID1</text><text x="48" y="344" font-size="19">独立PID namespace</text><text x="48" y="374" font-size="19">POST写counter=1</text><rect x="490" y="280" width="300" height="115" rx="12" fill="#f0f6ff" stroke="#456f9a"/><text x="508" y="314" font-size="19">v2容器 / PID1</text><text x="508" y="344" font-size="19">新的运行实例</text><text x="508" y="374" font-size="19">同卷读counter=1</text><text x="351" y="320" font-size="18" font-weight="700">TERM</text><text x="346" y="350" font-size="18">先退出0</text><path d="M330 375H490" fill="none" stroke="#315d85" stroke-width="2.5" marker-end="url(#a)"/><path d="M180 395V450H285V480" fill="none" stroke="#315d85" stroke-width="2.5" marker-end="url(#a)"/><path d="M640 395V450H535V480" fill="none" stroke="#315d85" stroke-width="2.5" marker-end="url(#a)"/><rect x="220" y="480" width="380" height="95" rx="12" fill="#eef8ee" stroke="#456f9a"/><text x="238" y="514" font-size="19">专用命名卷 /data</text><text x="238" y="544" font-size="19">counter.json + stopped-v1.json</text><rect x="30" y="620" width="760" height="95" rx="12" fill="#fff8e8" stroke="#456f9a"/><text x="48" y="654" font-size="19">实际cgroup v2：cpu.max / memory.max / pids.max</text><text x="48" y="684" font-size="19">独立64MiB受限容器触发OOM；不向宿主无限施压</text><text x="30" y="760" font-size="18">只读rootfs和普通UID缩小范围；卷不等于事务、备份或安全沙箱。</text></g></svg>