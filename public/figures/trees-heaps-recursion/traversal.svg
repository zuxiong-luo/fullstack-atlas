<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc"><title id="title">同一棵树，输出时机决定遍历顺序</title><desc id="desc">二叉树根4，左2含1和3，右7含右孩子9。三种深度优先遍历与层序输出不同。</desc><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285443"/></marker></defs><rect width="1000" height="780" fill="#f3f7f4"/><g font-family="system-ui,PingFang SC,sans-serif"><text x="30" y="44" font-size="28" fill="#173c2e">同一棵树，输出时机决定遍历顺序</text><text x="30" y="92" font-size="18" fill="#173c2e">固定树不是“每个左孩子只需比父小”的排序定义；这里只展示结构。</text><path d="M500 188L250 269" stroke="#285443" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M500 188L750 269" stroke="#285443" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M250 328L125 409" stroke="#285443" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M250 328L375 409" stroke="#285443" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M750 328L875 409" stroke="#285443" stroke-width="2.5" fill="none" marker-end="url(#a)"/><circle cx="500" cy="160" r="31" fill="#fff" stroke="#285443"/><text x="493" y="167" font-size="24" fill="#173c2e">4</text><circle cx="250" cy="300" r="31" fill="#fff" stroke="#285443"/><text x="243" y="307" font-size="24" fill="#173c2e">2</text><circle cx="750" cy="300" r="31" fill="#fff" stroke="#285443"/><text x="743" y="307" font-size="24" fill="#173c2e">7</text><circle cx="125" cy="440" r="31" fill="#fff" stroke="#285443"/><text x="118" y="447" font-size="24" fill="#173c2e">1</text><circle cx="375" cy="440" r="31" fill="#fff" stroke="#285443"/><text x="368" y="447" font-size="24" fill="#173c2e">3</text><circle cx="875" cy="440" r="31" fill="#fff" stroke="#285443"/><text x="868" y="447" font-size="24" fill="#173c2e">9</text><rect x="40" y="535" width="920" height="165" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="566" font-size="20" fill="#173c2e">先序：4,2,1,3,7,9　（进入节点时输出）</text><text x="56" y="595" font-size="20" fill="#173c2e">中序：1,2,3,4,7,9　（左子树完成后输出）</text><text x="56" y="624" font-size="20" fill="#173c2e">后序：1,3,2,9,7,4　（两个子树完成后输出）</text><text x="56" y="653" font-size="20" fill="#173c2e">层序：4,2,7,1,3,9　（队列先进先出）</text></g></svg>
