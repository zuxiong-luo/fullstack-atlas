<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc"><title id="title">二叉最小堆：数组中的父子关系</title><desc id="desc">heapify 7,2,9,1,5,3得到1,2,3,7,5,9。父不大于孩子，不要求兄弟和数组整体有序。</desc><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285443"/></marker></defs><rect width="1000" height="780" fill="#f3f7f4"/><g font-family="system-ui,PingFang SC,sans-serif"><text x="30" y="44" font-size="28" fill="#173c2e">二叉最小堆：数组中的父子关系</text><rect x="40" y="110" width="920" height="100" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="141" font-size="20" fill="#173c2e">heapify([7,2,9,1,5,3]) → [1,2,3,7,5,9]</text><text x="56" y="170" font-size="20" fill="#173c2e">i=0 的孩子为1、2；i=1 的孩子为3、4；i=2 的孩子为5</text><rect x="40" y="270" width="920" height="120" rx="12" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="56" y="301" font-size="20" fill="#173c2e">局部不变量：data[parent(i)] ≤ data[i]</text><text x="56" y="330" font-size="20" fill="#173c2e">parent(i)=floor((i-1)/2)，left=2i+1，right=2i+2</text><text x="56" y="359" font-size="20" fill="#173c2e">7在5前面完全合法；堆不是排序数组</text><rect x="40" y="450" width="440" height="175" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="481" font-size="20" fill="#173c2e">插入：放到数组末尾</text><text x="56" y="510" font-size="20" fill="#173c2e">只可能破坏到父亲的关系</text><text x="56" y="539" font-size="20" fill="#173c2e">向上比较/交换</text><text x="56" y="568" font-size="20" fill="#173c2e">每次上升一层</text><rect x="520" y="450" width="440" height="175" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="536" y="481" font-size="20" fill="#173c2e">弹出：末项搬到根</text><text x="536" y="510" font-size="20" fill="#173c2e">与两个孩子中更小者比较</text><text x="536" y="539" font-size="20" fill="#173c2e">向下比较/交换</text><text x="536" y="568" font-size="20" fill="#173c2e">每次下降一层</text><text x="40" y="715" font-size="18" fill="#173c2e">单步修复沿高度推进；底向上建堆的总成本要按各层数量求和。</text></g></svg>
