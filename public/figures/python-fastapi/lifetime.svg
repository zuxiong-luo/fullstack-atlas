<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">请求先经过检查，再创建一条笔记</title><desc id="desc">正常与错误路径：具体校验先后由框架与当前请求情况决定。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#356d53"/></marker></defs><rect width="1000" height="600" rx="22" fill="#f5f8f6"/><g font-family="Arial, 'PingFang SC', sans-serif"><text x="40" y="52" font-size="30" fill="#20392f" font-weight="700">请求先经过检查，再创建一条笔记</text><text x="40" y="88" font-size="21" fill="#4e675b" font-weight="400">正常与错误路径：具体校验先后由框架与当前请求情况决定。</text><rect x="40" y="130" width="285" height="145" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="62" y="168" font-size="25" fill="#20392f" font-weight="650">请求到达</text><text x="62" y="207" font-size="22" fill="#20392f" font-weight="400">POST /notes</text><text x="62" y="238" font-size="22" fill="#20392f" font-weight="400">请求头 + JSON</text><rect x="370" y="130" width="270" height="145" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="392" y="168" font-size="25" fill="#20392f" font-weight="650">检查输入与令牌</text><text x="392" y="207" font-size="22" fill="#20392f" font-weight="400">无令牌 → 401</text><text x="392" y="238" font-size="22" fill="#20392f" font-weight="400">缺标题 → 422</text><rect x="690" y="130" width="270" height="145" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="712" y="168" font-size="25" fill="#20392f" font-weight="650">调用创建函数</text><text x="712" y="207" font-size="22" fill="#20392f" font-weight="400">纯空格 → 400</text><text x="712" y="238" font-size="22" fill="#20392f" font-weight="400">有空间 → 加入笔记本</text><path d="M325 200 L360 200" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><path d="M640 200 L680 200" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><rect x="690" y="360" width="270" height="130" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="712" y="398" font-size="25" fill="#20392f" font-weight="650">响应</text><text x="712" y="437" font-size="22" fill="#20392f" font-weight="400">201 + 笔记 JSON</text><text x="712" y="468" font-size="22" fill="#20392f" font-weight="400">当前保存在内存</text><path d="M825 275 L825 350" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="360" width="535" height="130" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="62" y="398" font-size="25" fill="#20392f" font-weight="650">启动 / 关闭</text><text x="62" y="437" font-size="22" fill="#20392f" font-weight="400">启动：新建 Notebook</text><text x="62" y="468" font-size="22" fill="#20392f" font-weight="400">关闭：当前内存记录不再保留</text><text x="40" y="565" font-size="21" fill="#4e675b" font-weight="400">201 是本次创建成功；本篇尚未将记录保存到硬盘。</text></g></svg>