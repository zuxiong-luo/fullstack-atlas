<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">笔记HTTP请求与有界导入任务的寿命</title><desc id="desc">请求通过字节限制和框架模型依赖后将一批笔记放入有界队列，202带回任务ID；固定worker组装完整批次后提交进程内存，lifespan关闭取消运行任务并清空等待任务。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#32644d"/></marker></defs><rect width="960" height="560" fill="#f7faf6"/><g font-family="system-ui,sans-serif" fill="#23473b"><text x="28" y="42" font-size="27">请求结束以后，谁还拥有已接收的导入？</text><g fill="#edf5ed" stroke="#668c78"><rect x="28" y="80" width="270" height="105" rx="12"/><rect x="345" y="80" width="270" height="105" rx="12"/><rect x="662" y="80" width="270" height="105" rx="12"/><rect x="28" y="280" width="270" height="125" rx="12"/><rect x="345" y="280" width="270" height="125" rx="12"/><rect x="662" y="280" width="270" height="125" rx="12"/></g><g font-size="18"><text x="43" y="111">HTTP请求 / JSON字节</text><text x="43" y="140">先累计字节：最多32768</text><text x="43" y="168">不是整台服务器内存上限</text><text x="360" y="111">框架边界与依赖</text><text x="360" y="140">模型：每批1..32条</text><text x="360" y="168">共享Bearer / 当前应用资源</text><text x="677" y="111">接收成功：202 + job ID</text><text x="677" y="140">不代表已经写入笔记</text><text x="677" y="168">客户端另查终态</text><text x="43" y="311">有限等待队列</text><text x="43" y="341">最多capacity批</text><text x="43" y="371">满时拒绝，HTTP429</text><text x="360" y="311">固定workers</text><text x="360" y="341">每人至多持有1批</text><text x="360" y="371">超时/取消要求协作让出</text><text x="677" y="311">先组装，再检查与提交</text><text x="677" y="341">内存notes最多512条</text><text x="677" y="371">任务记录最多64个</text></g><g stroke="#32644d" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M302 132H339"/><path d="M619 132H655"/><path d="M480 190V230H163V273"/><path d="M302 340H339"/><path d="M619 340H655"/></g><text x="40" y="218" font-size="17">提交一批，不为每个请求无限创建task</text><path d="M30 443H930" stroke="#668c78" stroke-width="2"/><text x="30" y="477" font-size="20">lifespan拥有队列与worker：停止接收 → 取消运行 → 等待批次标cancelled</text><text x="30" y="514" font-size="18">进程内语义示意；重启丢失，多进程不共享，不是耐久任务系统。</text></g></svg>
