<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630" role="img" aria-labelledby="title desc"><title id="title">OAuth本地授权码流程</title><desc id="desc">浏览器从客户端发起登录并建立state verifier事务，前往模拟issuer；issuer校验注册回调与challenge后返回code和state；客户端核对state，用verifier兑换，issuer校验挑战和code一次性；客户端调用模拟profile后轮换本地会话。OIDC不在实现范围。</desc><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#315a47"/></marker></defs><rect width="1100" height="630" fill="#f4f8f5" rx="18"/><g font-family="system-ui,sans-serif" fill="#213b30" font-size="21"><text x="30" y="38" font-size="25" font-weight="bold">授权码与PKCE：浏览器事务 + 服务端兑换</text><text x="55" y="87">浏览器</text><text x="385" y="87">客户端 :4311</text><text x="830" y="87">模拟 issuer :4310</text><g stroke="#91ab9e" stroke-dasharray="6 5"><path d="M100 105V570"/><path d="M440 105V570"/><path d="M920 105V570"/></g><g stroke="#315a47" stroke-width="2" marker-end="url(#a)"><path d="M100 140H435"/><path d="M440 200H105"/><path d="M100 260H915"/><path d="M920 320H105"/><path d="M100 380H435"/><path d="M440 440H915"/><path d="M920 500H445"/><path d="M440 555H105"/></g><text x="140" y="132">GET /login</text><text x="130" y="190">Cookie + 跳转，保存 state/verifier</text><text x="300" y="250">/authorize：state + challenge，模拟用户已同意</text><text x="300" y="310">仅回注册回调：code + state</text><text x="145" y="370">回调Cookie，先核对state</text><text x="490" y="430">/token：code + verifier + redirect</text><text x="490" y="490">一次性code → access token</text><text x="130" y="545">profile契约 → 轮换本站会话</text><text x="30" y="605" font-size="17">教学限制：固定subject，无真实登录/同意、无ID Token和OIDC校验；HTTP仅本机运行。</text></g></svg>