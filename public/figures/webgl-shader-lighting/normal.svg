<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc"><title id="title">非均匀缩放后，法线必须仍垂直于表面</title><desc id="desc">原切向量t=(1,1,0)，法线n=(1,-1,0)。X放大2后t变(2,1,0)，正确法线(.5,-1,0)点积0，错误(2,-1,0)点积3。</desc><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285443"/></marker></defs><rect width="1000" height="780" fill="#f3f7f4"/><g font-family="system-ui,PingFang SC,sans-serif"><text x="30" y="44" font-size="28" fill="#173c2e">非均匀缩放后，法线必须仍垂直于表面</text><rect x="40" y="110" width="920" height="110" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="141" font-size="20" fill="#173c2e">原空间：切线 t=(1,1,0)，法线 n=(1,-1,0)</text><text x="56" y="170" font-size="20" fill="#173c2e">t·n=0；法线是垂直方向，不是另一个顶点位置</text><path d="M500 225L500 270" stroke="#285443" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="40" y="275" width="440" height="170" rx="12" fill="#fff4dc" stroke="#6d987f" stroke-width="2"/><text x="56" y="306" font-size="20" fill="#173c2e">位置/切线用M变换</text><text x="56" y="335" font-size="20" fill="#173c2e">S=diag(2,1,1)</text><text x="56" y="364" font-size="20" fill="#173c2e">t′=(2,1,0)</text><text x="56" y="393" font-size="20" fill="#173c2e">如果n也用M：n错=(2,-1,0)</text><text x="56" y="422" font-size="20" fill="#173c2e">t′·n错=3，不再垂直</text><rect x="520" y="275" width="440" height="170" rx="12" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="536" y="306" font-size="20" fill="#173c2e">法线用transpose(inverse(M))</text><text x="536" y="335" font-size="20" fill="#173c2e">n′=(.5,-1,0)</text><text x="536" y="364" font-size="20" fill="#173c2e">t′·n′=0，仍垂直</text><text x="536" y="393" font-size="20" fill="#173c2e">之后再归一化</text><text x="536" y="422" font-size="20" fill="#173c2e">M只取模型线性3×3部分</text><rect x="40" y="530" width="920" height="120" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="561" font-size="20" fill="#173c2e">推导：(M t)·(M⁻ᵀ n) = t·n = 0</text><text x="56" y="590" font-size="20" fill="#173c2e">平移不进入方向变换，投影不用于世界空间光照</text><text x="56" y="619" font-size="20" fill="#173c2e">零缩放使逆矩阵不存在：应拒绝，不传NaN给shader</text><text x="40" y="725" font-size="18" fill="#173c2e">数值为CPU几何推导；正确/错误图像还需在真实WebGL2像素中验证。</text></g></svg>
