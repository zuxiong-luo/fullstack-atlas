<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc"><title id="title">逐像素光照：所有向量先说清同一空间</title><desc id="desc">模型位置和逆转置法线在顶点阶段变到世界空间，片元阶段重新归一化，用统一世界光向和视向计算简化Lambert与Blinn高光。</desc><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285443"/></marker></defs><rect width="1000" height="780" fill="#f3f7f4"/><g font-family="system-ui,PingFang SC,sans-serif"><text x="30" y="44" font-size="28" fill="#173c2e">逐像素光照：所有向量先说清同一空间</text><rect x="40" y="110" width="920" height="110" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="141" font-size="20" fill="#173c2e">顶点输入：位置 position、球面法线 normal</text><text x="56" y="170" font-size="20" fill="#173c2e">M·position → 世界位置；M⁻ᵀ·normal → 世界法线</text><path d="M500 225L500 270" stroke="#285443" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="40" y="275" width="920" height="120" rx="12" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="56" y="306" font-size="20" fill="#173c2e">插值传入片元：vWorld、vNormal</text><text x="56" y="335" font-size="20" fill="#173c2e">每片元 normalize(vNormal)，不能假设插值后仍是单位向量</text><text x="56" y="364" font-size="20" fill="#173c2e">投影只决定gl_Position；世界法线不乘投影矩阵</text><path d="M500 400L500 445" stroke="#285443" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="40" y="450" width="920" height="125" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="481" font-size="20" fill="#173c2e">L：从表面指向平行光源的世界方向</text><text x="56" y="510" font-size="20" fill="#173c2e">V：世界相机位置 - vWorld；H=normalize(L+V)</text><text x="56" y="539" font-size="20" fill="#173c2e">漫反射max(N·L,0)，高光pow(max(N·H,0),shine)</text><rect x="40" y="635" width="920" height="90" rx="12" fill="#fff4dc" stroke="#6d987f" stroke-width="2"/><text x="56" y="666" font-size="20" fill="#173c2e">材质色/环境项/高光是简化模型；近似gamma2.2非完整sRGB/PBR</text><text x="56" y="695" font-size="20" fill="#173c2e">没有阴影、距离衰减、能量守恒或真实材料校准</text></g></svg>
