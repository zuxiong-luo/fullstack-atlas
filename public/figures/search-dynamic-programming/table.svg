<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc"><title id="title">0/1背包：一维压缩必须保持“上一行”的含义</title><desc id="desc">单件重量2、价值3，容量4。降序不会重复使用该件，升序会错误得到6。</desc><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285443"/></marker></defs><rect width="1000" height="780" fill="#f3f7f4"/><g font-family="system-ui,PingFang SC,sans-serif"><text x="30" y="44" font-size="28" fill="#173c2e">0/1背包：一维压缩必须保持“上一行”的含义</text><rect x="40" y="110" width="920" height="110" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="141" font-size="20" fill="#173c2e">二维：dp[i][c]只读取dp[i-1][c]或dp[i-1][c-weight]</text><text x="56" y="170" font-size="20" fill="#173c2e">前i件、容量不超过c的最大值；不是必须装满c</text><rect x="40" y="290" width="440" height="190" rx="12" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="56" y="321" font-size="20" fill="#173c2e">一维降序 c=4→3→2</text><text x="56" y="350" font-size="20" fill="#173c2e">先算容量4，容量2仍是旧0</text><text x="56" y="379" font-size="20" fill="#173c2e">best[4]=3</text><text x="56" y="408" font-size="20" fill="#173c2e">再算best[2]=3</text><text x="56" y="437" font-size="20" fill="#173c2e">结果3，同一件没有复用</text><rect x="520" y="290" width="440" height="190" rx="12" fill="#fff4dc" stroke="#6d987f" stroke-width="2"/><text x="536" y="321" font-size="20" fill="#173c2e">错误升序 c=2→3→4</text><text x="536" y="350" font-size="20" fill="#173c2e">容量2先变成本轮3</text><text x="536" y="379" font-size="20" fill="#173c2e">再算容量4读取已更新的3</text><text x="536" y="408" font-size="20" fill="#173c2e">best[4]=3+3=6</text><text x="536" y="437" font-size="20" fill="#173c2e">相当于把同一件选了两次</text><rect x="40" y="550" width="920" height="110" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="581" font-size="20" fill="#173c2e">压缩空间要重新说明依赖顺序，不是删一维数组就完成</text><text x="56" y="610" font-size="20" fill="#173c2e">二维表保留选中ID恢复能力；本文一维版本只返回最优值</text><text x="40" y="725" font-size="18" fill="#173c2e">O(nC)依赖容量数值C，称伪多项式；二进制输入长度只有约log₂C。</text></g></svg>
