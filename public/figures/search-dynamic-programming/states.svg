<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc"><title id="title">从选择历史压缩成未来状态：还剩哪几件、多少容量</title><desc id="desc">同一个后缀和剩余容量具有相同未来最大增量价值；过去累计价值不放缓存返回值里。</desc><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285443"/></marker></defs><rect width="1000" height="780" fill="#f3f7f4"/><g font-family="system-ui,PingFang SC,sans-serif"><text x="30" y="44" font-size="28" fill="#173c2e">从选择历史压缩成未来状态：还剩哪几件、多少容量</text><rect x="40" y="110" width="440" height="130" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="141" font-size="20" fill="#173c2e">历史一：已选A，来到第i件</text><text x="56" y="170" font-size="20" fill="#173c2e">剩余容量c</text><text x="56" y="199" font-size="20" fill="#173c2e">累计价值可能是7</text><rect x="520" y="110" width="440" height="130" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="536" y="141" font-size="20" fill="#173c2e">历史二：已选别的组合</text><text x="536" y="170" font-size="20" fill="#173c2e">同样来到第i件、容量c</text><text x="536" y="199" font-size="20" fill="#173c2e">累计价值可能是10</text><path d="M260 245L430 310" stroke="#285443" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M740 245L570 310" stroke="#285443" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="200" y="315" width="600" height="140" rx="12" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="216" y="346" font-size="20" fill="#173c2e">状态 f(i,c)：只看第i件及后面的物品</text><text x="216" y="375" font-size="20" fill="#173c2e">求从这里还能增加的最大价值</text><text x="216" y="404" font-size="20" fill="#173c2e">不是“从开头到现在的总价值”</text><path d="M500 460L500 505" stroke="#285443" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="40" y="510" width="920" height="145" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="541" font-size="20" fill="#173c2e">不选：f(i+1,c)</text><text x="56" y="570" font-size="20" fill="#173c2e">可选时选择：value[i]+f(i+1,c-weight[i])</text><text x="56" y="599" font-size="20" fill="#173c2e">取二者最大；i=n时返回0；i不断增加保证依赖无环</text><text x="40" y="720" font-size="18" fill="#173c2e">如果还有“已选颜色/相邻限制”等条件，(i,c)不再足够，不能沿用缓存键。</text></g></svg>
