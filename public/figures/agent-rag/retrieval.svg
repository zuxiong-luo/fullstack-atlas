<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="t d"><title id="t">关键词检索与引用验证</title><desc id="d">问题及owner进入候选过滤，再按NFKC小写包含关键词数量评分，top3非零证据交给provider；无命中直接返回，模型结果需要JSON结构和引用ID校验。</desc><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#315a47"/></marker></defs><rect width="1100" height="520" rx="18" fill="#f4f8f5"/><g font-family="system-ui,sans-serif" fill="#213b30"><text x="30" y="43" font-size="25" font-weight="bold">先找可见证据，再验证模型引用</text><g fill="#fff" stroke="#315a47" stroke-width="2"><rect x="30" y="95" width="230" height="130" rx="10"/><rect x="325" y="95" width="330" height="130" rx="10"/><rect x="720" y="95" width="350" height="130" rx="10"/><rect x="325" y="315" width="330" height="135" rx="10"/><rect x="720" y="315" width="350" height="135" rx="10"/></g><g font-size="22"><text x="47" y="136">question + owner</text><text x="47" y="178">身份来自服务端</text><text x="343" y="135">只保留 public / owner</text><text x="343" y="177">NFKC+lower → 关键词计数</text><text x="740" y="134">分数降序 / ID升序</text><text x="740" y="176">top3 且 score &gt; 0</text><text x="343" y="353">provider(question,evidence)</text><text x="343" y="395">默认mock，0或1次调用</text><text x="740" y="353">JSON → schema → 引用集合</text><text x="740" y="395">未知ID拒绝，不自带事实保证</text></g><g fill="none" stroke="#315a47" stroke-width="2" marker-end="url(#a)"><path d="M260 160H320"/><path d="M655 160H715"/><path d="M895 225V270H490V310"/><path d="M655 380H715"/></g><text x="30" y="485" font-size="18">无命中：固定说明资料不足，citations=[]，model_calls=0。不是随机向量，也不把score当正确率。</text></g></svg>