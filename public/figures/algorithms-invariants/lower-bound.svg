<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-labelledby="t d"><title id="t">lower_bound区间收缩</title><desc id="d">数组1,2,2,4，目标2，区间从[0,4)比较mid2，变[0,2)比较mid1，再变[0,1)比较mid0，最后[1,1)答案1。lo左边均小于目标，hi及右边均大于等于目标。</desc><rect width="1100" height="530" rx="18" fill="#f4f8f5"/><g font-family="system-ui,sans-serif" fill="#213b30"><text x="30" y="42" font-size="25" font-weight="bold">第一个 ≥ 2 的位置：为什么相等时仍要向左找</text><g font-size="21"><text x="30" y="90">[lo,hi)</text><text x="275" y="90">index 0：1</text><text x="440" y="90">index 1：2</text><text x="605" y="90">index 2：2</text><text x="770" y="90">index 3：4</text><text x="935" y="90">末尾 4</text></g><text x="30" y="143" font-size="22">[0,4)</text><rect x="265" y="115" width="145" height="50" fill="#dcece0" stroke="#8b9e92" stroke-width="1"/><text x="283" y="147" font-size="20">1</text><rect x="430" y="115" width="145" height="50" fill="#dcece0" stroke="#8b9e92" stroke-width="1"/><text x="448" y="147" font-size="20">2</text><rect x="595" y="115" width="145" height="50" fill="#dcece0" stroke="#b45b14" stroke-width="4"/><text x="613" y="147" font-size="20">2 · mid</text><rect x="760" y="115" width="145" height="50" fill="#dcece0" stroke="#8b9e92" stroke-width="1"/><text x="778" y="147" font-size="20">4</text><text x="30" y="181" font-size="17">2 ≥ 2 → hi=2</text><text x="30" y="218" font-size="22">[0,2)</text><rect x="265" y="190" width="145" height="50" fill="#dcece0" stroke="#8b9e92" stroke-width="1"/><text x="283" y="222" font-size="20">1</text><rect x="430" y="190" width="145" height="50" fill="#dcece0" stroke="#b45b14" stroke-width="4"/><text x="448" y="222" font-size="20">2 · mid</text><rect x="595" y="190" width="145" height="50" fill="#eee" stroke="#8b9e92" stroke-width="1"/><text x="613" y="222" font-size="20">2</text><rect x="760" y="190" width="145" height="50" fill="#eee" stroke="#8b9e92" stroke-width="1"/><text x="778" y="222" font-size="20">4</text><text x="30" y="256" font-size="17">2 ≥ 2 → hi=1</text><text x="30" y="293" font-size="22">[0,1)</text><rect x="265" y="265" width="145" height="50" fill="#dcece0" stroke="#b45b14" stroke-width="4"/><text x="283" y="297" font-size="20">1 · mid</text><rect x="430" y="265" width="145" height="50" fill="#eee" stroke="#8b9e92" stroke-width="1"/><text x="448" y="297" font-size="20">2</text><rect x="595" y="265" width="145" height="50" fill="#eee" stroke="#8b9e92" stroke-width="1"/><text x="613" y="297" font-size="20">2</text><rect x="760" y="265" width="145" height="50" fill="#eee" stroke="#8b9e92" stroke-width="1"/><text x="778" y="297" font-size="20">4</text><text x="30" y="331" font-size="17">1 &lt; 2 → lo=1</text><text x="30" y="368" font-size="22">[1,1)</text><rect x="265" y="340" width="145" height="50" fill="#eee" stroke="#8b9e92" stroke-width="1"/><text x="283" y="372" font-size="20">1</text><rect x="430" y="340" width="145" height="50" fill="#eee" stroke="#8b9e92" stroke-width="1"/><text x="448" y="372" font-size="20">2</text><rect x="595" y="340" width="145" height="50" fill="#eee" stroke="#8b9e92" stroke-width="1"/><text x="613" y="372" font-size="20">2</text><rect x="760" y="340" width="145" height="50" fill="#eee" stroke="#8b9e92" stroke-width="1"/><text x="778" y="372" font-size="20">4</text><text x="30" y="406" font-size="17">空区间，答案=1</text><text x="30" y="465" font-size="21">不变量：index &lt; lo → 值 &lt; target；index ≥ hi → 值 ≥ target</text><text x="30" y="505" font-size="18">绿色为仍待判断区间；橙边为当前mid；灰色已被排除。末尾index=n可作为答案但不是数组元素。</text></g></svg>