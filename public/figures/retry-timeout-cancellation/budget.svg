<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc"><title id="title">有界重试的预算与取消决策</title><desc id="desc">先检查重放是否安全和父取消，再由总剩余预算限制每次尝试。失败按分类决定是否重试，退避和Retry-After都计入总预算；成功或取消终止。已经提交但响应丢失需要业务幂等。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#355f50"/></marker></defs><rect width="1120" height="620" rx="20" fill="#f3f7f4"/><g font-family="system-ui,sans-serif" fill="#1b332b"><text x="34" y="44" font-size="24" font-weight="700">重试会消耗预算，也可能重复业务效果</text><text x="34" y="76" font-size="17">这是逻辑决策图，不表示实测耗时；请求、读取响应和退避都属于同一次总预算</text><rect x="35" y="124" width="300" height="105" rx="12" fill="white" stroke="#557e66"/><text x="55" y="158" font-size="20">入口：父取消？能重放？</text><text x="55" y="188" font-size="17">GET/HEAD 或明确的 POST 契约</text><text x="55" y="213" font-size="16">仅有 Idempotency-Key 头还不够</text><rect x="410" y="124" width="300" height="105" rx="12" fill="#dcebdc" stroke="#557e66"/><text x="430" y="158" font-size="20">尝试：有界发送 + 读响应</text><text x="430" y="188" font-size="17">min(单次上限, 总剩余)</text><text x="430" y="213" font-size="16">同一父信号，响应最多保留 4096 字节</text><rect x="785" y="124" width="300" height="105" rx="12" fill="white" stroke="#557e66"/><text x="805" y="158" font-size="20">按结果分类</text><text x="805" y="188" font-size="17">成功 / 永久错误 → 返回或终止</text><text x="805" y="213" font-size="16">暂时故障才进入下一轮判断</text><g stroke="#355f50" fill="none" stroke-width="2" marker-end="url(#a)"><path d="M335 176 H406"/><path d="M710 176 H781"/><path d="M935 229 V342 H780"/><path d="M340 394 H180 V265 H555 V233"/></g><rect x="347" y="345" width="426" height="110" rx="12" fill="#fff0d8" stroke="#9b763f"/><text x="367" y="378" font-size="20">检查次数、总预算，再可取消退避</text><text x="367" y="410" font-size="17">指数上限内抖动；尊重 Retry-After 下界</text><text x="367" y="438" font-size="16">等不起就终止，不缩短服务端等待要求硬重试</text><text x="35" y="525" font-size="18">父取消直接停止重试；传输取消不代表对方已回滚，已提交结果仍可能存在。</text><text x="35" y="558" font-size="18">本例 POST 的丢响应恢复依赖服务端回执：相同键 + 相同内容 → 返回原结果。</text><text x="35" y="596" font-size="15">计时器是合作式期限，不是抢占式硬实时；生产仍需配合上游取消、容量限制与结果查询。</text></g></svg>
