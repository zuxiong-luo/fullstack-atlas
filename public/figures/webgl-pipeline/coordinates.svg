<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="t d"><title id="t">WebGL三角形从局部坐标到绘图缓冲</title><desc id="d">三个顶点局部坐标经过mat3 P T R S进入裁剪坐标，w为1所以归一化坐标相同，viewport映射到绘图缓冲像素。显示列向量右侧先执行，缓冲每顶点5个float，position两个和color三个。</desc><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#315a47"/></marker></defs><rect width="1100" height="680" rx="18" fill="#f4f8f5"/><g font-family="system-ui,sans-serif" fill="#213b30"><text x="30" y="43" font-size="25" font-weight="bold">坐标与数据：从局部顶点到绘图缓冲像素</text><g font-size="22"><text x="40" y="90">局部坐标（模型单位）</text><text x="410" y="90">裁剪 / NDC（无单位）</text><text x="790" y="90">viewport（缓冲像素）</text></g><g fill="#fff" stroke="#91ab9e"><rect x="30" y="110" width="290" height="245"/><rect x="400" y="110" width="290" height="245"/><rect x="770" y="110" width="300" height="245"/></g><g stroke="#91ab9e" stroke-dasharray="4 4"><path d="M175 125V340M45 245H305"/><path d="M545 125V340M415 245H675"/></g><path d="M88 290L262 290L175 148Z" fill="#dcece0" stroke="#315a47" stroke-width="2"/><path d="M500 281L590 281L545 193Z" fill="#dcece0" stroke="#315a47" stroke-width="2"/><path d="M870 285L970 285L920 178Z" fill="#dcece0" stroke="#315a47" stroke-width="2"/><g font-size="17"><text x="36" y="377">(-0.6,-0.45)、(0.6,-0.45)、(0,0.65)</text><text x="410" y="377">gl_Position=(x,y,0,1)，w=1</text><text x="778" y="377">x映射到[0,W]，y映射到[0,H]</text><text x="405" y="402">P按宽高比修正x，图为示意</text></g><g stroke="#315a47" stroke-width="2" marker-end="url(#a)"><path d="M325 225H395"/><path d="M695 225H765"/></g><text x="336" y="205" font-size="17">矩阵</text><text x="702" y="205" font-size="17">视口</text><g font-size="22"><text x="30" y="456">p_clip = P · T · R · S · p_local；列向量，右侧先作用</text><text x="30" y="503">buffer：x,y,r,g,b | x,y,r,g,b | x,y,r,g,b</text><text x="30" y="549">stride = 5 × 4 = 20 字节；position offset=0；color offset=8</text><text x="30" y="596">vertex shader → 光栅化 / 插值 → fragment shader → 绘图缓冲</text></g><text x="30" y="644" font-size="18">CSS尺寸与缓冲像素不是同一个单位；DPR放大后同步更新viewport。此处不实现透视相机或深度场景。</text></g></svg>