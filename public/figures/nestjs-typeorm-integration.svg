<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315c4e"/></marker></defs><rect width="1100" height="650" rx="18" fill="#f4f8f6"/><g font-family="Arial,sans-serif" fill="#223d33"><text x="35" y="45" font-size="25">应用连接池与事务 manager 的归属</text><rect x="350" y="80" width="400" height="80" rx="12" fill="#e6efeb" stroke="#3f7360"/><text x="550.0" y="110" font-size="18" text-anchor="middle">Nest 容器拥有 DataSource</text><text x="550.0" y="135" font-size="18" text-anchor="middle">应用级连接池</text><rect x="50" y="240" width="380" height="90" rx="12" fill="#e6efeb" stroke="#3f7360"/><text x="240.0" y="270" font-size="18" text-anchor="middle">注入的普通 Repository</text><text x="240.0" y="295" font-size="18" text-anchor="middle">应用 manager / 独立查询</text><rect x="610" y="240" width="420" height="90" rx="12" fill="#e6efeb" stroke="#3f7360"/><text x="820.0" y="270" font-size="18" text-anchor="middle">transaction 回调 manager</text><text x="820.0" y="295" font-size="18" text-anchor="middle">事务专属连接 / 同一次提交</text><rect x="580" y="430" width="210" height="75" rx="12" fill="#e6efeb" stroke="#3f7360"/><text x="685.0" y="460" font-size="18" text-anchor="middle">Note 写入</text><rect x="840" y="430" width="210" height="75" rx="12" fill="#e6efeb" stroke="#3f7360"/><text x="945.0" y="460" font-size="18" text-anchor="middle">Audit 写入</text><path d="M400 160L250 240" stroke="#315c4e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="170" y="207" font-size="16">普通读入口</text><path d="M700 160L820 240" stroke="#315c4e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="790" y="207" font-size="16">服务发起事务</text><path d="M720 330L685 430" stroke="#315c4e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="570" y="385" font-size="16">同一 manager</text><path d="M900 330L945 430" stroke="#315c4e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="910" y="385" font-size="16">同一 manager</text><text x="35" y="575" font-size="17">事务内不要调用应用级 Repository；即便连接同一台 PG，也可能不在同一事务。</text><text x="35" y="602" font-size="17">两类写入都成功才 COMMIT，审计约束失败则两类写入共同 ROLLBACK。</text></g></svg>