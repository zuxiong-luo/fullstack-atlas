<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title desc"><title id="title">离线同步的两份事务与可重放身份</title><desc id="desc">离线同步的两份事务与可重放身份</desc><defs><marker id="arrow" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315c48"/></marker></defs><style>text{font-family:Arial,'PingFang SC',sans-serif;font-size:19px;fill:#244a38}.heading{font-size:27px;font-weight:bold}.small{font-size:16px}.box{fill:white;stroke:#729984;stroke-width:2}.warn{fill:#fff4df;stroke:#b18a4a;stroke-width:2}.arrow{stroke:#315c48;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="1040" height="580" rx="20" fill="#f2f7f3"/>
<text x="35" y="48" class="heading">本地保存 ≠ 远端确认；op_id 连接可重放的意图</text>
<rect x="40" y="100" width="420" height="120" rx="12" class="box"/><text x="65" y="135">本地 SQLite：同一事务</text><text x="65" y="171">notes：当前可见正文 + edit_revision</text><text x="65" y="203">pending：op_id + base_version + body</text>
<rect x="620" y="100" width="380" height="120" rx="12" class="box"/><text x="645" y="135">远端 SQLite：同一事务</text><text x="645" y="171">条件更新 version + 正文</text><text x="645" y="203">保存 op_id → 输入与成功回执</text>
<path d="M460 140H615" class="arrow"/><text x="477" y="120" class="small">真实 HTTP</text>
<path d="M620 201H465" class="arrow"/><text x="474" y="188" class="small">ACK 可能丢失</text>
<rect x="40" y="300" width="290" height="125" rx="12" class="warn"/><text x="60" y="336">响应丢失</text><text x="60" y="369" class="small">保留 pending，原 op_id 重放</text><text x="60" y="401" class="small">回执命中，不再增加版本</text>
<rect x="375" y="300" width="290" height="125" rx="12" class="box"/><text x="395" y="336">ACK 晚到，新稿已存在</text><text x="395" y="369" class="small">不覆盖当前正文</text><text x="395" y="401" class="small">新稿新 op_id + 已确认基线</text>
<rect x="710" y="300" width="290" height="125" rx="12" class="warn"/><text x="730" y="336">expected_version 冲突</text><text x="730" y="369" class="small">同时保留本地和远端副本</text><text x="730" y="401" class="small">用户选择采用或重新提交</text>
<text x="45" y="485">单账号文件、单在途同步；本例只有已存在的笔记 n1。</text>
<text x="45" y="524" class="small">实际 SQLite/HTTP 协议核心，不等同移动插件、后台任务或真机已验。</text>
</svg>