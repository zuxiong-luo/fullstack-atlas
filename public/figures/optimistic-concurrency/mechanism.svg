<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img"><title>乐观并发：检测旧依据，识别同一意图</title><desc>应用先读后尝试，不等于数据库没有锁；效果条件与回执都必须进入原子边界。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285443"/></marker></defs><rect width="1200" height="860" rx="24" fill="#f3f7f4"/><text x="32" y="45" font-family="system-ui,sans-serif" font-size="28" fill="#173c2e" font-weight="700">乐观并发：检测旧依据，识别同一意图</text><text x="32" y="85" font-family="system-ui,sans-serif" font-size="18" fill="#173c2e">应用先读后尝试，不等于数据库没有锁；效果条件与回执都必须进入原子边界。</text><text x="35" y="135" font-family="system-ui,sans-serif" font-size="23" fill="#173c2e" font-weight="700">版本CAS：都读v1，实际UPDATE必须匹配v1</text><rect x="40" y="165" width="300" height="115" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="54" y="194" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">A读取v1</text><text x="54" y="223" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">编辑为A内容</text><text x="54" y="252" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">expectedVersion=1</text><rect x="450" y="165" width="300" height="115" rx="12" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="464" y="194" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">A先更新匹配1行</text><text x="464" y="223" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">body=A，version=2</text><text x="464" y="252" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">B旧条件随后匹配0行</text><rect x="860" y="165" width="300" height="115" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="874" y="194" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">B读取v1</text><text x="874" y="223" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">编辑为B内容</text><text x="874" y="252" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">返回冲突，不能覆盖</text><path d="M340 222H447" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#a)"/><path d="M860 222H753" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#a)"/><text x="35" y="345" font-family="system-ui,sans-serif" font-size="23" fill="#173c2e" font-weight="700">相同意图：唯一键仲裁 + 库存与回执同一事务</text><rect x="40" y="385" width="270" height="145" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="54" y="414" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">INSERT回执占位</text><text x="54" y="443" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">UNIQUE(tenant,key)</text><text x="54" y="472" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">相同键竞争者等待</text><rect x="345" y="385" width="270" height="145" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="359" y="414" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">条件扣库存</text><text x="359" y="443" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">stock≥quantity</text><text x="359" y="472" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">不成功就回滚占位</text><rect x="650" y="385" width="270" height="145" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="664" y="414" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">保存结果并COMMIT</text><text x="664" y="443" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">库存与回执一起提交</text><text x="664" y="472" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">响应丢失不撤销提交</text><path d="M310 455H342" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#a)"/><path d="M615 455H647" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#a)"/><rect x="60" y="630" width="1080" height="125" rx="12" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="74" y="659" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">提交前失败：ROLLBACK库存和回执；提交后丢响应：同键查询回执，不重复扣减。</text><text x="74" y="688" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">相同键不同payload → IDEMPOTENCY_CONFLICT；不同键争最后1件 → 只有一方扣成功。</text><text x="74" y="717" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">版本冲突、重放同意图、不同意图争资源分别处理，不套同一个无条件retry。</text><text x="35" y="825" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">本地COMMIT标记不是网络结果判定器；外部支付/邮件不在这个SQL事务中。</text></svg>
