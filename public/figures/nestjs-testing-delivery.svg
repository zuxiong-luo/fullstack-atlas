<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315c4e"/></marker></defs><rect width="1100" height="650" rx="18" fill="#f4f8f6"/><g font-family="Arial,sans-serif" fill="#223d33"><text x="35" y="45" font-size="25">SIGTERM：收敛请求后再释放资源</text><rect x="35" y="90" width="270" height="100" rx="12" fill="#e6efeb" stroke="#3f7360"/><text x="170.0" y="120" font-size="18" text-anchor="middle">SIGTERM</text><text x="170.0" y="145" font-size="18" text-anchor="middle">draining=true / 停止接收</text><rect x="390" y="80" width="300" height="100" rx="12" fill="#e6efeb" stroke="#3f7360"/><text x="540.0" y="110" font-size="18" text-anchor="middle">短请求80ms</text><text x="540.0" y="135" font-size="18" text-anchor="middle">预算内提交 / HTTP200</text><rect x="390" y="270" width="300" height="100" rx="12" fill="#e6efeb" stroke="#3f7360"/><text x="540.0" y="300" font-size="18" text-anchor="middle">长等待1200ms</text><text x="540.0" y="325" font-size="18" text-anchor="middle">150ms协作取消 / HTTP503</text><rect x="800" y="170" width="260" height="100" rx="12" fill="#e6efeb" stroke="#3f7360"/><text x="930.0" y="200" font-size="18" text-anchor="middle">HTTP连接收敛</text><text x="930.0" y="225" font-size="18" text-anchor="middle">关闭 DataSource / exit0</text><rect x="770" y="400" width="300" height="100" rx="12" fill="#e6efeb" stroke="#3f7360"/><text x="920.0" y="430" font-size="18" text-anchor="middle">非协作 SQL 仍阻塞</text><text x="920.0" y="455" font-size="18" text-anchor="middle">额外1000ms硬退出 / exit1</text><path d="M305 120L390 120" stroke="#315c4e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="315" y="95" font-size="16">已有短请求</text><path d="M305 165L390 300" stroke="#315c4e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="300" y="240" font-size="16">已有长请求</text><path d="M690 130L800 190" stroke="#315c4e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="720" y="130" font-size="16">完成</text><path d="M690 315L800 245" stroke="#315c4e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="705" y="305" font-size="16">取消已响应</text><path d="M690 350L770 440" stroke="#315c4e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="710" y="385" font-size="16">取消不被驱动处理</text><text x="35" y="575" font-size="17">正常路径只关闭闲置HTTP连接，不提前销毁处理器仍需要的数据库连接池。</text><text x="35" y="602" font-size="17">硬退出是失败兜底，会跳过优雅清理；不能撤销已经提交或外部已发生的副作用。</text></g></svg>