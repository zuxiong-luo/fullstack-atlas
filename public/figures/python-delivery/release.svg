<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">笔记服务从源码快照到干净环境安装与观察</title><desc id="desc">第4、7、8章生成完整独立src包，固定构建生成sdist与wheel，新venv离线安装后在无源码cwd真实启动并验证HTTP重启。请求日志、HTTP计时和存储profile有不同观测范围。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#32644d"/></marker></defs><rect width="960" height="560" fill="#f7faf6"/><g font-family="system-ui,sans-serif" fill="#23473b"><text x="28" y="42" font-size="27">可安装产物要离开源码目录证明自己</text><g fill="#edf5ed" stroke="#668c78"><rect x="28" y="80" width="270" height="110" rx="12"/><rect x="345" y="80" width="270" height="110" rx="12"/><rect x="662" y="80" width="270" height="110" rx="12"/><rect x="28" y="285" width="270" height="130" rx="12"/><rect x="345" y="285" width="270" height="130" rx="12"/><rect x="662" y="285" width="270" height="130" rx="12"/></g><g font-size="18"><text x="43" y="112">逐章实现 → 独立src快照</text><text x="43" y="142">--check拒绝生成物漂移</text><text x="43" y="172">不import课程chapterXX</text><text x="360" y="112">固定构建工具 / 元数据</text><text x="360" y="142">sdist → wheel</text><text x="360" y="172">锁文件 ≠ 跨平台轮子缓存</text><text x="677" y="112">干净venv / --no-index</text><text x="677" y="142">无PYTHONPATH / 新cwd</text><text x="677" y="172">真实HTTP + 停止/重启</text><text x="43" y="317">请求日志：服务内观察</text><text x="43" y="349">自产ID / 模板 / 状态</text><text x="43" y="381">不记token、标题和query</text><text x="360" y="317">HTTP计时：客户端范围</text><text x="360" y="349">串行32次 / 预热5次排除</text><text x="360" y="381">含收发与JSON，不是容量</text><text x="677" y="317">存储profile：独立负载</text><text x="677" y="349">128条×2标签，20次读取</text><text x="677" y="381">Python分配 ≠ 全进程RSS</text></g><g stroke="#32644d" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M302 135H339"/><path d="M619 135H655"/><path d="M795 195V235H480V278"/><path d="M480 235H163V278"/><path d="M795 235V278"/></g><text x="30" y="465" font-size="20">同一交付链上的不同证据，不能把数字跨负载相减成“优化收益”。</text><text x="30" y="508" font-size="18">机制示意，无性能曲线；本机样本与尚未验证的生产条件分别记录。</text></g></svg>
