<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">源码、环境和数据，是三样东西</title><desc id="desc">先知道解释器在哪、库装在哪、数据存在哪，再排查“昨天还能跑”。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#356d53"/></marker></defs><rect width="1000" height="600" rx="22" fill="#f5f8f6"/><g font-family="Arial, 'PingFang SC', sans-serif"><text x="40" y="52" font-size="30" fill="#20392f" font-weight="700">源码、环境和数据，是三样东西</text><text x="40" y="88" font-size="21" fill="#4e675b" font-weight="400">先知道解释器在哪、库装在哪、数据存在哪，再排查“昨天还能跑”。</text><rect x="40" y="130" width="400" height="145" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="62" y="168" font-size="25" fill="#20392f" font-weight="650">源码目录</text><text x="62" y="207" font-size="22" fill="#20392f" font-weight="400">learning_notes/*.py</text><text x="62" y="238" font-size="22" fill="#20392f" font-weight="400">pyproject.toml 描述安装方式</text><rect x="560" y="130" width="400" height="145" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="582" y="168" font-size="25" fill="#20392f" font-weight="650">独立 .venv 环境</text><text x="582" y="207" font-size="22" fill="#20392f" font-weight="400">安装依赖与 learning_notes</text><text x="582" y="238" font-size="22" fill="#20392f" font-weight="400">生成 learning-notes 命令</text><path d="M440 200 L550 200" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><rect x="560" y="360" width="400" height="130" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="582" y="398" font-size="25" fill="#20392f" font-weight="650">自己的数据库文件</text><text x="582" y="437" font-size="22" fill="#20392f" font-weight="400">--db 或 NOTES_DB 选择路径</text><text x="582" y="468" font-size="22" fill="#20392f" font-weight="400">安装不会自动移动这份数据</text><path d="M760 275 L760 350" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="360" width="400" height="130" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="62" y="398" font-size="25" fill="#20392f" font-weight="650">从其他目录运行</text><text x="62" y="437" font-size="22" fill="#20392f" font-weight="400">激活环境后调用命令</text><text x="62" y="468" font-size="22" fill="#20392f" font-weight="400">显式给出数据文件位置</text><path d="M440 420 L550 420" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="565" font-size="21" fill="#4e675b" font-weight="400">普通安装后改源码，需要重新安装；不要提交 .venv 或练习数据库。</text></g></svg>