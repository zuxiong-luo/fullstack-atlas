<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img"><title>缓存一致性：发布资格与可靠失效缺一不可</title><desc>数据库是事实来源；缓存副本要能失效，也要阻止失效后的旧内容重新发布。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285443"/></marker></defs><rect width="1200" height="860" rx="24" fill="#f3f7f4"/><text x="32" y="45" font-family="system-ui,sans-serif" font-size="28" fill="#173c2e" font-weight="700">缓存一致性：发布资格与可靠失效缺一不可</text><text x="32" y="85" font-family="system-ui,sans-serif" font-size="18" fill="#173c2e">数据库是事实来源；缓存副本要能失效，也要阻止失效后的旧内容重新发布。</text><text x="35" y="135" font-family="system-ui,sans-serif" font-size="23" fill="#173c2e" font-weight="700">代际校验阻止旧读者在失效后回填</text><rect x="35" y="165" width="230" height="145" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="49" y="194" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">读者R取得g1</text><text x="49" y="223" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">查数据库v1</text><text x="49" y="252" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">在回填前停住</text><rect x="335" y="165" width="230" height="145" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="349" y="194" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">写者W提交v2</text><text x="349" y="223" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">同事务写pending事件</text><text x="349" y="252" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">提交后应用失效</text><rect x="635" y="165" width="230" height="145" rx="12" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="649" y="194" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">Redis切换到g2</text><text x="649" y="223" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">原子删除旧value</text><text x="649" y="252" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">旧g1发布被拒绝</text><rect x="935" y="165" width="230" height="145" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="949" y="194" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">R有限重试</text><text x="949" y="223" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">重新查库v2</text><text x="949" y="252" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">不无限追赶写入</text><path d="M265 235H332" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#a)"/><path d="M565 235H632" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#a)"/><path d="M865 235H932" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#a)"/><rect x="45" y="390" width="1105" height="95" rx="12" fill="#f7e8d5" stroke="#6d987f" stroke-width="2"/><text x="59" y="419" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">仍有旧读窗口：数据库提交v2 → 失效实际应用之前，旧缓存可能命中。</text><text x="59" y="448" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">代际保证发布资格，不是跨数据库/Redis事务，也不是所有读线性一致。</text><rect x="45" y="575" width="330" height="145" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="59" y="604" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">Redis真正停机</text><text x="59" y="633" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">DB值v2 + pending仍提交</text><text x="59" y="662" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">读取转库，stored=false</text><text x="59" y="691" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">中继失败不标applied</text><rect x="455" y="575" width="330" height="145" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="469" y="604" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">Redis恢复后</text><text x="469" y="633" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">重放pending失效</text><text x="469" y="662" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">成功后才标applied</text><text x="469" y="691" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">重复失效换新随机代际</text><rect x="865" y="575" width="290" height="145" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="879" y="604" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">整键丢失也换新代际</text><text x="879" y="633" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">不清零重用g0</text><text x="879" y="662" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">旧发布不能复活</text><text x="879" y="691" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">TTL不是严格陈旧上界</text><path d="M375 645H452" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#a)"/><text x="35" y="825" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">固定屏障控制先后，真实私有Redis56382与PG17；未验证集群切换或生产故障容量。</text></svg>
