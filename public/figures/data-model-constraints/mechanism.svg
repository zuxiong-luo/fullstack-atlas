<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img"><title>数据约束：同租户关系与历史事实分开表达</title><desc>用键与外键守住身份、唯一性和归属，行内检查与跨行规则分别设计。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285443"/></marker></defs><rect width="1200" height="860" rx="24" fill="#f3f7f4"/><text x="32" y="45" font-family="system-ui,sans-serif" font-size="28" fill="#173c2e" font-weight="700">数据约束：同租户关系与历史事实分开表达</text><text x="32" y="85" font-family="system-ui,sans-serif" font-size="18" fill="#173c2e">用键与外键守住身份、唯一性和归属，行内检查与跨行规则分别设计。</text><rect x="40" y="150" width="300" height="150" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="54" y="179" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">members</text><text x="54" y="208" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">PK(tenant,user)</text><text x="54" y="237" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">red / alice</text><text x="54" y="266" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">blue / bob</text><rect x="455" y="150" width="300" height="150" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="469" y="179" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">orders</text><text x="469" y="208" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">PK(tenant,id)</text><text x="469" y="237" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">FK(tenant,owner)</text><text x="469" y="266" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">red / o1 → red / alice</text><rect x="875" y="150" width="290" height="150" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="889" y="179" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">products</text><text x="889" y="208" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">PK(tenant,id)</text><text x="889" y="237" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">UNIQUE(tenant,sku)</text><text x="889" y="266" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">red/p1 price=1500</text><path d="M455 220H343" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#a)"/><text x="360" y="200" font-family="system-ui,sans-serif" font-size="16" fill="#173c2e">拥有者归属</text><rect x="365" y="425" width="470" height="165" rx="12" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="379" y="454" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">order_items</text><text x="379" y="483" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">PK(tenant,order,product)</text><text x="379" y="512" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">FK(tenant,order) + FK(tenant,product)</text><text x="379" y="541" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">red / o1 / p1</text><text x="379" y="570" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">quantity=2，历史unit_price=1000</text><path d="M500 425V303" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#a)"/><text x="515" y="365" font-family="system-ui,sans-serif" font-size="17" fill="#173c2e">可显式延迟的订单外键</text><path d="M835 480H1020V303" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#a)"/><text x="865" y="380" font-family="system-ui,sans-serif" font-size="17" fill="#173c2e">商品复合外键</text><rect x="40" y="665" width="1125" height="120" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="54" y="694" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">行内：quantity&gt;0、price≥0；NOT NULL另行保证必填。</text><text x="54" y="723" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">历史总额：2×1000=2000，商品现价1500不重写成交事实。</text><text x="54" y="752" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">集合值CHECK不代表状态迁移合法；跨行总额需要查询或明确事务协议。</text><text x="35" y="828" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">箭头由引用方指向被引用身份；外键保证关系，不替HTTP调用者做对象授权。</text></svg>
