<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" role="img" aria-labelledby="title desc"><title id="title">三类数据：保存用途决定读取路径</title><desc id="desc">各框分别表示身份与数据路径，框之间没有自动调用箭头。问答不读取记忆，删除只作用于 memory 当前行。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#42665b"/></marker></defs><rect width="1000" height="790" rx="20" fill="#f1f6f3"/><g font-family="Arial, sans-serif" fill="#173c31"><text x="48" y="56" font-size="28" font-weight="bold">三类数据：保存用途决定读取路径</text><rect x="48" y="90" width="904" height="100" rx="12" fill="white" stroke="#6e9788" stroke-width="2"/><text x="72" y="126" font-size="24" font-weight="bold">教学身份认证 → owner</text><text x="72" y="163" font-size="21">demo-alice → alice；客户端不能通过 body.owner 切换身份</text><rect x="48" y="220" width="904" height="100" rx="12" fill="white" stroke="#6e9788" stroke-width="2"/><text x="72" y="256" font-size="24" font-weight="bold">显式记忆：POST / GET / DELETE memory</text><text x="72" y="293" font-size="21">SQLite 主键 (owner,id)；只管理当前 owner 的 text</text><rect x="48" y="350" width="904" height="100" rx="12" fill="white" stroke="#6e9788" stroke-width="2"/><text x="72" y="386" font-size="24" font-weight="bold">问答：question → 授权检索 → evidence → provider</text><text x="72" y="423" font-size="21">实际路径不读取 memory；存入偏好不会自动改变问答</text><rect x="48" y="480" width="904" height="100" rx="12" fill="white" stroke="#6e9788" stroke-width="2"/><text x="72" y="516" font-size="24" font-weight="bold">任务恢复：runs.evidence → provider</text><text x="72" y="553" font-size="21">复用已保存快照；删除 memory 不级联改写 runs</text><rect x="48" y="610" width="904" height="100" rx="12" fill="white" stroke="#6e9788" stroke-width="2"/><text x="72" y="646" font-size="24" font-weight="bold">删除边界：只删当前 memory 逻辑行</text><text x="72" y="683" font-size="21">不清理其他用户、旧任务、WAL、备份或远端副本</text></g></svg>