<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img"><title>授权逐层收紧：身份、租户、角色与资源归属</title><desc>测试用真实PostgreSQL17受限LOGIN角色；不以界面隐藏或难猜ID作为保护。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285443"/></marker></defs><rect width="1200" height="850" rx="24" fill="#f3f7f4"/><text x="32" y="45" font-family="system-ui,sans-serif" font-size="28" fill="#173c2e" font-weight="700">授权逐层收紧：身份、租户、角色与资源归属</text><text x="32" y="85" font-family="system-ui,sans-serif" font-size="18" fill="#173c2e">测试用真实PostgreSQL17受限LOGIN角色；不以界面隐藏或难猜ID作为保护。</text><text x="35" y="137" font-family="system-ui,sans-serif" font-size="22" fill="#173c2e" font-weight="700">一次受保护请求：来自可信边界的事实才可以进入决策</text><rect x="35" y="170" width="260" height="120" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="49" y="199" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">会话映射主体</text><text x="49" y="227" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">user=sue</text><text x="49" y="255" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">客户端role不可信</text><rect x="340" y="170" width="260" height="120" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="354" y="199" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">查当前成员资格</text><text x="354" y="227" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">tenant=red</text><text x="354" y="255" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">role=admin</text><rect x="645" y="170" width="260" height="120" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="659" y="199" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">资源与动作关系</text><text x="659" y="227" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">tenant / owner</text><text x="659" y="255" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">UPDATE还含version</text><path d="M295 230H337" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#a)"/><path d="M600 230H642" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#a)"/><rect x="950" y="170" width="215" height="120" rx="12" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="964" y="199" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">数据库兜底</text><text x="964" y="227" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">非owner应用角色</text><text x="964" y="255" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">RLS + 列权限</text><path d="M905 230H947" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="370" width="530" height="190" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="54" y="399" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">red 租户</text><text x="54" y="427" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">sue admin：可读/改本租户文档</text><text x="54" y="455" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">alice editor：可改自己的a1</text><text x="54" y="483" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">bob viewer：只能读自己/共享</text><text x="54" y="511" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">a1私有；a2共享；e1为erin私有</text><rect x="625" y="370" width="530" height="190" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="639" y="399" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">blue 租户</text><text x="639" y="427" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">carol admin：可管理本租户b1</text><text x="639" y="455" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">sue无blue成员资格：403</text><text x="639" y="483" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">在red路径猜b1：404</text><text x="639" y="511" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">admin不是自动的全站管理员</text><rect x="40" y="630" width="1115" height="115" rx="12" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="54" y="659" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">同一连接：BEGIN → SET LOCAL user/tenant → 查询成员与资源 → COMMIT / ROLLBACK → release</text><text x="54" y="687" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">连接复用测试：red请求结束 → 事务外0行 → blue仅b1；不把上次租户配置留给下次请求。</text><text x="35" y="805" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">GUC由可信中间层设置，不抵御任意SQL执行；降权保证后续请求，不宣称撤销已在途事务。</text></svg>
