<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" role="img" aria-labelledby="title desc"><title id="title">隔离执行上下文，不等于没有通信成本</title><desc id="desc">同进程Worker与独立fork进程使用统一消息契约，但内存与所有权语义不同。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#356b58"/></marker></defs><rect width="940" height="520" fill="#f7faf7"/><g font-family="system-ui,sans-serif"><text x="28" y="42" fill="#23473b" font-size="26">隔离执行上下文，不等于没有通信成本</text><rect x="30" y="85" width="880" height="180" rx="10" fill="#e1eee4" stroke="#668c78"/><text x="45" y="114" fill="#23473b" font-size="18">进程 P：主线程 / Worker线程各有JS执行环境</text><rect x="55" y="140" width="285" height="90" rx="10" fill="#fff" stroke="#668c78"/><text x="70" y="169" fill="#23473b" font-size="18">主线程：准入 / 排队 / 结算</text><text x="70" y="197" fill="#23473b" font-size="18">不在这里执行长同步任务</text><rect x="600" y="140" width="285" height="90" rx="10" fill="#fff" stroke="#668c78"/><text x="615" y="169" fill="#23473b" font-size="18">Worker：同PID / 不同threadId</text><text x="615" y="197" fill="#23473b" font-size="18">transfer后原buffer失效</text><path d="M345 170H593" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="405" y="155" fill="#23473b" font-size="16">任务数据 →</text><path d="M595 205H348" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="405" y="245" fill="#23473b" font-size="16">← ID + 结果</text><rect x="30" y="330" width="310" height="100" rx="10" fill="#edf5ee" stroke="#668c78"/><text x="45" y="359" fill="#23473b" font-size="18">主进程 P</text><text x="45" y="387" fill="#23473b" font-size="18">同一池契约，换process端口</text><rect x="600" y="330" width="310" height="100" rx="10" fill="#edf5ee" stroke="#668c78"/><text x="615" y="359" fill="#23473b" font-size="18">子进程 Q：独立PID</text><text x="615" y="387" fill="#23473b" font-size="18">advanced IPC复制，不共享普通堆</text><path d="M345 360H593" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="400" y="343" fill="#23473b" font-size="16">任务序列化 →</text><path d="M595 405H348" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="400" y="457" fill="#23473b" font-size="16">← ID + 结果</text><text x="30" y="495" fill="#23473b" font-size="19">线程 / 进程都不是自动权限沙箱；只执行本仓库可信CPU模块。</text></g></svg>