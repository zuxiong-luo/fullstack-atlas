<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title"><title id="title">执行者与内存边界：工作池不等于 Worker</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315b4a"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f3f7f4"/><style>text{font-family:system-ui,'PingFang SC',sans-serif;fill:#173c2d}.title{font-size:26px;font-weight:650}.label{font-size:20px;font-weight:600}.note{font-size:17px}.edge{font-size:16px;fill:#476454}</style><text x="36" y="48" class="title">执行者与内存边界：工作池不等于 Worker</text><rect x="35" y="90" width="480" height="140" rx="12" fill="white" stroke="#7ca58f" stroke-width="2"/><text x="53" y="122" class="label">进程 A：主 JS isolate</text><text x="53" y="150" class="note">主线程 / JS 堆 / 事件循环</text><text x="53" y="178" class="note">PID A，threadId 0</text><rect x="585" y="90" width="480" height="140" rx="12" fill="white" stroke="#7ca58f" stroke-width="2"/><text x="603" y="122" class="label">进程 A：Worker isolate</text><text x="603" y="150" class="note">另一个 JS 线程 / 堆 / 循环</text><text x="603" y="178" class="note">PID A，threadId &gt; 0</text><rect x="300" y="320" width="500" height="110" rx="12" fill="white" stroke="#7ca58f" stroke-width="2"/><text x="318" y="352" class="label">进程 A：libuv 原生工作池（共享）</text><text x="318" y="380" class="note">文件 / PBKDF2 等原生任务</text><text x="318" y="408" class="note">应用不直接向它提交 JS 闭包</text><rect x="300" y="525" width="500" height="95" rx="12" fill="white" stroke="#7ca58f" stroke-width="2"/><text x="318" y="557" class="label">进程 B：独立 Node 程序</text><text x="318" y="585" class="note">PID B / 独立地址空间 / 经 IPC 通信</text><polyline points="515,155 583,155" fill="none" stroke="#315b4a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="520" y="130" class="edge">消息</text><polyline points="270,230 270,275 430,275 430,318" fill="none" stroke="#315b4a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="310" y="265" class="edge">原生任务</text><polyline points="830,230 830,275 670,275 670,318" fill="none" stroke="#315b4a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="700" y="265" class="edge">原生任务</text><polyline points="110,230 110,570 298,570" fill="none" stroke="#315b4a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="125" y="510" class="edge">fork / IPC</text></svg>