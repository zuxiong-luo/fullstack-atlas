<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" role="img" aria-labelledby="title desc"><title id="title">任务已拒绝与执行者已退出，是两个不同时间点</title><desc id="desc">排队任务可直接取消，运行任务终止后要等exit再补执行者，避免提前重用容量。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#356b58"/></marker></defs><rect width="940" height="520" fill="#f7faf7"/><g font-family="system-ui,sans-serif"><text x="28" y="42" fill="#23473b" font-size="26">任务已拒绝与执行者已退出，是两个不同时间点</text><rect x="30" y="90" width="250" height="120" rx="10" fill="#edf5ee" stroke="#668c78"/><text x="45" y="119" fill="#23473b" font-size="18">准入：size + queue有上限</text><text x="45" y="147" fill="#23473b" font-size="18">未接受：同步QUEUE_FULL</text><text x="45" y="175" fill="#23473b" font-size="18">已接受：result Promise</text><rect x="345" y="90" width="250" height="120" rx="10" fill="#edf5ee" stroke="#668c78"/><text x="360" y="119" fill="#23473b" font-size="18">queued → slot running</text><text x="360" y="147" fill="#23473b" font-size="18">任务ID对齐；结果单次结算</text><text x="360" y="175" fill="#23473b" font-size="18">完成后复用同一执行者</text><rect x="660" y="90" width="250" height="120" rx="10" fill="#edf5ee" stroke="#668c78"/><text x="675" y="119" fill="#23473b" font-size="18">排队取消</text><text x="675" y="147" fill="#23473b" font-size="18">从队列移除 / 清timer</text><text x="675" y="175" fill="#23473b" font-size="18">不发送给Worker</text><path d="M285 151H338" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="289" y="136" fill="#23473b" font-size="16">派发</text><rect x="30" y="315" width="250" height="120" rx="10" fill="#edf5ee" stroke="#668c78"/><text x="45" y="344" fill="#23473b" font-size="18">运行取消 / 期限 / 协议失败</text><text x="45" y="372" fill="#23473b" font-size="18">先拒绝调用方</text><text x="45" y="400" fill="#23473b" font-size="18">slot标为stopping</text><rect x="345" y="315" width="250" height="120" rx="10" fill="#edf5ee" stroke="#668c78"/><text x="360" y="344" fill="#23473b" font-size="18">terminate / SIGTERM</text><text x="360" y="372" fill="#23473b" font-size="18">有限等待，兜底SIGKILL</text><text x="360" y="400" fill="#23473b" font-size="18">必须观察真正exit</text><rect x="660" y="315" width="250" height="120" rx="10" fill="#edf5ee" stroke="#668c78"/><text x="675" y="344" fill="#23473b" font-size="18">exit后替换再派发</text><text x="675" y="372" fill="#23473b" font-size="18">有maxRestarts预算</text><text x="675" y="400" fill="#23473b" font-size="18">超限：关闭池 / 拒绝等待</text><path d="M470 216V265H155V307" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="185" y="254" fill="#23473b" font-size="16">不能立即重用旧slot</text><path d="M285 375H338" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="291" y="360" fill="#23473b" font-size="16">停止</text><path d="M600 375H653" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="605" y="360" fill="#23473b" font-size="16">退出</text><text x="30" y="493" fill="#23473b" font-size="18">close是中止关闭：停止准入、拒绝工作并等待资源退出；不是自动drain。</text></g></svg>