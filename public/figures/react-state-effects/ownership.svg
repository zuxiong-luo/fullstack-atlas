<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">请求归属与Effect清理</title><desc id="d">查询A启动请求R1，切换B使A失效并取消，R2完成后展示B，R1晚到被忽略。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#365c49"/></marker></defs><rect width="960" height="360" fill="#f2f7f3" rx="16"/><g font-family="system-ui,sans-serif" fill="#243e31"><text x="30" y="40" font-size="24" font-weight="700">R1 晚到，不再拥有写入资格</text><g font-size="18"><text x="30" y="98">查询 / Effect</text><text x="30" y="185">R1：A</text><text x="30" y="270">R2：B</text></g><g stroke="#365c49" stroke-width="2" marker-end="url(#a)"><path d="M180 90H910"/><path d="M230 110V162"/><path d="M450 110V245"/><path d="M650 270V110"/></g><g font-size="17"><text x="190" y="75">A setup</text><text x="370" y="75">A cleanup → B setup</text><text x="680" y="75">显示 B</text><text x="220" y="192">启动 R1</text><text x="400" y="220">active=false，abort()</text><text x="450" y="292">启动 R2 → 成功</text><text x="710" y="192">R1 仍成功 → 忽略</text></g><path d="M320 185H850" fill="none" stroke="#a2714b" stroke-width="2" stroke-dasharray="7 5"/><text x="30" y="333" font-size="15">示意时序，不表示真实网络耗时；取消资源与拒绝过期结果是两层职责。</text></g></svg>
