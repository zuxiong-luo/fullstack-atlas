<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc"><title id="title">Redis Streams投递、待确认与重领</title><desc id="desc">读取新消息后进入消费者组PEL，业务效果完成后才确认。进程在效果后确认前退出，消息需要重领，业务效果必须有同事务幂等回执。XACK不删除原流记录。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#355f50"/></marker></defs><rect width="1120" height="620" rx="20" fill="#f3f7f4"/><g font-family="system-ui,sans-serif" fill="#1b332b"><text x="34" y="44" font-size="24" font-weight="700">读到消息 ≠ 业务完成 ≠ 已确认</text><text x="34" y="76" font-size="17">一个消费者组内的逻辑状态；其他组有各自进度，XACK 不删除流记录</text><rect x="35" y="130" width="280" height="120" rx="12" fill="white" stroke="#557e66"/><text x="55" y="163" font-size="20">XADD：流中有一条记录</text><text x="55" y="195" font-size="17">传输 ID 是 Stream ID</text><text x="55" y="223" font-size="17">业务 ID 是 event=order-42</text><rect x="420" y="130" width="280" height="120" rx="12" fill="#dcebdc" stroke="#557e66"/><text x="440" y="163" font-size="20">XREADGROUP … &gt;</text><text x="440" y="195" font-size="17">交给 worker-a，进入 PEL</text><text x="440" y="223" font-size="17">后续 &gt; 不自动重读这条</text><rect x="805" y="130" width="280" height="120" rx="12" fill="white" stroke="#557e66"/><text x="825" y="163" font-size="20">业务结果 + 回执</text><text x="825" y="195" font-size="17">在同一个原子边界提交</text><text x="825" y="223" font-size="17">再 XACK 移出该组 PEL</text><g fill="none" stroke="#355f50" stroke-width="2" marker-end="url(#a)"><path d="M315 190 H416"/><path d="M700 190 H801"/><path d="M945 250 V345 H562 V390"/></g><text x="707" y="177" font-size="15">处理</text><text x="682" y="332" font-size="18">效果已完成但未 ACK，进程退出</text><rect x="343" y="397" width="440" height="110" rx="12" fill="#fff0d8" stroke="#9b763f"/><text x="365" y="430" font-size="20">XAUTOCLAIM：由 worker-b 重领</text><text x="365" y="462" font-size="17">回执存在且内容相同 → 跳过重复效果</text><text x="365" y="489" font-size="17">确认成功 → XACK；内容冲突 → 保留待排查</text><text x="34" y="559" font-size="18">本例回执与计数在 Redis 同一 Hash；外部邮件、支付或另一个数据库不在这个原子边界内。</text><text x="34" y="595" font-size="15">示意非耗时图。测试 min-idle-time=0 只因已确认原进程退出，生产不能用它随意抢活跃任务。</text></g></svg>
