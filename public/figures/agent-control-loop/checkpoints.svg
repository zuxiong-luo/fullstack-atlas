<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" role="img" aria-labelledby="title desc"><title id="title">任务记录：检查点与显式恢复</title><desc id="desc">按从上到下顺序阅读。每个状态框含转换条件及结果。此图为实现流程示意。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#42665b"/></marker></defs><rect width="1000" height="790" rx="20" fill="#f1f6f3"/><g font-family="Arial, sans-serif" fill="#173c31"><text x="48" y="56" font-size="28" font-weight="bold">任务记录：检查点与显式恢复</text><rect x="48" y="90" width="904" height="100" rx="12" fill="white" stroke="#6e9788" stroke-width="2"/><text x="72" y="126" font-size="24" font-weight="bold">queued / queued</text><text x="72" y="163" font-size="21">创建问题 → claim：epoch + 1，lease_until = now + lease</text><path d="M500,192 V215" stroke="#42665b" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="220" width="904" height="100" rx="12" fill="white" stroke="#6e9788" stroke-width="2"/><text x="72" y="256" font-size="24" font-weight="bold">retrieved / retrieved</text><text x="72" y="293" font-size="21">授权检索成功 → 保存 evidence JSON；模型失败仍停在此处</text><path d="M500,322 V345" stroke="#42665b" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="350" width="904" height="100" rx="12" fill="white" stroke="#6e9788" stroke-width="2"/><text x="72" y="386" font-size="24" font-weight="bold">模型输出 → 结构与引用校验</text><text x="72" y="423" font-size="21">成功：带 epoch + 未过期 lease 条件写入；失败：释放当前 lease</text><path d="M500,452 V475" stroke="#42665b" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="480" width="904" height="100" rx="12" fill="white" stroke="#6e9788" stroke-width="2"/><text x="72" y="516" font-size="24" font-weight="bold">completed / done</text><text x="72" y="553" font-size="21">持久答案 + citations；同输入重放直接返回</text><rect x="48" y="610" width="904" height="100" rx="12" fill="white" stroke="#6e9788" stroke-width="2"/><text x="72" y="646" font-size="24" font-weight="bold">恢复分支：POST /runs/:id/resume</text><text x="72" y="683" font-size="21">queued 重新检索；retrieved 复用证据；有效 lease 返回 RUN_BUSY</text></g></svg>