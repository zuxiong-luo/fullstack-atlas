<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">公开目录缓存与私人笔记读取</title><desc id="desc">公开目录两次读取共用DataCache的readId，Alice修改后写存储，再立即使catalog标签过期，客户端refresh的新RSC读取revision2。私人笔记每次先取得会话身份，按身份读取，没有放入共享DataCache。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#315d4a" stroke-width="1.5"/></marker></defs><rect width="1000" height="640" rx="24" fill="#f4f7f3"/><g font-family="system-ui,sans-serif" fill="#203d31"><text x="35" y="48" font-size="25" font-weight="700">公开共享可缓存，私人读取先确定身份</text><g fill="#fff" stroke="#6a8e79" stroke-width="2"><rect x="35" y="95" width="210" height="80" rx="12"/><rect x="360" y="95" width="280" height="80" rx="12"/><rect x="745" y="95" width="220" height="80" rx="12"/><rect x="35" y="245" width="930" height="170" rx="12"/><rect x="35" y="485" width="210" height="85" rx="12"/><rect x="360" y="485" width="280" height="85" rx="12"/><rect x="745" y="485" width="220" height="85" rx="12"/></g><g font-size="19"><text x="55" y="127">公开目录请求</text><text x="55" y="156">GET /api/catalog</text><text x="380" y="127">Data Cache · tag</text><text x="380" y="156">atlas-public-catalog</text><text x="765" y="127">JSON存储</text><text x="765" y="156">revision=1</text><text x="55" y="278" font-weight="700">Alice 通过权限校验后修改公开名称</text><text x="55" y="316">① 写存储：revision 1 → 2</text><text x="55" y="350">② revalidateTag(tag, {expire:0})：下次读取等新数据</text><text x="55" y="384">③ 浏览器 router.refresh() → 新RSC → revision=2、新readId</text><text x="55" y="519">私人笔记请求</text><text x="55" y="549">页面 / API</text><text x="380" y="519">requireUser() → id</text><text x="380" y="549">签名cookie，先验签</text><text x="765" y="519">readAccount(id)</text><text x="765" y="549">不进共享缓存</text></g><g stroke="#315d4a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M245 135H358"/><path d="M640 135H743"/><path d="M245 528H358"/><path d="M640 528H743"/></g><text x="655" y="87" font-size="16">未命中才读取</text><text x="55" y="615" font-size="17">示意流程，无时间比例。标签用于失效分组，不承担缓存键或访问权限。</text></g></svg>
