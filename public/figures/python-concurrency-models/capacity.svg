<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">顺序做，或者交给两个工作线程</title><desc id="desc">教学安排示意：不是耗时比例，不表示 Python 计算一定双核并行。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#356d53"/></marker></defs><rect width="1000" height="600" rx="22" fill="#f5f8f6"/><g font-family="Arial, 'PingFang SC', sans-serif"><text x="40" y="52" font-size="30" fill="#20392f" font-weight="700">顺序做，或者交给两个工作线程</text><text x="40" y="88" font-size="21" fill="#4e675b" font-weight="400">教学安排示意：不是耗时比例，不表示 Python 计算一定双核并行。</text><text x="45" y="155" font-size="25" fill="#20392f" font-weight="400">顺序</text><rect x="185" y="115" width="215" height="100" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="207" y="153" font-size="25" fill="#20392f" font-weight="650">任务 1</text><text x="207" y="192" font-size="22" fill="#20392f" font-weight="400">执行 / 等待</text><rect x="440" y="115" width="215" height="100" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="462" y="153" font-size="25" fill="#20392f" font-weight="650">任务 2</text><text x="462" y="192" font-size="22" fill="#20392f" font-weight="400">执行 / 等待</text><rect x="695" y="115" width="215" height="100" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="717" y="153" font-size="25" fill="#20392f" font-weight="650">任务 3</text><text x="717" y="192" font-size="22" fill="#20392f" font-weight="400">执行 / 等待</text><path d="M400 165 L430 165" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><path d="M655 165 L685 165" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="320" font-size="25" fill="#20392f" font-weight="400">线程 1</text><rect x="185" y="280" width="290" height="100" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="207" y="318" font-size="25" fill="#20392f" font-weight="650">任务 1</text><text x="207" y="357" font-size="22" fill="#20392f" font-weight="400">等待时，另一线程可推进</text><rect x="560" y="280" width="290" height="100" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="582" y="318" font-size="25" fill="#20392f" font-weight="650">任务 3</text><text x="582" y="357" font-size="22" fill="#20392f" font-weight="400">等一个工作位置空出来</text><path d="M475 330 L550 330" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="465" font-size="25" fill="#20392f" font-weight="400">线程 2</text><rect x="185" y="425" width="290" height="100" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="207" y="463" font-size="25" fill="#20392f" font-weight="650">任务 2</text><text x="207" y="502" font-size="22" fill="#20392f" font-weight="400">与任务 1 的等待交错</text><text x="40" y="565" font-size="21" fill="#4e675b" font-weight="400">max_workers=2 限制工作线程，不自动限制输入或排队任务总量。</text></g></svg>