<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 860" role="img" aria-labelledby="title desc">
<title id="title">执行模型与有界容量</title><desc id="desc">线程共享解释器，进程拥有独立解释器，async任务在事件循环上协作。线程进程窗口限制未收集future总数；async队列只限制排队项，生产者在队列满时等待。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315d85"/></marker></defs>
<rect width="780" height="860" fill="white"/>
<g font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" fill="#17324d" font-size="19">
<text x="30" y="42" font-size="27" font-weight="700">先选择执行模型，再明确容量含义</text>
<rect x="30" y="75" width="220" height="120" rx="12" fill="#f0f6ff" stroke="#456f9a"/>
<text x="48" y="110" font-size="22">线程</text><text x="48" y="144">共享解释器 / 内存</text><text x="48" y="176">阻塞 I/O 可交给它</text>
<rect x="280" y="75" width="220" height="120" rx="12" fill="#f0f6ff" stroke="#456f9a"/>
<text x="298" y="110" font-size="22">spawn 进程</text><text x="298" y="144">独立解释器 / 内存</text><text x="298" y="176">纯 Python CPU 任务</text>
<rect x="530" y="75" width="220" height="120" rx="12" fill="#f0f6ff" stroke="#456f9a"/>
<text x="548" y="110" font-size="22">asyncio</text><text x="548" y="144">事件循环协作推进</text><text x="548" y="176">可等待 I/O / 取消</text>
<text x="30" y="246" font-size="23" font-weight="600">线程 / 进程：capacity = 未收集 future 总量</text>
<rect x="60" y="280" width="660" height="160" rx="12" fill="#fff8e8" stroke="#9c751a" stroke-dasharray="7 5"/>
<text x="80" y="312">窗口示例 capacity=2，workers=2</text>
<rect x="100" y="337" width="235" height="64" rx="10" fill="#f0f6ff" stroke="#456f9a"/><text x="120" y="376">future n1（运行中）</text>
<rect x="445" y="337" width="235" height="64" rx="10" fill="#f0f6ff" stroke="#456f9a"/><text x="465" y="376">future n2（运行中）</text>
<text x="80" y="425" font-size="17">收集一个完成结果，再提交下一项；排队项也占窗口。</text>
<text x="30" y="493" font-size="23" font-weight="600">asyncio：capacity只限制排队项</text>
<rect x="30" y="532" width="180" height="82" rx="10" fill="#f0f6ff" stroke="#456f9a"/><text x="48" y="563">生产者</text><text x="48" y="592">至多持有 1 项</text>
<rect x="300" y="532" width="180" height="82" rx="10" fill="#fff8e8" stroke="#9c751a"/><text x="318" y="563">Queue</text><text x="318" y="592">maxsize=1</text>
<rect x="570" y="510" width="180" height="60" rx="10" fill="#f0f6ff" stroke="#456f9a"/><text x="588" y="547">worker 1 / I/O</text>
<rect x="570" y="595" width="180" height="60" rx="10" fill="#f0f6ff" stroke="#456f9a"/><text x="588" y="632">worker 2 / I/O</text>
<path d="M210 572H300" fill="none" stroke="#315d85" stroke-width="2" marker-end="url(#a)"/><path d="M480 552H570" fill="none" stroke="#315d85" stroke-width="2" marker-end="url(#a)"/><path d="M480 594L570 625" fill="none" stroke="#315d85" stroke-width="2" marker-end="url(#a)"/>
<text x="229" y="552" font-size="17">put</text><text x="500" y="532" font-size="17">get</text>
<text x="30" y="700">队列满 → put等待；固定worker数 → 不为每条输入建Task。</text>
<text x="30" y="738">失败 → TaskGroup取消同组任务并等待各自finally清理。</text>
<text x="30" y="786" font-size="17">输入与结果另有128条上限；本图不表示线程/进程与async容量等价。</text>
<text x="30" y="822" font-size="17">结构示意，无耗时或性能比较；标准 CPython 3.12 GIL 构建。</text>
</g></svg>
