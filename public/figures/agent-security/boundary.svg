<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="t d"><title id="t">提示注入与能力边界</title><desc id="d">外部文档进入模型上下文可能包含伪指令，模型输出只允许answer/citations，工具另走白名单和身份授权。程序没有shell任意URL执行器，不靠提示文本保证隔离。</desc><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#315a47"/></marker></defs><rect width="1100" height="520" rx="18" fill="#f4f8f5"/><g font-family="system-ui,sans-serif" fill="#213b30"><text x="30" y="43" font-size="25" font-weight="bold">文档中的指令语气，不会产生执行权限</text><g fill="#fff" stroke="#315a47" stroke-width="2"><rect x="30" y="100" width="290" height="145" rx="10"/><rect x="405" y="100" width="300" height="145" rx="10"/><rect x="790" y="100" width="280" height="145" rx="10"/><rect x="405" y="325" width="665" height="120" rx="10"/></g><g font-size="22"><text x="48" y="141">injection-demo 文档</text><text x="48" y="185">“ignore policy / shell”</text><text x="48" y="224">不可信资料，不是授权</text><text x="425" y="141">provider上下文</text><text x="425" y="185">可能回显恶意句子</text><text x="425" y="224">不保证语义免疫</text><text x="810" y="141">输出边界</text><text x="810" y="185">只许answer/citations</text><text x="810" y="224">tool_calls字段拒绝</text><text x="425" y="364">独立工具边界：固定lookup_document + owner范围</text><text x="425" y="408">shell / 任意URL / bob-note（Alice） → 拒绝，不执行</text></g><g stroke="#315a47" stroke-width="2" marker-end="url(#a)"><path d="M320 170H400"/><path d="M705 170H785"/></g><path d="M170 245V385H400" stroke="#b45b14" stroke-width="3" stroke-dasharray="8 5" fill="none"/><text x="155" y="290" font-size="18">不能跳过程序策略</text><text x="30" y="491" font-size="18">本项目没有通用代码执行器/审批引擎/容器沙箱；安全结论只针对已实现的权限和数据路径。</text></g></svg>