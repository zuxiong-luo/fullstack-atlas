<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" role="img" aria-labelledby="title desc"><title id="title">不同指标回答不同问题，先把窗口与单位写清楚</title><desc id="desc">客户端与服务端分别测量，延迟分布、事件循环探针、CPU与内存不能互相替代。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#356b58"/></marker></defs><rect width="940" height="520" fill="#f7faf7"/><g font-family="system-ui,sans-serif"><text x="28" y="42" fill="#23473b" font-size="26">不同指标回答不同问题，先把窗口与单位写清楚</text><rect x="30" y="90" width="400" height="125" rx="10" fill="#edf5ee" stroke="#668c78"/><text x="45" y="119" fill="#23473b" font-size="18">负载生成器进程</text><text x="45" y="147" fill="#23473b" font-size="18">暖身 → reset → 请求/读完 → 汇总</text><text x="45" y="175" fill="#23473b" font-size="18">闭环：一个槽结束，才发下一项</text><text x="45" y="203" fill="#23473b" font-size="18">最多100请求 / 并发8</text><rect x="510" y="90" width="400" height="125" rx="10" fill="#edf5ee" stroke="#668c78"/><text x="525" y="119" fill="#23473b" font-size="18">服务进程：同一JS事件循环</text><text x="525" y="147" fill="#23473b" font-size="18">输入校验 / 在途上限4</text><text x="525" y="175" fill="#23473b" font-size="18">同步计算或分块setImmediate</text><text x="525" y="203" fill="#23473b" font-size="18">GC与CPU也占用该进程资源</text><path d="M435 150H503" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="440" y="135" fill="#23473b" font-size="16">HTTP</text><rect x="30" y="315" width="400" height="125" rx="10" fill="#edf5ee" stroke="#668c78"/><text x="45" y="344" fill="#23473b" font-size="18">客户端窗口</text><text x="45" y="372" fill="#23473b" font-size="18">latency含连接与读取</text><text x="45" y="400" fill="#23473b" font-size="18">p50/p95含失败；错误另计</text><text x="45" y="428" fill="#23473b" font-size="18">吞吐=窗口完成数 / 窗口秒数</text><rect x="510" y="315" width="400" height="125" rx="10" fill="#edf5ee" stroke="#668c78"/><text x="525" y="344" fill="#23473b" font-size="18">服务端窗口：reset到读metrics</text><text x="525" y="372" fill="#23473b" font-size="18">ELU ≠ 全机CPU</text><text x="525" y="400" fill="#23473b" font-size="18">循环延迟 ≠ HTTP延迟</text><text x="525" y="428" fill="#23473b" font-size="18">无样本显示null，不伪造0</text><path d="M230 221V307" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="245" y="270" fill="#23473b" font-size="16">对应请求集合</text><path d="M710 221V307" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="725" y="270" fill="#23473b" font-size="16">对应采样窗口</text><text x="30" y="493" fill="#23473b" font-size="18">同机分进程仍竞争资源；短闭环样本不是开放到达负载或生产容量承诺。</text></g></svg>