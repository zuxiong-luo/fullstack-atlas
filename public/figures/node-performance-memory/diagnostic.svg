<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="670" viewBox="0 0 1100 670" role="img" aria-labelledby="title"><title id="title">先固定请求与窗口，再选择下一份证据</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315b4a"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f3f7f4"/><style>text{font-family:system-ui,'PingFang SC',sans-serif;fill:#173c2d}.title{font-size:26px;font-weight:650}.label{font-size:20px;font-weight:600}.note{font-size:17px}.edge{font-size:16px;fill:#476454}</style><text x="36" y="48" class="title">先固定请求与窗口，再选择下一份证据</text><rect x="285" y="85" width="530" height="90" rx="12" fill="white" stroke="#7ca58f" stroke-width="2"/><text x="303" y="117" class="label">共同起点：输入、样本、错误与时间窗口</text><text x="303" y="145" class="note">不同窗口的数字不能直接相除或排名</text><rect x="30" y="280" width="245" height="160" rx="12" fill="white" stroke="#7ca58f" stroke-width="2"/><text x="48" y="312" class="label">CPU 高</text><text x="48" y="340" class="note">cpuUsage + profile</text><text x="48" y="368" class="note">定位采样调用栈</text><text x="48" y="396" class="note">必要时查其他线程</text><rect x="295" y="280" width="245" height="160" rx="12" fill="white" stroke="#7ca58f" stroke-width="2"/><text x="313" y="312" class="label">循环被阻塞</text><text x="313" y="340" class="note">循环延迟 + ELU</text><text x="313" y="368" class="note">与请求延迟对照</text><text x="313" y="396" class="note">同步 CPU / 同步 I/O</text><rect x="560" y="280" width="245" height="160" rx="12" fill="white" stroke="#7ca58f" stroke-width="2"/><text x="578" y="312" class="label">内存持续增长</text><text x="578" y="340" class="note">heap / external / RSS</text><text x="578" y="368" class="note">同阶段快照与引用链</text><text x="578" y="396" class="note">验证保留者与清理</text><rect x="825" y="280" width="245" height="160" rx="12" fill="white" stroke="#7ca58f" stroke-width="2"/><text x="843" y="312" class="label">外部 I/O 慢</text><text x="843" y="340" class="note">连接与分阶段时间</text><text x="843" y="368" class="note">上游等待 / 池排队</text><text x="843" y="396" class="note">受控输入复现实验</text><rect x="285" y="545" width="530" height="85" rx="12" fill="white" stroke="#7ca58f" stroke-width="2"/><text x="303" y="577" class="label">收口：只修改已被证据支持的原因</text><text x="303" y="605" class="note">相同输入重跑；保留失败与未验证边界</text><polyline points="550,175 550,225 150,225 150,278" fill="none" stroke="#315b4a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="155" y="250" class="edge">采证</text><polyline points="550,225 417,225 417,278" fill="none" stroke="#315b4a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="425" y="250" class="edge">采证</text><polyline points="550,225 682,225 682,278" fill="none" stroke="#315b4a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="690" y="250" class="edge">采证</text><polyline points="550,225 947,225 947,278" fill="none" stroke="#315b4a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="955" y="250" class="edge">采证</text><polyline points="150,440 150,490 450,490 450,543" fill="none" stroke="#315b4a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="300" y="480" class="edge">重新验证</text><polyline points="947,440 947,490 650,490 650,543" fill="none" stroke="#315b4a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="740" y="480" class="edge">重新验证</text></svg>