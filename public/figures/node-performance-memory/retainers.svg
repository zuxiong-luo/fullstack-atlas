<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" role="img" aria-labelledby="title desc"><title id="title">对象为什么还在：沿持有者找引用，不只看RSS曲线</title><desc id="desc">真实快照核验全局holder、notes元素边与已知类计数；不是用户真实进程内存图。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#356b58"/></marker></defs><rect width="940" height="520" fill="#f7faf7"/><g font-family="system-ui,sans-serif"><text x="28" y="42" fill="#23473b" font-size="26">对象为什么还在：沿持有者找引用，不只看RSS曲线</text><rect x="30" y="90" width="250" height="100" rx="10" fill="#edf5ee" stroke="#668c78"/><text x="45" y="119" fill="#23473b" font-size="18">全局入口</text><text x="45" y="147" fill="#23473b" font-size="18">__atlasMemoryDemo</text><text x="45" y="175" fill="#23473b" font-size="18">当前实验显式建立</text><rect x="345" y="90" width="250" height="100" rx="10" fill="#edf5ee" stroke="#668c78"/><text x="360" y="119" fill="#23473b" font-size="18">holder</text><text x="360" y="147" fill="#23473b" font-size="18">tag=atlas-retention-root</text><text x="360" y="175" fill="#23473b" font-size="18">notes → 数组</text><rect x="660" y="90" width="250" height="100" rx="10" fill="#edf5ee" stroke="#668c78"/><text x="675" y="119" fill="#23473b" font-size="18">Array元素</text><text x="675" y="147" fill="#23473b" font-size="18">128 × AtlasNote</text><text x="675" y="175" fill="#23473b" font-size="18">每项包含有限payload</text><path d="M285 140H338" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="290" y="125" fill="#23473b" font-size="16">引用</text><path d="M600 140H653" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="605" y="125" fill="#23473b" font-size="16">引用</text><rect x="30" y="310" width="250" height="110" rx="10" fill="#edf5ee" stroke="#668c78"/><text x="45" y="339" fill="#23473b" font-size="18">基线快照</text><text x="45" y="367" fill="#23473b" font-size="18">AtlasNote: 0</text><text x="45" y="395" fill="#23473b" font-size="18">全局holder存在，数组空</text><rect x="345" y="310" width="250" height="110" rx="10" fill="#edf5ee" stroke="#668c78"/><text x="360" y="339" fill="#23473b" font-size="18">保留快照</text><text x="360" y="367" fill="#23473b" font-size="18">AtlasNote: 128</text><text x="360" y="395" fill="#23473b" font-size="18">数组元素边: 128</text><rect x="660" y="310" width="250" height="110" rx="10" fill="#edf5ee" stroke="#668c78"/><text x="675" y="339" fill="#23473b" font-size="18">清引用+GC后快照</text><text x="675" y="367" fill="#23473b" font-size="18">AtlasNote: 0</text><text x="675" y="395" fill="#23473b" font-size="18">数组元素边: 0</text><path d="M285 365H338" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="290" y="350" fill="#23473b" font-size="16">分配</text><path d="M600 365H653" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="605" y="350" fill="#23473b" font-size="16">清空</text><text x="30" y="475" fill="#23473b" font-size="18">这证明合成对象的引用生命周期，不保证RSS立即下降或整个进程没有其他泄漏。</text></g></svg>