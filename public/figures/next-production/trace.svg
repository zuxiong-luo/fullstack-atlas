<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" role="img" aria-labelledby="title desc"><title id="title">请求ID建立关联，结构化记录限定观察范围</title><desc id="desc">从入口到Route Handler传递同ID并记录结果，响应带回ID；拒绝将关联ID当授权。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#356b58"/></marker></defs><rect width="940" height="520" fill="#f7faf7"/><g font-family="system-ui,sans-serif"><text x="28" y="42" fill="#23473b" font-size="26">请求ID建立关联，结构化记录限定观察范围</text><rect x="30" y="90" width="260" height="120" rx="10" fill="#edf5ee" stroke="#668c78"/><text x="45" y="119" fill="#23473b" font-size="18">调用方</text><text x="45" y="147" fill="#23473b" font-size="18">可提供x-request-id</text><text x="45" y="175" fill="#23473b" font-size="18">它不是登录或幂等身份</text><rect x="340" y="90" width="260" height="120" rx="10" fill="#edf5ee" stroke="#668c78"/><text x="355" y="119" fill="#23473b" font-size="18">proxy</text><text x="355" y="147" fill="#23473b" font-size="18">合法格式保留</text><text x="355" y="175" fill="#23473b" font-size="18">否则生成UUID并注入</text><rect x="650" y="90" width="260" height="120" rx="10" fill="#edf5ee" stroke="#668c78"/><text x="665" y="119" fill="#23473b" font-size="18">Route Handler</text><text x="665" y="147" fill="#23473b" font-size="18">同ID记录start与finish</text><text x="665" y="175" fill="#23473b" font-size="18">返回同ID与受控结果</text><path d="M295 151H333" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="299" y="136" fill="#23473b" font-size="16">请求</text><path d="M605 151H643" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="550" y="249" fill="#23473b" font-size="16">下游请求头</text><rect x="340" y="325" width="570" height="110" rx="10" fill="#edf5ee" stroke="#668c78"/><text x="355" y="354" fill="#23473b" font-size="18">结构化日志：event / id / route / status / durationMs</text><text x="355" y="382" fill="#23473b" font-size="18">不记录Authorization、Cookie、token或完整请求体</text><text x="355" y="410" fill="#23473b" font-size="18">此处只关联单服务；未实现跨服务span与采样</text><path d="M785 217V317" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="542" y="289" fill="#23473b" font-size="16">成功 / 失败均有finish</text><path d="M470 217V270H160V217" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="70" y="306" fill="#23473b" font-size="16">响应沿链路带回同ID</text><text x="30" y="493" fill="#23473b" font-size="18">/api/health是存活；关键asset缺失时报告可500，不能用存活代替依赖就绪。</text></g></svg>