<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" role="img" aria-labelledby="title desc"><title id="title">构建成功、产物齐全与独立启动是三个检查点</title><desc id="desc">源码先构建再装配，部署到新目录；运行时配置与显式asset有独立失败验证。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#356b58"/></marker></defs><rect width="940" height="520" fill="#f7faf7"/><g font-family="system-ui,sans-serif"><text x="28" y="42" fill="#23473b" font-size="26">构建成功、产物齐全与独立启动是三个检查点</text><rect x="30" y="90" width="250" height="135" rx="10" fill="#edf5ee" stroke="#668c78"/><text x="45" y="119" fill="#23473b" font-size="18">源码与精确锁</text><text x="45" y="147" fill="#23473b" font-size="18">Next build --webpack</text><text x="45" y="175" fill="#23473b" font-size="18">NEXT_PUBLIC标题在此固化</text><rect x="345" y="90" width="250" height="135" rx="10" fill="#edf5ee" stroke="#668c78"/><text x="360" y="119" fill="#23473b" font-size="18">.next/standalone</text><text x="360" y="147" fill="#23473b" font-size="18">最小server + 所需依赖</text><text x="360" y="175" fill="#23473b" font-size="18">.next/static是另一份输出</text><rect x="660" y="90" width="250" height="135" rx="10" fill="#edf5ee" stroke="#668c78"/><text x="675" y="119" fill="#23473b" font-size="18">release装配</text><text x="675" y="147" fill="#23473b" font-size="18">standalone + static + public</text><text x="675" y="175" fill="#23473b" font-size="18">boot + runtime + asset</text><path d="M285 155H338" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="290" y="141" fill="#23473b" font-size="16">构建</text><path d="M600 155H653" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="605" y="141" fill="#23473b" font-size="16">装配</text><rect x="30" y="315" width="400" height="130" rx="10" fill="#edf5ee" stroke="#668c78"/><text x="45" y="344" fill="#23473b" font-size="18">显式追踪 assets/build-info.json</text><text x="45" y="372" fill="#23473b" font-size="18">nft清单包含 + 部署副本存在</text><text x="45" y="400" fill="#23473b" font-size="18">缺文件时真实报告接口返回500</text><rect x="510" y="315" width="400" height="130" rx="10" fill="#edf5ee" stroke="#668c78"/><text x="525" y="344" fill="#23473b" font-size="18">新临时目录启动 boot</text><text x="525" y="372" fill="#23473b" font-size="18">先验证私有token与region</text><text x="525" y="400" fill="#23473b" font-size="18">缺配置：退出1，不开始监听</text><path d="M785 231V276H710V307" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="512" y="261" fill="#23473b" font-size="16">复制完整产物，不链接回源码</text><text x="30" y="492" fill="#23473b" font-size="18">当前只验证本机平台单实例，不把独立目录运行说成Linux、Docker或多区域验收。</text></g></svg>