<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 760" role="img" aria-labelledby="title desc">
<title id="title">笔记包的依赖方向与文件拥有权</title><desc id="desc">模块入口调用CLI，CLI调用应用层。read_notebook在with范围内打开并消费文件，转换层建立Note，Notebook保存结果。错误由独立模块定义，普通import不启动CLI。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315d85"/></marker></defs>
<rect width="740" height="760" fill="white"/>
<g font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" fill="#17324d" font-size="20">
<text x="30" y="42" font-size="27" font-weight="700">包边界：环境向内适配，领域不读文件</text>
<rect x="200" y="75" width="340" height="64" rx="12" fill="#f0f6ff" stroke="#456f9a"/><text x="220" y="112">__main__ → cli.main(argv)</text>
<path d="M370 139V195" fill="none" stroke="#315d85" stroke-width="2" marker-end="url(#a)"/><text x="385" y="175" font-size="17">路径 / 调用</text>
<rect x="40" y="195" width="660" height="205" rx="14" fill="#fff8e8" stroke="#9c751a" stroke-dasharray="8 5"/>
<text x="60" y="226" font-size="18">应用层拥有资源：with覆盖真正消费</text>
<rect x="200" y="245" width="340" height="62" rx="12" fill="#f0f6ff" stroke="#456f9a"/><text x="220" y="282">read_notebook → build_notebook</text>
<path d="M370 307V342" fill="none" stroke="#315d85" stroke-width="2" marker-end="url(#a)"/>
<text x="85" y="374">打开文件 → 借用lines → 读完 / 报错 → 关闭文件</text>
<path d="M370 400V455" fill="none" stroke="#315d85" stroke-width="2" marker-end="url(#a)"/><text x="385" y="435" font-size="17">消费迭代器</text>
<rect x="160" y="455" width="420" height="64" rx="12" fill="#f0f6ff" stroke="#456f9a"/><text x="180" y="492">codec：JSONL → (line, Note)</text>
<path d="M370 519V575" fill="none" stroke="#315d85" stroke-width="2" marker-end="url(#a)"/><text x="385" y="553" font-size="17">构造 / 添加</text>
<rect x="160" y="575" width="420" height="64" rx="12" fill="#f0f6ff" stroke="#456f9a"/><text x="180" y="612">domain：Note / Notebook</text>
<text x="30" y="684" font-size="18">errors提供预期失败类型；CLI附文件名并适配stderr / 退出码。</text>
<text x="30" y="718" font-size="18">教学结构示意；普通import仅建立定义，不启动导入任务。</text>
</g></svg>
