<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">模块只是分开保存的 Python 代码</title><desc id="desc">箭头表示导入关系；函数仍在需要时由调用者执行。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#356d53"/></marker></defs><rect width="1000" height="600" rx="22" fill="#f5f8f6"/><g font-family="Arial, 'PingFang SC', sans-serif"><text x="40" y="52" font-size="30" fill="#20392f" font-weight="700">模块只是分开保存的 Python 代码</text><text x="40" y="88" font-size="21" fill="#4e675b" font-weight="400">箭头表示导入关系；函数仍在需要时由调用者执行。</text><rect x="45" y="150" width="385" height="150" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="67" y="188" font-size="25" fill="#20392f" font-weight="650">files_demo.py：运行入口</text><text x="67" y="227" font-size="22" fill="#20392f" font-weight="400">创建 Note、调用保存和读取</text><text x="67" y="258" font-size="22" fill="#20392f" font-weight="400">展示正常结果与格式错误</text><rect x="560" y="130" width="390" height="125" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="582" y="168" font-size="25" fill="#20392f" font-weight="650">learning_notes/models.py</text><text x="582" y="207" font-size="22" fill="#20392f" font-weight="400">定义 Note、Notebook</text><rect x="560" y="350" width="390" height="135" rx="16" fill="white" stroke="#8aaf9b" stroke-width="2"/><text x="582" y="388" font-size="25" fill="#20392f" font-weight="650">learning_notes/files.py</text><text x="582" y="427" font-size="22" fill="#20392f" font-weight="400">save_book、load_book</text><text x="582" y="458" font-size="22" fill="#20392f" font-weight="400">相对导入 .models 中的 Note</text><path d="M430 190 L550 190" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><path d="M430 270 L550 400" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><path d="M760 350 L760 265" fill="none" stroke="#356d53" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="565" font-size="21" fill="#4e675b" font-weight="400">入口按步骤调用；import 不等于把整个演示流程又运行一遍。</text></g></svg>