<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title"><title id="title">组件、元素描述与 DOM</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L8 5 L0 10" fill="none" stroke="#426654" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f4f7f2"/><g font-family="system-ui, sans-serif" fill="#20392d"><text x="32" y="48" font-size="25" font-weight="700">组件、元素描述与 DOM</text><rect x="40.0" y="92" width="297.3333333333333" height="142" rx="12" fill="#e4eee5" stroke="#91a99b"/><text x="54.0" y="125" font-size="20" font-weight="600">组件 Greeting</text><text x="54.0" y="160" font-size="17">输入：name=&quot;小罗&quot;</text><text x="54.0" y="188" font-size="17">返回：&lt;h2&gt;你好，小罗&lt;/h2&gt;</text><path d="M340.3333333333333 167 H366.3333333333333" stroke="#426654" stroke-width="2" marker-end="url(#a)"/><rect x="371.3333333333333" y="92" width="297.3333333333333" height="142" rx="12" fill="#edf0fa" stroke="#91a99b"/><text x="385.3333333333333" y="125" font-size="20" font-weight="600">元素描述</text><text x="385.3333333333333" y="160" font-size="17">类型：h2</text><text x="385.3333333333333" y="188" font-size="17">内容：你好，小罗</text><path d="M671.6666666666666 167 H697.6666666666666" stroke="#426654" stroke-width="2" marker-end="url(#a)"/><rect x="702.6666666666666" y="92" width="297.3333333333333" height="142" rx="12" fill="#fff1d5" stroke="#91a99b"/><text x="716.6666666666666" y="125" font-size="20" font-weight="600">浏览器 DOM</text><text x="716.6666666666666" y="160" font-size="17">实际的 h2 节点</text><text x="716.6666666666666" y="188" font-size="17">由 React DOM 应用变更</text><text x="40" y="278" font-size="18">Greeting 没有额外的 DOM 外壳；函数执行与 DOM 创建不是同一件事。</text><text x="40" y="308" font-size="18">图中省略构建转换和内部协调过程。</text></g></svg>