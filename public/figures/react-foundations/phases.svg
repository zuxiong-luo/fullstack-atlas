<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title"><title id="title">一次已读操作：请求、计算、提交、绘制</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L8 5 L0 10" fill="none" stroke="#426654" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f4f7f2"/><g font-family="system-ui, sans-serif" fill="#20392d"><text x="32" y="48" font-size="25" font-weight="700">一次已读操作：请求、计算、提交、绘制</text><rect x="40.0" y="92" width="214.5" height="142" rx="12" fill="#e4eee5" stroke="#91a99b"/><text x="54.0" y="125" font-size="20" font-weight="600">请求更新</text><text x="54.0" y="160" font-size="17">点击行内按钮</text><text x="54.0" y="188" font-size="17">setBooks(...)</text><path d="M257.5 167 H283.5" stroke="#426654" stroke-width="2" marker-end="url(#a)"/><rect x="288.5" y="92" width="214.5" height="142" rx="12" fill="#edf0fa" stroke="#91a99b"/><text x="302.5" y="125" font-size="20" font-weight="600">React 计算</text><text x="302.5" y="160" font-size="17">调用组件</text><text x="302.5" y="188" font-size="17">得到新的元素描述</text><path d="M506.0 167 H532.0" stroke="#426654" stroke-width="2" marker-end="url(#a)"/><rect x="537.0" y="92" width="214.5" height="142" rx="12" fill="#fff1d5" stroke="#91a99b"/><text x="551.0" y="125" font-size="20" font-weight="600">React 提交</text><text x="551.0" y="160" font-size="17">应用必要的</text><text x="551.0" y="188" font-size="17">DOM 变更</text><path d="M754.5 167 H780.5" stroke="#426654" stroke-width="2" marker-end="url(#a)"/><rect x="785.5" y="92" width="214.5" height="142" rx="12" fill="#e4eee5" stroke="#91a99b"/><text x="799.5" y="125" font-size="20" font-weight="600">浏览器绘制</text><text x="799.5" y="160" font-size="17">按浏览器时机</text><text x="799.5" y="188" font-size="17">显示结果</text><text x="40" y="278" font-size="18">正常完成路径示意；计算结果也可能被放弃，执行组件不等于已经更新页面。</text><text x="40" y="308" font-size="18">框的宽度不代表耗时；本图不是性能测量。</text></g></svg>