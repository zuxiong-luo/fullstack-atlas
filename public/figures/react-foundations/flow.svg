<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title"><title id="title">阅读清单：数据向下，操作请求回到拥有者</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L8 5 L0 10" fill="none" stroke="#426654" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f4f7f2"/><g font-family="system-ui, sans-serif" fill="#20392d"><text x="32" y="48" font-size="25" font-weight="700">阅读清单：数据向下，操作请求回到拥有者</text><rect x="40.0" y="92" width="297.3333333333333" height="142" rx="12" fill="#e4eee5" stroke="#91a99b"/><text x="54.0" y="125" font-size="20" font-weight="600">App 持有 books</text><text x="54.0" y="160" font-size="17">通过 book prop</text><text x="54.0" y="188" font-size="17">提供书名与已读状态</text><path d="M340.3333333333333 167 H366.3333333333333" stroke="#426654" stroke-width="2" marker-end="url(#a)"/><rect x="371.3333333333333" y="92" width="297.3333333333333" height="142" rx="12" fill="#edf0fa" stroke="#91a99b"/><text x="385.3333333333333" y="125" font-size="20" font-weight="600">BookRow 展示</text><text x="385.3333333333333" y="160" font-size="17">用户点击按钮</text><text x="385.3333333333333" y="188" font-size="17">调用 onToggle(book.id)</text><path d="M671.6666666666666 167 H697.6666666666666" stroke="#426654" stroke-width="2" marker-end="url(#a)"/><rect x="702.6666666666666" y="92" width="297.3333333333333" height="142" rx="12" fill="#fff1d5" stroke="#91a99b"/><text x="716.6666666666666" y="125" font-size="20" font-weight="600">App 处理请求</text><text x="716.6666666666666" y="160" font-size="17">setBooks 生成下一版</text><text x="716.6666666666666" y="188" font-size="17">重新向下提供数据</text><text x="40" y="278" font-size="18">左 → 中：输入数据；中 → 右：回调请求。最右仍是同一个 App，不是另一个实例。</text><text x="40" y="308" font-size="18">BookRow 不直接修改传入的 book 对象。</text></g></svg>