<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title"><title id="title">ABC → CAB：复用身份与移动位置是两件事</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#52856b"/></marker></defs><rect width="1000" height="500" rx="20" fill="#f4f8f5"/><g font-family="system-ui,sans-serif" fill="#263e33"><text x="32" y="45" font-size="28">ABC → CAB：复用身份与移动位置是两件事</text><text x="45" y="100" font-size="22">旧顺序 / 旧 index</text><rect x="45" y="120" width="210" height="62" rx="12" fill="#e0eee6" stroke="#52856b"/><text x="61" y="159" font-size="22">A / 0</text><rect x="365" y="120" width="210" height="62" rx="12" fill="#e0eee6" stroke="#52856b"/><text x="381" y="159" font-size="22">B / 1</text><rect x="685" y="120" width="210" height="62" rx="12" fill="#e0eee6" stroke="#52856b"/><text x="701" y="159" font-size="22">C / 2</text><text x="45" y="235" font-size="22">新顺序 / 协调标记</text><rect x="45" y="255" width="210" height="62" rx="12" fill="#e0eee6" stroke="#52856b"/><text x="61" y="294" font-size="22">C：不标移动</text><rect x="365" y="255" width="210" height="62" rx="12" fill="#e0eee6" stroke="#52856b"/><text x="381" y="294" font-size="22">A：Placement</text><rect x="685" y="255" width="210" height="62" rx="12" fill="#e0eee6" stroke="#52856b"/><text x="701" y="294" font-size="22">B：Placement</text><text x="45" y="365" font-size="22">遍历 C 后 lastPlacedIndex = 2；A 的 0、B 的 1 都小于 2。</text><text x="45" y="410" font-size="22">A、B 标记待移动，并不因此丢失组件身份和局部状态。</text><text x="45" y="460" font-size="22">提交后顺序 C A B；若原来 A=1，仍然是 A=1。</text></g></svg>