<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title"><title id="title">树结构：child、sibling 与 return</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#52856b"/></marker></defs><rect width="1000" height="500" rx="20" fill="#f4f8f5"/><g font-family="system-ui,sans-serif" fill="#263e33"><text x="32" y="45" font-size="28">树结构：child、sibling 与 return</text><rect x="360" y="80" width="210" height="62" rx="12" fill="#e0eee6" stroke="#52856b"/><text x="376" y="119" font-size="22">ul Fiber</text><rect x="100" y="230" width="210" height="62" rx="12" fill="#e0eee6" stroke="#52856b"/><text x="116" y="269" font-size="22">Row A Fiber</text><rect x="395" y="230" width="210" height="62" rx="12" fill="#e0eee6" stroke="#52856b"/><text x="411" y="269" font-size="22">Row B Fiber</text><rect x="690" y="230" width="210" height="62" rx="12" fill="#e0eee6" stroke="#52856b"/><text x="706" y="269" font-size="22">Row C Fiber</text><rect x="100" y="365" width="210" height="62" rx="12" fill="#e0eee6" stroke="#52856b"/><text x="116" y="404" font-size="22">li Fiber</text><path d="M390 142 L200 225" fill="none" stroke="#52856b" stroke-width="2.5" marker-end="url(#a)"/><text x="230" y="180" font-size="18">child</text><path d="M310 260 L390 260" fill="none" stroke="#52856b" stroke-width="2.5" marker-end="url(#a)"/><text x="320" y="244" font-size="16">sibling</text><path d="M605 260 L685 260" fill="none" stroke="#52856b" stroke-width="2.5" marker-end="url(#a)"/><text x="615" y="244" font-size="16">sibling</text><path d="M200 292 L200 360" fill="none" stroke="#52856b" stroke-width="2.5" marker-end="url(#a)"/><text x="220" y="335" font-size="18">child</text><text x="410" y="345" font-size="20">Row A / B / C 的 return 都指向 ul</text><text x="410" y="385" font-size="20">li 的 return 指向 Row A</text><text x="32" y="468" font-size="21">Row 是组件节点；li 才是这里的宿主节点。其余后代省略。</text></g></svg>