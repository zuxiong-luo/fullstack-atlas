<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title"><title id="title">双缓冲：当前记录与下一版工作记录</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#52856b"/></marker></defs><rect width="1000" height="500" rx="20" fill="#f4f8f5"/><g font-family="system-ui,sans-serif" fill="#263e33"><text x="32" y="45" font-size="28">双缓冲：当前记录与下一版工作记录</text><rect x="50" y="100" width="210" height="62" rx="12" fill="#e0eee6" stroke="#52856b"/><text x="66" y="139" font-size="22">F1：current</text><path d="M270 130 L365 130" fill="none" stroke="#52856b" stroke-width="2.5" marker-end="url(#a)"/><rect x="380" y="100" width="210" height="62" rx="12" fill="#e0eee6" stroke="#52856b"/><text x="396" y="139" font-size="22">F2：准备中</text><text x="685" y="138" font-size="20">提交前：F1 仍是 current</text><path d="M485 170 L485 225" fill="none" stroke="#52856b" stroke-width="2.5" marker-end="url(#a)"/><text x="510" y="202" font-size="19">成功提交</text><rect x="380" y="240" width="210" height="62" rx="12" fill="#e0eee6" stroke="#52856b"/><text x="396" y="279" font-size="22">F2：current</text><path d="M365 270 L270 270" fill="none" stroke="#52856b" stroke-width="2.5" marker-end="url(#a)"/><rect x="50" y="240" width="210" height="62" rx="12" fill="#e0eee6" stroke="#52856b"/><text x="66" y="279" font-size="22">F1：下轮准备</text><text x="685" y="278" font-size="20">两者通过 alternate 关联</text><text x="50" y="380" font-size="23">下一轮成功提交后，F1 再次成为 current。</text><text x="50" y="425" font-size="23">准备工作若被放弃，不切换 root.current。</text><text x="50" y="468" font-size="21">图中是同一节点的两份 Fiber 记录，不是两套 DOM。</text></g></svg>