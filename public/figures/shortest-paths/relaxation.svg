<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc"><title id="title">发现不等于确定：同一个顶点可以被再次改进</title><desc id="desc">边0→1权10，0→2权1，2→1权1，1→3权1，2→3权8。依次确定0、2、1、3，旧10与9条目最后丢弃。</desc><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285443"/></marker></defs><rect width="1000" height="780" fill="#f3f7f4"/><g font-family="system-ui,PingFang SC,sans-serif"><text x="30" y="44" font-size="28" fill="#173c2e">发现不等于确定：同一个顶点可以被再次改进</text><rect x="40" y="110" width="920" height="100" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="141" font-size="20" fill="#173c2e">起点0出发：distance[1]=10，distance[2]=1</text><text x="56" y="170" font-size="20" fill="#173c2e">候选堆先取2，不按顶点编号，也不按最早发现</text><path d="M500 215L500 260" stroke="#285443" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="40" y="265" width="920" height="115" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="296" font-size="20" fill="#173c2e">从2松弛：1改成1+1=2，3暂为1+8=9</text><text x="56" y="325" font-size="20" fill="#173c2e">堆允许同时有旧(1,10)、新(1,2)；不原地乱改旧键</text><path d="M500 385L500 430" stroke="#285443" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="40" y="435" width="920" height="115" rx="12" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="56" y="466" font-size="20" fill="#173c2e">取1且核对当前距离2，确定它；3改成2+1=3</text><text x="56" y="495" font-size="20" fill="#173c2e">再取3确定；最终distance=[0,2,1,3]</text><rect x="40" y="615" width="920" height="95" rx="12" fill="#fff4dc" stroke="#6d987f" stroke-width="2"/><text x="56" y="646" font-size="20" fill="#173c2e">旧(1,10)、(3,9)之后出堆，被当过期条目跳过</text><text x="56" y="675" font-size="20" fill="#173c2e">路径0→2→1→3；松弛尝试5次，过期条目2个</text></g></svg>
