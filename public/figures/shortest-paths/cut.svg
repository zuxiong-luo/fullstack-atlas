<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc"><title id="title">非负权：跨过边界后，成本不能凭空变小</title><desc id="desc">确定距离最小的未确定u时，任何想更短到u的路径，其第一个未确定点y已经有不大于u的候选距离；非负后缀不可能再降回更小。</desc><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285443"/></marker></defs><rect width="1000" height="780" fill="#f3f7f4"/><g font-family="system-ui,PingFang SC,sans-serif"><text x="30" y="44" font-size="28" fill="#173c2e">非负权：跨过边界后，成本不能凭空变小</text><rect x="40" y="110" width="920" height="125" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="141" font-size="20" fill="#173c2e">已确定集合 S：距离已经证明最优</text><text x="56" y="170" font-size="20" fill="#173c2e">候选u：所有未确定顶点里，当前距离最小</text><text x="56" y="199" font-size="20" fill="#173c2e">假设另有更短路径到u，观察它第一次离开S的边x→y</text><path d="M500 240L500 285" stroke="#285443" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="40" y="290" width="920" height="130" rx="12" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="56" y="321" font-size="20" fill="#173c2e">x已确定，所以处理x时已用该边改进过y</text><text x="56" y="350" font-size="20" fill="#173c2e">非负后缀保证：到y的前缀成本 ≤ 这条到u的路径成本</text><text x="56" y="379" font-size="20" fill="#173c2e">若这条路比u候选更短，就与u候选最小矛盾</text><rect x="40" y="490" width="920" height="160" rx="12" fill="#fff4dc" stroke="#6d987f" stroke-width="2"/><text x="56" y="521" font-size="20" fill="#173c2e">负边会破坏这一步：0→1=2，0→2=5，2→1=-4</text><text x="56" y="550" font-size="20" fill="#173c2e">如果先把1的2确定，后面经2可到1，成本却是1</text><text x="56" y="579" font-size="20" fill="#173c2e">本例直接拒绝负权，不把“还能重新入队”当Dijkstra证明</text><text x="56" y="608" font-size="20" fill="#173c2e">图为证明关系示意，不表示空间位置、网络延迟或真实测量</text></g></svg>
