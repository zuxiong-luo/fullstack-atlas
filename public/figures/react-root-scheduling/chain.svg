<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 650" role="img" aria-labelledby="t d"><title id="t">更新如何走到根调度</title><desc id="d">dispatch入队并给源Fiber标lanes，沿return给祖先标childLanes，找到HostRoot.stateNode得到FiberRoot。scheduleUpdateOnFiber标根pending，再ensureRootIsScheduled安排回调。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#345d4e"/></marker></defs><rect width="1060" height="650" rx="18" fill="#f5f8f3"/><g font-family="system-ui,sans-serif" fill="#183c31" font-size="20"><text x="30" y="45" font-size="27">入队、传播、标记根、安排入口</text><text x="30" y="80" font-size="18">普通非 render-phase 路径；已排除 eager bailout。箭头不是时间刻度。</text><g fill="#fff" stroke="#718f81" stroke-width="2"><rect x="35" y="130" width="300" height="100" rx="10"/><rect x="390" y="130" width="285" height="100" rx="10"/><rect x="730" y="130" width="295" height="100" rx="10"/><rect x="730" y="315" width="295" height="100" rx="10"/><rect x="375" y="315" width="315" height="100" rx="10"/><rect x="35" y="315" width="285" height="100" rx="10"/></g><text x="55" y="165">dispatchSetState</text><text x="55" y="200">Hook 更新入队；源 lanes</text><text x="410" y="165">沿 return 向祖先传播</text><text x="410" y="200">合并祖先 childLanes</text><text x="750" y="165">到达 HostRoot Fiber</text><text x="750" y="200">stateNode 指向 FiberRoot</text><text x="750" y="352">scheduleUpdateOnFiber</text><text x="750" y="388">markRootUpdated</text><text x="395" y="352">FiberRoot.pendingLanes</text><text x="395" y="388">根记录未完成工作</text><text x="53" y="352">ensureRootIsScheduled</text><text x="53" y="388">选择、复用或重排入口</text><g fill="none" stroke="#345d4e" stroke-width="2" marker-end="url(#a)"><path d="M335 180H390"/><path d="M675 180H730"/><path d="M880 230V315"/><path d="M730 365H690"/><path d="M375 365H320"/></g><rect x="35" y="470" width="990" height="125" rx="12" fill="#deece3"/><text x="55" y="508">三个位置不能混称：</text><text x="55" y="543">源 Fiber.lanes ｜ 祖先 Fiber.childLanes ｜ 根对象 FiberRoot.pendingLanes</text><text x="55" y="578">callbackPriority / callbackNode 也属于 FiberRoot，不属于某一个 Hook。</text></g></svg>
