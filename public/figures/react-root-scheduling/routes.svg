<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 780" role="img" aria-labelledby="t d"><title id="t">Sync和普通Scheduler回调的入口</title><desc id="d">选择最高Lane，优先级相同且非act例外时复用，否则取消旧普通回调。Sync进React队列经flush到performSyncWorkOnRoot；非Sync映射Scheduler类别，经宿主机会到performConcurrentWorkOnRoot，再判断是否允许并发render。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#345d4e"/></marker></defs><rect width="1060" height="780" rx="18" fill="#f5f8f3"/><g font-family="system-ui,sans-serif" fill="#183c31" font-size="19"><text x="30" y="43" font-size="26">根安排执行入口；入口执行时再检查当前工作</text><rect x="160" y="75" width="740" height="92" rx="10" fill="#fff1d8" stroke="#718f81"/><text x="180" y="110">比较最高 Lane 与 callbackPriority</text><text x="180" y="146">相同且非 act 例外 → 复用；不同 → 取消旧普通句柄并重排</text><text x="365" y="203" font-size="17">以下仅在需要重排时继续</text><g fill="#fff" stroke="#718f81"><rect x="35" y="225" width="455" height="85" rx="10"/><rect x="570" y="225" width="455" height="85" rx="10"/><rect x="35" y="375" width="455" height="95" rx="10"/><rect x="570" y="375" width="455" height="95" rx="10"/><rect x="35" y="535" width="455" height="110" rx="10"/><rect x="570" y="535" width="455" height="110" rx="10"/></g><text x="55" y="258">Sync：scheduleSyncCallback</text><text x="55" y="292">入 React 内部队列；根 callbackNode=null</text><text x="590" y="258">非 Sync：映射 Scheduler 类别</text><text x="590" y="292">scheduleCallback 返回任务句柄</text><text x="55" y="410">安排 flush：通常用微任务</text><text x="55" y="444">无支持时 Immediate 后备；另有 act 分支</text><text x="590" y="410">Scheduler 获得宿主执行机会</text><text x="590" y="444">不是把 Lane 数值直接交给浏览器</text><text x="55" y="570">performSyncWorkOnRoot</text><text x="55" y="603">再次选 Lane；没有 Sync 就重排后返回</text><text x="590" y="570">performConcurrentWorkOnRoot</text><text x="590" y="603">passive / 选 Lane / 同步或并发 render</text><g fill="none" stroke="#345d4e" stroke-width="2" marker-end="url(#a)"><path d="M300 167V225"/><path d="M790 167V225"/><path d="M260 310V375"/><path d="M790 310V375"/><path d="M260 470V535"/><path d="M790 470V535"/></g><text x="35" y="700">Lane 优先级 ≠ Scheduler 类别 ≠ 浏览器原生任务优先级。</text><text x="35" y="742">箭头表示安排或调用，不承诺“setter 立即写 DOM”或“回调必定切片”。</text></g></svg>
