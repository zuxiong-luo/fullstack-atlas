<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img"><title>浏览器限制读取与执行，服务端决定权限与效果</title><desc>示意图只描述本机虚构数据实验，不修改系统信任库或浏览器安全开关。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285443"/></marker></defs><rect width="1200" height="850" rx="24" fill="#f3f7f4"/><text x="32" y="45" font-family="system-ui,sans-serif" font-size="28" fill="#173c2e" font-weight="700">浏览器限制读取与执行，服务端决定权限与效果</text><text x="32" y="85" font-family="system-ui,sans-serif" font-size="18" fill="#173c2e">示意图只描述本机虚构数据实验，不修改系统信任库或浏览器安全开关。</text><text x="35" y="137" font-family="system-ui,sans-serif" font-size="22" fill="#173c2e" font-weight="700">UI :4352 与 API :4351：跨源、同站；Cookie不按端口隔离</text><rect x="35" y="175" width="280" height="110" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="49" y="204" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">普通表单类型POST</text><text x="49" y="232" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">不需要此次预检</text><text x="49" y="260" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">脚本等待结果</text><rect x="465" y="175" width="280" height="110" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="479" y="204" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">API处理简单写入</text><text x="479" y="232" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">内存计数 +1</text><text x="479" y="260" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">不附CORS共享头</text><rect x="895" y="175" width="270" height="110" rx="12" fill="#f7e8d5" stroke="#6d987f" stroke-width="2"/><text x="909" y="204" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">浏览器拒绝读取响应</text><text x="909" y="232" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">fetch显示错误</text><text x="909" y="260" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">已生效的写入不回滚</text><path d="M315 230H462" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#a)"/><path d="M745 230H892" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#a)"/><text x="35" y="335" font-family="system-ui,sans-serif" font-size="22" fill="#173c2e" font-weight="700">JSON + X-Lab：预检许可与实际用户认证是两关</text><rect x="35" y="365" width="280" height="110" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="49" y="394" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">OPTIONS询问</text><text x="49" y="422" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">源 / POST / 头部</text><text x="49" y="450" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">不要求用户Cookie</text><rect x="465" y="365" width="280" height="110" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="479" y="394" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">允许范围内返回204</text><text x="479" y="422" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">或403阻止实际请求</text><text x="479" y="450" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">凭据响应不使用 *</text><rect x="895" y="365" width="270" height="110" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="909" y="394" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">实际JSON POST</text><text x="909" y="422" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">服务端再检查身份</text><text x="909" y="450" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">无会话仍然401</text><path d="M315 420H462" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#a)"/><path d="M745 420H892" fill="none" stroke="#285443" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="555" width="530" height="155" rx="12" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="54" y="584" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">CSP执行限制（独立探针页）</text><text x="54" y="612" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">nonce每个HTML响应随机生成</text><text x="54" y="640" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">有nonce：allowed=true</text><text x="54" y="668" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">无nonce：blockedRan应保持false</text><rect x="625" y="555" width="530" height="155" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="639" y="584" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">Cookie与实验边界</text><text x="639" y="612" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">HttpOnly：脚本不读sid，浏览器可发送</text><text x="639" y="640" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">credentials include：请求同站跨源凭据</text><text x="639" y="668" font-family="system-ui,sans-serif" font-size="20" fill="#173c2e">本HTTP夹具未验证Secure/跨站SameSite</text><text x="35" y="790" font-family="system-ui,sans-serif" font-size="21" fill="#173c2e">Node验证响应头与服务端效果；真正CORS/CSP/Cookie脚本限制必须用浏览器另验。</text></svg>
