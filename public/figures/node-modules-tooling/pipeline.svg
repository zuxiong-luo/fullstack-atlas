<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">
<title>类型检查、产物路径、运行时输入是三道边界</title>
<desc>示例固定 Node 22.12.0 与 TypeScript 5.7.3；不经过打包器。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#285443"/></marker></defs>
<rect width="960" height="480" rx="24" fill="#f3f7f4"/>
<text x="38" y="48" font-family="system-ui,sans-serif" font-size="25" fill="#173c2e" font-weight="700">类型检查、产物路径、运行时输入是三道边界</text>
<text x="38" y="80" font-family="system-ui,sans-serif" font-size="16" fill="#496256">示例固定 Node 22.12.0 与 TypeScript 5.7.3；不经过打包器。</text>
<rect x="35" y="130" width="250" height="130" rx="12" fill="#fff" stroke="#5a8b73" stroke-width="2"/>
<text x="53" y="160" font-family="system-ui,sans-serif" font-size="18" fill="#183e2e">src/main.ts</text>
<text x="53" y="187" font-family="system-ui,sans-serif" font-size="18" fill="#183e2e">import ./notes.js</text>
<text x="53" y="214" font-family="system-ui,sans-serif" font-size="18" fill="#183e2e">Note 只用于类型</text>
<rect x="350" y="130" width="250" height="130" rx="12" fill="#fff" stroke="#5a8b73" stroke-width="2"/>
<text x="368" y="160" font-family="system-ui,sans-serif" font-size="18" fill="#183e2e">tsc / NodeNext</text>
<text x="368" y="187" font-family="system-ui,sans-serif" font-size="18" fill="#183e2e">检查模块及静态类型</text>
<text x="368" y="214" font-family="system-ui,sans-serif" font-size="18" fill="#183e2e">擦除类型、输出 JS</text>
<rect x="665" y="130" width="255" height="130" rx="12" fill="#fff" stroke="#5a8b73" stroke-width="2"/>
<text x="683" y="160" font-family="system-ui,sans-serif" font-size="18" fill="#183e2e">dist/main.js</text>
<text x="683" y="187" font-family="system-ui,sans-serif" font-size="18" fill="#183e2e">Node 按真实路径加载</text>
<text x="683" y="214" font-family="system-ui,sans-serif" font-size="18" fill="#183e2e">不读取 TS 的类型约束</text>
<rect x="350" y="325" width="570" height="100" rx="12" fill="#fff" stroke="#5a8b73" stroke-width="2"/>
<text x="368" y="355" font-family="system-ui,sans-serif" font-size="18" fill="#183e2e">JSON 输入：unknown → parseNote → Note</text>
<text x="368" y="382" font-family="system-ui,sans-serif" font-size="18" fill="#183e2e">类型名无法检查网络输入，必须执行运行时校验</text>
<path d="M285 195H348" fill="none" stroke="#285443" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M600 195H663" fill="none" stroke="#285443" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M790 262V322" fill="none" stroke="#285443" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
