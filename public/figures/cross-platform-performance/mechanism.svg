<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title desc"><title id="title">固定工作负载下的四个测量边界</title><desc id="desc">固定工作负载下的四个测量边界</desc><defs><marker id="arrow" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315c48"/></marker></defs><style>text{font-family:Arial,'PingFang SC',sans-serif;font-size:19px;fill:#244a38}.heading{font-size:27px;font-weight:bold}.small{font-size:16px}.box{fill:white;stroke:#729984;stroke-width:2}.warn{fill:#fff4df;stroke:#b18a4a;stroke-width:2}.arrow{stroke:#315c48;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="1040" height="580" rx="20" fill="#f2f7f3"/>
<text x="35" y="48" class="heading">先定义边界，再测真实平台；当前代表平台：Web DOM</text>
<rect x="40" y="100" width="450" height="150" rx="12" class="box"/><text x="65" y="137">启动</text><text x="65" y="174">HTML 标记 → React layout commit</text><text x="65" y="209">另报第二次 rAF 调度机会</text><text x="65" y="235" class="small">不是原生冷启、首屏完成或物理呈现</text>
<rect x="550" y="100" width="450" height="150" rx="12" class="box"/><text x="575" y="137">滚动：同一 2000 行 / 120 步</text><text x="575" y="174">全量 DOM 2000 / 窗口化保留邻近项</text><text x="575" y="209">119 个 rAF 间隔 + DOM 数 + 终点</text><text x="575" y="235" class="small">回调间隔 ≠ 显示器实际 FPS</text>
<rect x="40" y="300" width="450" height="150" rx="12" class="box"/><text x="65" y="337">通信：真实 Worker 往返</text><text x="65" y="374">预热 1 次，再 8 × 1MiB 校验首尾</text><text x="65" y="409">clone：发送方保留；transfer：脱离</text><text x="65" y="435" class="small">计时不包含 buffer 创建，不推广零拷贝</text>
<rect x="550" y="300" width="450" height="150" rx="12" class="warn"/><text x="575" y="337">内存：先检测能力</text><text x="575" y="374">有 performance.memory 才读近似堆</text><text x="575" y="409">不可用明确显示，不伪造 0</text><text x="575" y="435" class="small">非标准 JS 堆 ≠ 进程 RSS / GPU / 原生</text>
<text x="45" y="505">记录版本、视口、缓存、构建、样本数与运行顺序，重复再讨论。</text>
<text x="45" y="544" class="small">Web 观察不用于 Flutter / RN 真机排名；各平台工具与环境须单独验收。</text>
</svg>