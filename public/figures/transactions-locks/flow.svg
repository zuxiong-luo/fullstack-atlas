<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="560" viewBox="0 0 1060 560" role="img" aria-labelledby="t d"><title id="t">同一库存行：第二连接等待，再按新版本检查</title><desc id="d">BEGIN → purchase(a,1) → stock 1→0；暂不提交；purchase(b,1) → 等待行锁（真实pg_stat_activity验证）；COMMIT → 释放锁；订单a与stock=0同时可见；重新检查stock&gt;0 → 不满足 → 异常；订单b回滚；库存0、订单1；CHECK约束没有代替条件更新</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#365c49"/></marker></defs><rect width="1060" height="560" rx="20" fill="#f2f7f3"/><g fill="#243e31" font-family="system-ui,sans-serif"><text x="30" y="45" font-size="27" font-weight="700">同一库存行：第二连接等待，再按新版本检查</text><rect x="30" y="82" width="1000" height="62" rx="10" fill="white" stroke="#83a18c"/><text x="48" y="120" font-size="21" font-weight="700">A</text><text x="125" y="120" font-size="20">BEGIN → purchase(a,1) → stock 1→0；暂不提交</text><path d="M72 145V162" stroke="#365c49" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="165" width="1000" height="62" rx="10" fill="white" stroke="#83a18c"/><text x="48" y="203" font-size="21" font-weight="700">B</text><text x="125" y="203" font-size="20">purchase(b,1) → 等待行锁（真实pg_stat_activity验证）</text><path d="M72 228V245" stroke="#365c49" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="248" width="1000" height="62" rx="10" fill="white" stroke="#83a18c"/><text x="48" y="286" font-size="21" font-weight="700">A</text><text x="125" y="286" font-size="20">COMMIT → 释放锁；订单a与stock=0同时可见</text><path d="M72 311V328" stroke="#365c49" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="331" width="1000" height="62" rx="10" fill="white" stroke="#83a18c"/><text x="48" y="369" font-size="21" font-weight="700">B</text><text x="125" y="369" font-size="20">重新检查stock&gt;0 → 不满足 → 异常；订单b回滚</text><path d="M72 394V411" stroke="#365c49" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="414" width="1000" height="62" rx="10" fill="white" stroke="#83a18c"/><text x="48" y="452" font-size="21" font-weight="700">结果</text><text x="125" y="452" font-size="20">库存0、订单1；CHECK约束没有代替条件更新</text><text x="30" y="535" font-size="16">示意步骤，不表示耗时比例；正常与故障路径由实际PostgreSQL测试验证。</text></g></svg>