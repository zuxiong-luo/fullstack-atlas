<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc"><title id="title">背压限制的是继续生产，不是全部内存</title><desc id="desc">生产者经可读缓冲、可写缓冲发给客户端。消费者变慢，write返回false后暂停读取，缓冲排出drain再继续。每请求缓冲和并发共同影响总量。</desc><defs><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#315c48"/></marker></defs><rect width="1040" height="500" rx="20" fill="#f3f8f5"/><g font-family="system-ui,sans-serif" fill="#213d32"><text x="40" y="50" font-size="27" font-weight="700">下游变慢，就少向上游要一些数据</text><g fill="#fff" stroke="#79a18d" stroke-width="2"><rect x="40" y="112" width="190" height="102" rx="12"/><rect x="310" y="112" width="190" height="102" rx="12"/><rect x="580" y="112" width="190" height="102" rx="12"/><rect x="850" y="112" width="150" height="102" rx="12"/></g><g font-size="21"><text x="62" y="153">async 生成器</text><text x="62" y="185">一次生成一行</text><text x="331" y="153">Readable 缓冲</text><text x="331" y="185">16 KiB 阈值</text><text x="601" y="153">HTTP 可写缓冲</text><text x="601" y="185">socket / 内核</text><text x="872" y="153">客户端</text><text x="872" y="185">读取 CSV</text></g><g fill="none" stroke="#315c48" stroke-width="2.5" marker-end="url(#b)"><path d="M230 161 H308"/><path d="M500 161 H578"/><path d="M770 161 H848"/><path d="M675 214 V276 H405 V216"/></g><g font-size="20"><text x="254" y="140">拉取</text><text x="518" y="140">写入</text><text x="786" y="140">发送</text><text x="420" y="305">write=false：停止继续读取</text><text x="420" y="337">drain：已有缓冲排出后再继续</text><text x="40" y="399">pipeline 管理流量协调；取消信号停止生成并清理流。</text><text x="40" y="440">highWaterMark 是触发背压的阈值。单块、其他缓冲及并发数也会影响总内存。</text></g></g></svg>
