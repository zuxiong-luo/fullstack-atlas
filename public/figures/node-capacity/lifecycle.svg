<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc"><title id="title">导出请求的有限生命周期</title><desc id="desc">请求先校验参数，申请导出名额；无名额立即503，有名额建立信号，将行源接到HTTP响应。成功、断开、超时、源错误都进入finally释放；已有200响应不能再改成JSON错误。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#315c48"/></marker></defs><rect width="1040" height="620" rx="20" fill="#f3f8f5"/><g font-family="system-ui,sans-serif" fill="#213d32"><text x="40" y="48" font-size="27" font-weight="700">一个导出名额，只覆盖一次请求的完整工作</text><g fill="#fff" stroke="#79a18d" stroke-width="2"><rect x="40" y="90" width="180" height="86" rx="12"/><rect x="280" y="90" width="210" height="86" rx="12"/><rect x="580" y="90" width="180" height="86" rx="12"/><rect x="580" y="240" width="390" height="96" rx="12"/><rect x="70" y="240" width="350" height="96" rx="12"/><rect x="310" y="425" width="440" height="105" rx="12"/></g><g font-size="21"><text x="65" y="124" font-size="18">校验 rows / delay</text><text x="65" y="154">无效：400</text><text x="305" y="125">tryAcquire()</text><text x="305" y="154" font-size="18">active &lt; maxActive</text><text x="603" y="125">注册取消 / 超时</text><text x="603" y="154">发送 CSV 头</text><text x="602" y="279">生成器 → Readable → HTTP</text><text x="602" y="310">pipeline 协调背压、结束与错误</text><text x="94" y="279">没有名额：503 EXPORT_BUSY</text><text x="94" y="310">不进入等待队列，不生成任何行</text><text x="336" y="463">finally：清定时器、移除监听</text><text x="336" y="501">删除 Controller，release() 恰好一次</text></g><g fill="none" stroke="#315c48" stroke-width="2.5" marker-end="url(#a)"><path d="M220 134 H278"/><path d="M490 134 H578"/><path d="M670 176 V238"/><path d="M380 176 V212 H245 V238"/><path d="M780 336 V377 H530 V423"/></g><g font-size="18"><text x="506" y="116">有名额</text><text x="272" y="210">已满</text><text x="550" y="369">成功 / 客户端断开 / 超时 / 源错误</text><text x="40" y="579">教学实现：仅导出限并发；health 不占名额。流中失败会终止响应，不能改写已发出的 200。</text></g></g></svg>
