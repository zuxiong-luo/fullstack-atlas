<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc"><title id="title">上下文恢复是新一代资源，不是继续使用旧句柄</title><desc id="desc">loss取消RAF并清空场景和query引用，restore事件后创建新shader/VAO/buffer；React卸载和重复清理都需要幂等。</desc><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285443"/></marker></defs><rect width="1000" height="780" fill="#f3f7f4"/><g font-family="system-ui,PingFang SC,sans-serif"><text x="30" y="44" font-size="28" fill="#173c2e">上下文恢复是新一代资源，不是继续使用旧句柄</text><rect x="40" y="110" width="920" height="100" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="141" font-size="20" fill="#173c2e">创建G1：program/VAO/buffer + timer queries</text><text x="56" y="170" font-size="20" fill="#173c2e">相同几何：逐项N次draw 或 实例化1次draw</text><path d="M500 215L500 260" stroke="#285443" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="40" y="265" width="920" height="110" rx="12" fill="#fff4dc" stroke="#6d987f" stroke-width="2"/><text x="56" y="296" font-size="20" fill="#173c2e">webglcontextlost：preventDefault，取消RAF</text><text x="56" y="325" font-size="20" fill="#173c2e">立即退休G1场景和查询引用；旧对象不留到恢复后删除</text><path d="M500 380L500 425" stroke="#285443" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="40" y="430" width="920" height="110" rx="12" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="56" y="461" font-size="20" fill="#173c2e">收到webglcontextrestored事件后才重建G2</text><text x="56" y="490" font-size="20" fill="#173c2e">重新编译/上传/初始化状态；丢掉旧计时窗口</text><rect x="40" y="600" width="920" height="110" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="631" font-size="20" fill="#173c2e">卸载：取消RAF、断开ResizeObserver、移除事件、释放当前G2</text><text x="56" y="660" font-size="20" fill="#173c2e">CPU夹具100轮句柄回零证明本例清理调用</text><text x="56" y="689" font-size="20" fill="#173c2e">真实显存、驱动缓存与真机稳定性仍需各自观测</text></g></svg>
