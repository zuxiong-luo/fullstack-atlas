<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc"><title id="title">CPU提交时间与GPU区间时间是两条证据</title><desc id="desc">performance.now包住CPU调用；timer query由GPU异步返回纳秒，等待available并排除disjoint，readPixels在独立探针里。</desc><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285443"/></marker></defs><rect width="1000" height="780" fill="#f3f7f4"/><g font-family="system-ui,PingFang SC,sans-serif"><text x="30" y="44" font-size="28" fill="#173c2e">CPU提交时间与GPU区间时间是两条证据</text><rect x="40" y="110" width="920" height="105" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="141" font-size="20" fill="#173c2e">CPU：performance.now → draw调用/每项uniform → now</text><text x="56" y="170" font-size="20" fill="#173c2e">只测当前线程提交区间；不等于GPU已完成</text><rect x="40" y="275" width="920" height="130" rx="12" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="56" y="306" font-size="20" fill="#173c2e">GPU：beginQuery → draw命令 → endQuery</text><text x="56" y="335" font-size="20" fill="#173c2e">后续事件循环/帧再查询available，结果纳秒÷10⁶为毫秒</text><text x="56" y="364" font-size="20" fill="#173c2e">不可用=unsupported；没完成=waiting；disjoint=丢弃</text><rect x="40" y="465" width="920" height="125" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="496" font-size="20" fill="#173c2e">最多4个未完成query，窗口保留最后60个有效样本</text><text x="56" y="525" font-size="20" fill="#173c2e">未available不读RESULT，不忙等，不把CPU时间填进GPU栏</text><text x="56" y="554" font-size="20" fill="#173c2e">CPU/GPU时间不相加为帧总时长</text><rect x="40" y="650" width="920" height="75" rx="12" fill="#fff4dc" stroke="#6d987f" stroke-width="2"/><text x="56" y="681" font-size="20" fill="#173c2e">readPixels/getError是独立诊断，可能同步等待并影响后续帧</text><text x="56" y="710" font-size="20" fill="#173c2e">图为测量边界，不是虚构的性能曲线</text></g></svg>
