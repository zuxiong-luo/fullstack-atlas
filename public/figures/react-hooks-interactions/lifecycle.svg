<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">查询从 slow 切到 fast 的 Effect 生命周期</title><desc id="desc">slow 的 setup 创建独立 active 标记。切换到 fast 后先 cleanup slow，设为 false 并 abort，再 setup fast。fast 返回后更新状态，旧 slow 即使返回也被拒绝。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#376b59"/></marker></defs><rect width="1000" height="620" fill="#f4f8f5" rx="18"/><g font-family="system-ui,sans-serif" fill="#203e34"><text x="40" y="45" font-size="26" font-weight="bold">一次 Effect 只拥有自己那一轮请求</text><g font-size="20"><text x="40" y="88">控制顺序示意，不是实测时间；快慢由测试手动控制</text><text x="60" y="142">组件 query</text><text x="355" y="142">slow 请求</text><text x="705" y="142">fast 请求</text></g><g stroke="#9db5aa" stroke-dasharray="6 5"><path d="M130 160V535M410 160V535M760 160V535"/></g><g stroke="#376b59" stroke-width="2" marker-end="url(#arrow)"><path d="M130 190H410"/><path d="M130 290H410"/><path d="M130 365H760"/><path d="M760 435H130"/><path d="M410 510H130"/></g><g font-size="18"><text x="155" y="180">setup：active=true</text><text x="155" y="255">query 改为 fast，提交新界面</text><text x="155" y="280">cleanup：active=false，abort()</text><text x="450" y="352">新 setup：新的 active=true</text><text x="420" y="424">fast 成功 → 接受结果</text><text x="150" y="498">旧 slow 返回 → active=false，忽略</text><text x="40" y="577">取消节省资源；有效性标记阻止过期回写。两者职责不同。</text></g></g></svg>
