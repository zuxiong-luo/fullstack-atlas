<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" role="img" aria-labelledby="t d"><title id="t">向下处理和向上完成都属于 render</title><desc id="d">App进入Probe再进入span。span完成回到Probe再回到App。结束之后才进入commit。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#365f50"/></marker></defs><rect width="940" height="420" rx="16" fill="#f5f7f2"/><g font-family="system-ui,sans-serif" fill="#234c3b" font-size="20"><text x="30" y="40" font-size="25">render：begin 与 complete 是同一阶段的两个方向</text><g fill="#fff" stroke="#658779"><rect x="70" y="100" width="170" height="60" rx="8"/><rect x="330" y="190" width="170" height="60" rx="8"/><rect x="590" y="280" width="170" height="60" rx="8"/></g><text x="125" y="139">App</text><text x="380" y="229">Probe</text><text x="642" y="319">span</text><g fill="none" stroke="#365f50" stroke-width="2" marker-end="url(#a)"><path d="M240 130L330 210"/><path d="M500 220L590 300"/><path d="M590 330L500 250" stroke-dasharray="7 5"/><path d="M330 240L190 160" stroke-dasharray="7 5"/></g><text x="265" y="150">begin</text><text x="523" y="242">begin</text><text x="440" y="320">complete</text><text x="190" y="274">complete</text><text x="30" y="388">实线：向下处理；虚线：完成并回退。所有 render 完成之后，才考虑提交。</text></g></svg>
