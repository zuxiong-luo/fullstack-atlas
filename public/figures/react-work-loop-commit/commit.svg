<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" role="img" aria-labelledby="t d"><title id="t">主要提交过程和独立passive刷新</title><desc id="d">render完成后顺序执行before mutation、mutation、current切换、layout。passive刷新单独处理cleanup再setup，可能当前任务内同步也可能后续调度。绘制时间不固定在passive之前。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#365f50"/></marker></defs><rect width="1040" height="540" rx="16" fill="#f5f7f2"/><g font-family="system-ui,sans-serif" fill="#234c3b" font-size="19"><text x="28" y="43" font-size="25">render 完成 ≠ 已提交 ≠ 已绘制</text><text x="28" y="80">以下是常见客户端路径的阶段图，不表示每段耗时。</text><g fill="#fff" stroke="#658779"><rect x="25" y="125" width="215" height="110" rx="8"/><rect x="275" y="125" width="220" height="110" rx="8"/><rect x="530" y="125" width="210" height="110" rx="8"/><rect x="775" y="125" width="235" height="110" rx="8"/></g><text x="40" y="160">before mutation</text><text x="40" y="199">变更前信息读取</text><text x="290" y="160">mutation</text><text x="290" y="190">DOM / ref 拆除</text><text x="290" y="220">layout cleanup</text><text x="545" y="160">current 切换</text><text x="545" y="199">完成树成为当前树</text><text x="790" y="160">layout</text><text x="790" y="190">ref 绑定</text><text x="790" y="220">layout setup</text><g stroke="#365f50" stroke-width="2" marker-end="url(#a)"><path d="M240 180H275"/><path d="M495 180H530"/><path d="M740 180H775"/></g><text x="30" y="278">主要提交过程不会像 concurrent render 那样在 Fiber 单元间主动让出。</text><rect x="30" y="315" width="980" height="110" rx="8" fill="#e4eee6" stroke="#658779"/><text x="48" y="350">独立刷新入口：passive cleanup → passive setup</text><text x="48" y="390">可能在当前任务内同步刷新，也可能安排后续回调；不是固定的“绘制后阶段”。</text><text x="30" y="474">浏览器 paint 取决于渲染机会。rAF 回调同样不能证明绘制已经完成。</text></g></svg>
