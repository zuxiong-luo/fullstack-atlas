<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-labelledby="title desc"><title id="title">alpha混合是颜色运算，不是自动的空间排序</title><desc id="desc">直通alpha颜色的source-over在不透明背景上有明确公式，交换源与目标会改变结果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#356b58"/></marker></defs><rect width="940" height="500" fill="#f7faf7"/><g font-family="system-ui,sans-serif"><text x="28" y="42" font-size="27" fill="#23473b">alpha混合是颜色运算，不是自动的空间排序</text><rect x="40" y="100" width="385" height="130" rx="12" fill="#edf5ee" stroke="#668c78"/><text x="55" y="131" font-size="18" fill="#23473b">源颜色是直通alpha（未预乘）</text><text x="55" y="159" font-size="18" fill="#23473b">RGBout = RGBsrc × Asrc</text><text x="55" y="187" font-size="18" fill="#23473b">             + RGBdst × (1-Asrc)</text><text x="55" y="215" font-size="18" fill="#23473b">本例用独立alpha因子保持A合成正确</text><rect x="515" y="100" width="385" height="130" rx="12" fill="#edf5ee" stroke="#668c78"/><text x="530" y="131" font-size="18" fill="#23473b">同样是半透明红与蓝</text><text x="530" y="159" font-size="18" fill="#23473b">黑底 → 蓝 → 红：(0.5,0,0.25)</text><text x="530" y="187" font-size="18" fill="#23473b">黑底 → 红 → 蓝：(0.25,0,0.5)</text><text x="530" y="215" font-size="18" fill="#23473b">透明混合通常不满足交换律</text><rect x="40" y="320" width="860" height="105" rx="12" fill="#edf5ee" stroke="#668c78"/><text x="55" y="351" font-size="18" fill="#23473b">不透明物体通常先画；半透明场景常从远到近画并关闭深度写入。</text><text x="55" y="379" font-size="18" fill="#23473b">本例两张二维面片关闭深度测试，只验证绘制顺序与混合。</text><text x="55" y="407" font-size="18" fill="#23473b">复杂相交透明几何不能只靠“按物体中心排序”彻底解决。</text></g></svg>