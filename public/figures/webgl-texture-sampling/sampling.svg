<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-labelledby="title desc"><title id="title">从UV到纹素：包裹、过滤与mipmap分别解决不同问题</title><desc id="desc">上方分别说明坐标边界与放大缩小过滤，下方展示3乘5非二次幂纹理的三层mipmap。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#356b58"/></marker></defs><rect width="940" height="500" fill="#f7faf7"/><g font-family="system-ui,sans-serif"><text x="28" y="42" font-size="27" fill="#23473b">从UV到纹素：包裹、过滤与mipmap分别解决不同问题</text><rect x="30" y="95" width="270" height="130" rx="12" fill="#edf5ee" stroke="#668c78"/><text x="45" y="126" font-size="18" fill="#23473b">UV：连续的采样坐标</text><text x="45" y="154" font-size="18" fill="#23473b">uv × 1：一份图案</text><text x="45" y="182" font-size="18" fill="#23473b">uv × 3：三个周期</text><text x="45" y="210" font-size="18" fill="#23473b">REPEAT 与 CLAMP决定边界</text><rect x="345" y="95" width="250" height="130" rx="12" fill="#edf5ee" stroke="#668c78"/><text x="360" y="126" font-size="18" fill="#23473b">放大：mag filter</text><text x="360" y="154" font-size="18" fill="#23473b">NEAREST：取邻近样本</text><text x="360" y="182" font-size="18" fill="#23473b">LINEAR：附近样本加权</text><text x="360" y="210" font-size="18" fill="#23473b">不使用mipmap层</text><rect x="640" y="95" width="270" height="130" rx="12" fill="#edf5ee" stroke="#668c78"/><text x="655" y="126" font-size="18" fill="#23473b">缩小：min filter</text><text x="655" y="154" font-size="18" fill="#23473b">像素覆盖较多纹素</text><text x="655" y="182" font-size="18" fill="#23473b">mipmap降低高频跳变</text><text x="655" y="210" font-size="18" fill="#23473b">不保证消除所有锯齿</text><rect x="30" y="315" width="270" height="100" rx="12" fill="#edf5ee" stroke="#668c78"/><text x="45" y="346" font-size="18" fill="#23473b">level0：3 × 5</text><text x="45" y="374" font-size="18" fill="#23473b">RGBA 60字节</text><text x="45" y="402" font-size="18" fill="#23473b">本例为NPOT</text><rect x="345" y="315" width="250" height="100" rx="12" fill="#edf5ee" stroke="#668c78"/><text x="360" y="346" font-size="18" fill="#23473b">level1：1 × 2</text><text x="360" y="374" font-size="18" fill="#23473b">各维向下取整</text><text x="360" y="402" font-size="18" fill="#23473b">每维至少为1</text><rect x="640" y="315" width="270" height="100" rx="12" fill="#edf5ee" stroke="#668c78"/><text x="655" y="346" font-size="18" fill="#23473b">level2：1 × 1</text><text x="655" y="374" font-size="18" fill="#23473b">完整链条到此结束</text><text x="655" y="402" font-size="18" fill="#23473b">由generateMipmap生成</text><path d="M304 366H338" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="299" y="290" font-size="16" fill="#23473b">下采样</text><path d="M599 366H633" fill="none" stroke="#356b58" stroke-width="3" marker-end="url(#arrow)"/><text x="594" y="290" font-size="16" fill="#23473b">下采样</text></g></svg>