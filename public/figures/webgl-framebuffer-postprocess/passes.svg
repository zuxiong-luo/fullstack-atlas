<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc"><title id="title">Framebuffer选写入位置，纹理保存可采样的颜色</title><desc id="desc">第一Pass画到RGBA8纹理与Depth16附件；第二Pass先绑定默认帧缓冲再采样该纹理，避免同时读写同一图像。</desc><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285443"/></marker></defs><rect width="1000" height="780" fill="#f3f7f4"/><g font-family="system-ui,PingFang SC,sans-serif"><text x="30" y="44" font-size="28" fill="#173c2e">Framebuffer选写入位置，纹理保存可采样的颜色</text><rect x="40" y="110" width="920" height="105" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="141" font-size="20" fill="#173c2e">CPU创建：Framebuffer描述附件关系</text><text x="56" y="170" font-size="20" fill="#173c2e">颜色附件=RGBA8 Texture；深度附件=Depth16 Renderbuffer</text><path d="M500 220L500 265" stroke="#285443" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="40" y="270" width="920" height="115" rx="12" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="56" y="301" font-size="20" fill="#173c2e">Pass1：bindFramebuffer(offscreen)，viewport=离屏尺寸</text><text x="56" y="330" font-size="20" fill="#173c2e">绘制彩色三角形 → 写入颜色纹理与深度</text><text x="56" y="359" font-size="20" fill="#173c2e">checkFramebufferStatus必须先完整</text><path d="M500 390L500 435" stroke="#285443" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="40" y="440" width="920" height="125" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="471" font-size="20" fill="#173c2e">Pass2：先bindFramebuffer(null)，viewport=画布尺寸</text><text x="56" y="500" font-size="20" fill="#173c2e">TEXTURE0绑定上一Pass颜色纹理；sampler uniform写0</text><text x="56" y="529" font-size="20" fill="#173c2e">全屏三角形读取颜色，输出原色/灰度/边缘</text><rect x="40" y="630" width="920" height="95" rx="12" fill="#fff4dc" stroke="#6d987f" stroke-width="2"/><text x="56" y="661" font-size="20" fill="#173c2e">绑定不同目标不是复制纹理；同一上下文命令顺序维护依赖</text><text x="56" y="690" font-size="20" fill="#173c2e">不要一边采样同一图像，一边把它作为当前写入附件</text></g></svg>
