<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc"><title id="title">离屏目标：完整性、尺寸和生命周期都要管理</title><desc id="desc">每次尺寸改变先建立完整新目标再释放旧目标；部分初始化失败销毁已建句柄，清理恢复默认绑定。</desc><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285443"/></marker></defs><rect width="1000" height="780" fill="#f3f7f4"/><g font-family="system-ui,PingFang SC,sans-serif"><text x="30" y="44" font-size="28" fill="#173c2e">离屏目标：完整性、尺寸和生命周期都要管理</text><rect x="40" y="110" width="920" height="110" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="141" font-size="20" fill="#173c2e">目标尺寸=画布尺寸×scale，再受设备上限/2048预算约束</text><text x="56" y="170" font-size="20" fill="#173c2e">640×480画布，scale=.5 → 320×240</text><text x="56" y="199" font-size="20" fill="#173c2e">RGBA8+Depth16名义字节=320×240×6=460800</text><rect x="40" y="285" width="440" height="175" rx="12" fill="#dbeedc" stroke="#6d987f" stroke-width="2"/><text x="56" y="316" font-size="20" fill="#173c2e">正常resize</text><text x="56" y="345" font-size="20" fill="#173c2e">创建新纹理/FBO/RBO</text><text x="56" y="374" font-size="20" fill="#173c2e">验证FRAMEBUFFER_COMPLETE</text><text x="56" y="403" font-size="20" fill="#173c2e">成功才切换并释放旧目标</text><text x="56" y="432" font-size="20" fill="#173c2e">同尺寸复用，不每帧重建</text><rect x="520" y="285" width="440" height="175" rx="12" fill="#fff4dc" stroke="#6d987f" stroke-width="2"/><text x="536" y="316" font-size="20" fill="#173c2e">受控失败：不连接附件</text><text x="536" y="345" font-size="20" fill="#173c2e">状态不完整 → 显示错误</text><text x="536" y="374" font-size="20" fill="#173c2e">释放部分创建句柄</text><text x="536" y="403" font-size="20" fill="#173c2e">不继续假装绘制成功</text><text x="536" y="432" font-size="20" fill="#173c2e">修复选项后重建</text><rect x="40" y="540" width="920" height="120" rx="12" fill="#fff" stroke="#6d987f" stroke-width="2"/><text x="56" y="571" font-size="20" fill="#173c2e">销毁顺序：离屏目标 → 场景buffer/VAO/program</text><text x="56" y="600" font-size="20" fill="#173c2e">上下文丢失：旧代资源先退休，恢复后重新创建</text><text x="56" y="629" font-size="20" fill="#173c2e">名义字节非驱动真实显存；CPU句柄检查非真实GPU泄漏测量</text><text x="40" y="725" font-size="18" fill="#173c2e">状态完整只证明附件配置可绘制，不保证shader、颜色或UV已经正确。</text></g></svg>
