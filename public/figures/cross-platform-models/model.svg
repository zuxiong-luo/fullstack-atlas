<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="t d"><title id="t">相同业务规则，不同宿主路径；能力仍受平台约束</title><desc id="d">相同规则：设备归属、消息顺序、取消与晚到结果；React描述 → C++ShadowTree / Yoga → 宿主视图挂载；Widget → Element / State → RenderObject → 引擎 / 宿主；宿主输入 / 命中与派发 → 回调 → 新业务状态；RN原生模块 / Flutter通道 → 权限 / SDK → 系统能力；JS/Dart逻辑通过 ≠ 原生渲染 / 权限 / 真机通过</desc><rect width="1100" height="650" rx="20" fill="#f2f7f3"/><g font-family="system-ui,sans-serif" fill="#243e31"><text x="30" y="45" font-size="26" font-weight="700">相同业务规则，不同宿主路径；能力仍受平台约束</text><rect x="30" y="80" width="1040" height="65" rx="10" fill="white" stroke="#83a18c"/><text x="50" y="120" font-size="22" font-weight="700">业务</text><text x="140" y="120" font-size="20">相同规则：设备归属、消息顺序、取消与晚到结果</text><rect x="30" y="165" width="1040" height="65" rx="10" fill="white" stroke="#83a18c"/><text x="50" y="205" font-size="22" font-weight="700">RN</text><text x="140" y="205" font-size="20">React描述 → C++ShadowTree / Yoga → 宿主视图挂载</text><rect x="30" y="250" width="1040" height="65" rx="10" fill="white" stroke="#83a18c"/><text x="50" y="290" font-size="22" font-weight="700">Flutter</text><text x="140" y="290" font-size="20">Widget → Element / State → RenderObject → 引擎 / 宿主</text><rect x="30" y="335" width="1040" height="65" rx="10" fill="white" stroke="#83a18c"/><text x="50" y="375" font-size="22" font-weight="700">事件</text><text x="140" y="375" font-size="20">宿主输入 / 命中与派发 → 回调 → 新业务状态</text><rect x="30" y="420" width="1040" height="65" rx="10" fill="white" stroke="#83a18c"/><text x="50" y="460" font-size="22" font-weight="700">能力</text><text x="140" y="460" font-size="20">RN原生模块 / Flutter通道 → 权限 / SDK → 系统能力</text><rect x="30" y="505" width="1040" height="65" rx="10" fill="white" stroke="#83a18c"/><text x="50" y="545" font-size="22" font-weight="700">证据</text><text x="140" y="545" font-size="20">JS/Dart逻辑通过 ≠ 原生渲染 / 权限 / 真机通过</text><text x="30" y="625" font-size="16">职责示意，不代表线程、耗时比例或经过设备验证的性能结论。</text></g></svg>