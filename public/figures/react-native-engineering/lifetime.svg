<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 820" role="img" aria-labelledby="t d"><title id="t">导航焦点、前后台与结果代际</title><desc id="d">路由焦点和AppState active共同允许工作，暂停失效旧代，恢复发布idle；每次原生文件操作独有资源。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#325b86"/></marker></defs><rect width="820" height="820" fill="white"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,sans-serif" fill="#17324d"><text x="30" y="45" font-size="27" font-weight="700">一份结果，先确认当前页面是否还拥有它</text><text x="30" y="84" font-size="19">状态机示意；不把CPU测试当成原生运行结果。</text><rect x="30" y="120" width="330" height="95" rx="13" fill="#eff5ff" stroke="#59769b"/><text x="48" y="154" font-size="18">路由：当前详情有focus</text><text x="48" y="184" font-size="18">页面可能仍挂载</text><rect x="460" y="120" width="330" height="95" rx="13" fill="#eff5ff" stroke="#59769b"/><text x="478" y="154" font-size="18">AppState.change：active</text><text x="478" y="184" font-size="18">不覆盖Android通知抽屉blur</text><path d="M195 215V245H410V275" fill="none" stroke="#325b86" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M625 215V245H410" fill="none" stroke="#325b86" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="220" y="275" width="380" height="85" rx="13" fill="#eff5ff" stroke="#59769b"/><text x="238" y="309" font-size="18">共同资格 eligible = true</text><text x="238" y="339" font-size="18">加载 / 能力调用拥有generation</text><path d="M320 360V410H195V445" fill="none" stroke="#325b86" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M500 360V410H625V445" fill="none" stroke="#325b86" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="445" width="330" height="115" rx="13" fill="#edf8ef" stroke="#59769b"/><text x="48" y="479" font-size="18">结果仍属当前代</text><text x="48" y="509" font-size="18">且页面仍eligible</text><text x="48" y="539" font-size="18">→ 发布ready / error</text><rect x="460" y="445" width="330" height="115" rx="13" fill="#fff6e8" stroke="#59769b"/><text x="478" y="479" font-size="18">失焦 / 后台 / dispose</text><text x="478" y="509" font-size="18">旧代立即失效；abort尽力取消</text><text x="478" y="539" font-size="18">→ 晚到结果只记录、丢弃UI</text><path d="M625 560V615H410V650" fill="none" stroke="#325b86" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="650" width="760" height="95" rx="13" fill="#eff5ff" stroke="#59769b"/><text x="48" y="684" font-size="18">恢复资格 → 显示idle → 可再次调用；旧原生调用未必停止</text><text x="48" y="714" font-size="18">每次文件调用独有目录；旧finally只删自己拥有的资源</text><text x="30" y="785" font-size="18">代际隔离发布资格；独有目录隔离资源；二者都不是副作用回滚。</text></g></svg>