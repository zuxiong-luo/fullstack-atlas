[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-notes-course"
version = "0.1.0"
description = "Local notes HTTP service for the Fullstack Atlas Python course"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.8", "pydantic==2.10.6", "starlette==0.45.3",
  "uvicorn==0.34.0", "httpx==0.28.1"
]

[project.scripts]
atlas-notes = "atlas_notes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
